<!-- Reference: Dash0 (https://www.dash0.com), observability, span latency heatmap + span list. Design study only, not wired to anything. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Dash0 study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b; --panel:#101012; --panel2:#151518; --panel3:#1a1a1e;
  --line:#222227; --line2:#2d2d34; --line3:#3a3a43;
  --text:#e6e6ea; --mut:#9b9ba5; --dim:#6a6a74;
  --accent:#7c7cff; --accent2:#a29bff; --accent-bg:rgba(124,124,255,.14); --accent-line:rgba(124,124,255,.5);
  --green:#3ecf8e; --green-bg:rgba(62,207,142,.13);
  --amber:#f5a524; --amber-bg:rgba(245,165,36,.13);
  --red:#f0554d; --red-bg:rgba(240,85,77,.13);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 12.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-width:1180px}
.num,.mono-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono);font-size:11px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
h1,h2,h3,p{margin:0}

/* top bar */
.top{display:flex;align-items:center;gap:var(--s4);height:44px;padding:0 var(--s5);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:13px;letter-spacing:.01em}
.tag{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:4px;background:var(--panel3);border:1px solid var(--line2);color:var(--mut)}
.tag.sb{color:var(--amber);border-color:rgba(245,165,36,.35);background:var(--amber-bg)}
.crumbs{color:var(--dim);display:flex;gap:var(--s2);align-items:center;margin-left:var(--s2)}
.crumbs b{color:var(--mut);font-weight:500}
.stats{margin-left:auto;display:flex;gap:var(--s2)}
.stat{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.stat span{color:var(--dim);font-size:11px}
.stat b{font-weight:600;font-size:13px}
.stat.hot b{color:var(--accent2)}

main{padding:var(--s4) var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s4);max-width:1760px;margin:0 auto}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ph{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);min-height:40px;border-bottom:1px solid var(--line);background:var(--panel)}
.ph h2{font-size:13px;font-weight:600}
.ph .cnt{color:var(--dim);font-size:11.5px}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.btn{border:1px solid var(--line2);background:var(--panel3);border-radius:5px;padding:3px 10px;font-size:12px;line-height:18px;color:var(--text)}
.btn:hover{border-color:var(--line3);background:#202025}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0a0a14;font-weight:600}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.bad{color:var(--red);border-color:rgba(240,85,77,.35);background:transparent}
.btn.bad:hover{background:var(--red-bg)}
.btn:disabled{opacity:.38;cursor:not-allowed;background:transparent}
.btn.sm{padding:1px 8px;font-size:11.5px;line-height:18px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px;color:var(--mut);line-height:18px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--accent-bg);color:var(--accent2)}

/* pills + chips */
.pill{display:inline-block;font:600 10px/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:4px;background:var(--panel3);border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--green);background:var(--green-bg);border-color:rgba(62,207,142,.3)}
.pill.warn{color:var(--amber);background:var(--amber-bg);border-color:rgba(245,165,36,.3)}
.pill.bad{color:var(--red);background:var(--red-bg);border-color:rgba(240,85,77,.35)}
.pill.acc{color:var(--accent2);background:var(--accent-bg);border-color:var(--accent-line)}
.pill.best{color:#0a0a14;background:var(--green);border-color:var(--green)}
.at{font:400 11px/1.4 var(--mono);color:var(--dim);white-space:nowrap}
.at::before{content:"["}.at::after{content:"]"}
.at.red{color:var(--red)}.at.amb{color:var(--amber)}.at.grn{color:var(--green)}.at.acc{color:var(--accent2)}
.at-more{font:italic 400 11px var(--sans);color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center}

/* queue */
.qhead,.qrow{display:grid;grid-template-columns:40px minmax(220px,1.3fr) 92px 112px 150px minmax(170px,1fr) 236px;gap:var(--s3);align-items:center;padding:0 var(--s4)}
.qhead{height:32px;color:var(--mut);font-size:11.5px;border-bottom:1px solid var(--line);background:var(--panel2)}
.qrow{min-height:48px;border-bottom:1px solid var(--line);position:relative}
.qrow:last-child{border-bottom:0}
.qrow.sel{background:linear-gradient(90deg,var(--accent-bg),transparent 60%)}
.qrow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.qrow.stop{background:linear-gradient(90deg,var(--red-bg),transparent 70%)}
.qrow.stop::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red)}
.qrow .nm{font-weight:500}
.qrow .sub{color:var(--dim);font-size:11.5px}
.qrow .rk{color:var(--dim);font:500 11px var(--mono)}
.qrow .ctl{display:flex;gap:var(--s2);justify-content:flex-end}
.qstop{grid-column:2 / -1;padding:0 0 var(--s2);display:flex;gap:var(--s2);align-items:center;color:var(--red);font-size:11.5px;margin-top:-6px}
.qrow.stop{padding-bottom:var(--s1)}
.qrow.stop>.main-line{display:contents}
.segbar{display:flex;gap:2px;align-items:center}
.segbar i{width:14px;height:8px;border-radius:2px;background:var(--line2)}
.segbar i.on{background:var(--green)}
.bestc{display:flex;flex-direction:column}
.bestc b{font-weight:500}
.live{color:var(--mut);font-size:11.5px;min-height:18px;padding:var(--s2) var(--s4);border-top:1px solid var(--line);background:var(--panel2)}

/* applicant header */
.aph{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.aph .l1{display:flex;align-items:center;gap:var(--s3)}
.aph h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.aph .sum{color:var(--mut)}
.aph .amt{font-size:18px;font-weight:600;margin-left:auto}

/* waterfall */
.wf{padding:var(--s2) var(--s4) var(--s3)}
.wfr{display:grid;grid-template-columns:150px 1fr 240px;gap:var(--s3);align-items:center;min-height:26px}
.wfr .lb{display:flex;gap:var(--s2);align-items:center;color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.dot.run{background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.track{position:relative;height:14px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line) calc(10% - 1px) 10%);border-radius:2px}
.bar{position:absolute;top:2px;bottom:2px;border-radius:2px;background:var(--accent);opacity:.85;min-width:3px}
.bar.run{background:repeating-linear-gradient(45deg,var(--amber) 0 5px,rgba(245,165,36,.35) 5px 10px);opacity:1;animation:slide 1.2s linear infinite;background-size:14px 14px}
@keyframes slide{to{background-position:14px 0}}
@media (prefers-reduced-motion:reduce){.bar.run{animation:none}}
.wfr .mt{color:var(--mut);font-size:11.5px}

/* heatmap */
.hm-legend{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4) var(--s2);color:var(--text);font-size:11px;font-weight:500;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:7px;height:7px;border-radius:1px;display:inline-block}
.grad{display:inline-block;width:110px;height:7px;border-radius:2px;background:linear-gradient(90deg,#262629,#d5d5da)}
.sep{width:1px;height:16px;background:var(--line2)}
.p99{font-size:11px;color:var(--mut)}
.p99 b{color:var(--green);font-weight:500}
.hm{padding:0 var(--s4) var(--s2)}
.hrow{display:grid;grid-template-columns:200px 1fr 92px;gap:var(--s3);align-items:center;margin-bottom:3px;transition:opacity .12s}
.hrow.dim{opacity:.28}
.hl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.hl b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl span{color:var(--dim);font-size:11px}
.cells{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.cell{height:24px;border-radius:2px;position:relative;transition:opacity .12s}
.cell.off{opacity:.12}
.cell.hl-col{box-shadow:0 0 0 1px var(--accent2)}
.cell.ill{outline:0}
.hp50{text-align:right;color:var(--mut);font-size:11.5px}
.hp50 b{color:var(--text);font-weight:500}
.hx{display:grid;grid-template-columns:200px 1fr 92px;gap:var(--s3);margin-top:var(--s1)}
.xl{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;color:var(--dim);font:400 10px var(--mono);text-align:center}
.xl span.s{color:var(--accent2);font-weight:500}
.hchips{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:var(--panel)}
.hchips .k{color:var(--dim);font-size:11.5px;margin-right:var(--s1)}
.chip{font:400 11px/1.4 var(--mono);color:var(--mut);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:2px 7px;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--line3);color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent2)}
.chip em{font-style:normal;color:var(--dim)}
.chip[aria-pressed=true] em{color:var(--accent2);opacity:.8}
.evalrow{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
.ev{padding:var(--s3) var(--s4);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.ev:last-child{border-right:0}
.ev span{color:var(--dim);font-size:11px}
.ev b{font-weight:600;font-size:15px}
.note{color:var(--dim);font-size:11px;padding:0 var(--s4) var(--s3)}
#tip{position:fixed;z-index:50;pointer-events:none;background:#1c1c21;border:1px solid var(--line3);border-radius:6px;padding:var(--s2) var(--s3);font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-width:260px}
#tip b{font-weight:600}
#tip .d{color:var(--mut)}

/* spans */
.sh,.sp{display:grid;grid-template-columns:minmax(320px,1fr) 128px 76px 96px 66px 92px 176px;gap:var(--s3);align-items:center;padding:0 var(--s4)}
.sh{height:34px;border-bottom:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:11.5px}
.sh .sortc{display:flex;gap:var(--s2);align-items:center}
.sp{min-height:52px;border-bottom:1px solid var(--line)}
.sp.best{background:linear-gradient(90deg,var(--green-bg),transparent 55%)}
.sp .nm{display:flex;align-items:flex-start;gap:var(--s2)}
.sp .nm .tx{display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line3);padding-left:var(--s2);min-width:0}
.sp.ok .nm .tx{border-left-color:var(--green)}
.sp.warn .nm .tx{border-left-color:var(--amber)}
.sp.bad .nm .tx{border-left-color:var(--red)}
.sp .nm .t{font-weight:500;font-size:13px}
.tgl{width:18px;height:18px;border:1px solid var(--line3);border-radius:3px;background:var(--panel2);color:var(--mut);display:grid;place-items:center;padding:0;font:600 12px/1 var(--mono);flex:none;margin-top:3px}
.tgl:hover{color:var(--text);border-color:var(--mut)}
.cellnum{font-size:13px}
.cellnum small{display:block;color:var(--amber);font-size:10.5px;line-height:1.2}
.dim0{color:var(--dim)}
.lat{display:flex;flex-direction:column;gap:3px}
.lat .row{display:flex;gap:var(--s2);align-items:baseline}
.lat .row b{font-weight:500;font-size:13px}
.lat .row i{font-style:normal;color:var(--accent2);font-size:11px}
.lat .ln{height:2px;background:var(--line2);border-radius:1px}
.lat .ln u{display:block;height:2px;background:var(--accent);border-radius:1px}
.child{display:grid;grid-template-columns:minmax(320px,1fr) 128px 76px 96px 66px 92px 176px;gap:var(--s3);padding:0 var(--s4);border-bottom:1px solid var(--line);background:rgba(255,255,255,.012)}
.child .tree{grid-column:1 / 6;padding:var(--s2) 0 var(--s3) 26px;display:flex;flex-direction:column;gap:6px}
.child .tree2{grid-column:6 / 8;padding:var(--s2) 0 var(--s3) 0;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:var(--s2);align-items:flex-start;position:relative;padding-left:var(--s4);border-left:1px solid var(--line3);margin-left:8px}
.crow::before{content:"";position:absolute;left:0;top:9px;width:10px;height:1px;background:var(--line3)}
.crow .txt{color:var(--text)}
.mk{flex:none;width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font:600 10px/1 var(--mono);margin-top:1px}
.mk.t{background:var(--green-bg);color:var(--green)}
.mk.f{background:var(--red-bg);color:var(--red)}
.mk.n{background:var(--panel3);color:var(--dim)}
.vlab{font-size:10.5px;color:var(--dim);white-space:nowrap}
.cond{color:var(--mut)}
.csec{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding-left:8px;margin-top:2px}

/* lower grid */
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.kv{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.kv div{padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.kv div:nth-child(4n){border-right:0}
.kv div:nth-child(n+5){border-top:1px solid var(--line)}
.kv span{color:var(--dim);font-size:11px}
.kv b{font-weight:600;font-size:16px}
.flags{padding:var(--s3) var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;border-bottom:1px solid var(--line)}
.flags .k{color:var(--dim);font-size:11.5px;margin-right:var(--s1)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--mut);font-size:11.5px;text-align:left;padding:0 var(--s4);height:32px;background:var(--panel2);border-bottom:1px solid var(--line)}
td{padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.disputed{color:var(--amber);font-size:11.5px}
.notice{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);max-height:430px;overflow:auto;line-height:1.6}
.notice p{color:#cfcfd6;padding-left:var(--s3);border-left:2px solid var(--line2)}
.notice p:first-child{border-left-color:var(--accent)}
.al td{padding:6px var(--s3);font-size:12px;vertical-align:top}
.al th{padding:0 var(--s3)}
.al .t{font:400 11px var(--mono);color:var(--mut);white-space:nowrap}
.al .d{font:400 10.5px var(--mono);color:var(--dim);white-space:nowrap}
.al .act{display:inline-flex;gap:6px;align-items:center;font:400 11px var(--mono)}
.al .act i{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.al .act i.g{background:var(--green)}.al .act i.r{background:var(--red)}.al .act i.a{background:var(--amber)}.al .act i.v{background:var(--accent)}
.al .ref{font:400 11px var(--mono);color:var(--dim);word-break:break-all}
.al .actor{font:500 11px var(--mono);color:var(--accent2);white-space:nowrap}
.foot{color:var(--dim);font-size:11px;text-align:center;padding-top:var(--s2)}
@media (max-width:1320px){
  .g2{grid-template-columns:1fr}
}
</style>
</head>

<main id="app"></main>

/* ---------- heatmap ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var HEAT = { mode:'latency', filters:{ lender:{}, outcome:{}, source:{} }, cells:[] };
var OUT = { approve:'offer', counteroffer:'counter', deny:'declined' };
function buildCells(){
  var N = D.eval.cases, rng = mulberry32(1013);
  var pa = { cu:.35, fintech:.55, prime:.2, regional:.3, subprime:.75 };
  function gauss(){ var u = 1 - rng(), v = rng(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
  var real = {};
  [D.second, S].forEach(function(a){
    var idx = parseInt(a.personaId.slice(1), 10) - 1;
    var m = {}; a.offers.forEach(function(o){ m[o.lender] = o; });
    real[idx] = { a:a, m:m };
  });
  var cells = [];
  D.product.lenders.forEach(function(l){
    var p50 = D.eval.latencyP50Ms[l.id];
    for(var i=0;i<N;i++){
      var c = { lender:l.id, idx:i, persona:'P' + String(i+1).padStart(2,'0') };
      if(real[i] && real[i].m[l.id]){
        var o = real[i].m[l.id];
        c.ms = o.latencyMs; c.out = OUT[o.classification]; c.real = true; c.name = real[i].a.name;
      } else {
        var ms = p50 * Math.exp(0.26 * gauss());
        if(rng() < 0.07) ms *= 1.7;
        c.ms = Math.max(700, Math.round(ms/50)*50);
        var r = rng(), p = pa[l.id];
        c.out = r < p*0.78 ? 'offer' : (r < p ? 'counter' : 'declined');
        c.real = false;
      }
      cells.push(c);
    }
  });
  HEAT.cells = cells;
  HEAT.min = Math.min.apply(null, cells.map(function(c){return c.ms;}));
  HEAT.max = Math.max.apply(null, cells.map(function(c){return c.ms;}));
  var sorted = cells.map(function(c){return c.ms;}).sort(function(a,b){return a-b;});
  HEAT.p99 = sorted[Math.min(sorted.length-1, Math.floor(sorted.length*0.99))];
}
function cellColor(c){
  var t = (c.ms - HEAT.min) / Math.max(1, HEAT.max - HEAT.min);
  if(HEAT.mode === 'latency'){
    if(c.out === 'declined'){ return 'hsl(4 ' + (55 + t*25).toFixed(0) + '% ' + (20 + t*38).toFixed(0) + '%)'; }
    return 'hsl(240 3% ' + (16 + t*60).toFixed(0) + '%)';
  }
  var L = (22 + t*30).toFixed(0);
  if(c.out === 'offer') return 'hsl(152 52% ' + L + '%)';
  if(c.out === 'counter') return 'hsl(38 86% ' + L + '%)';
  return 'hsl(3 70% ' + L + '%)';
}
function renderHeat(){
  var lenders = D.product.lenders, N = D.eval.cases;
  var selIdx = parseInt(S.personaId.slice(1),10) - 1;
  var rows = lenders.map(function(l){
    var cs = HEAT.cells.filter(function(c){ return c.lender === l.id; });
    var inner = cs.map(function(c,i){
      return '<div class="cell' + (c.idx === selIdx ? ' hl-col' : '') + '" data-l="' + c.lender + '" data-i="' + c.idx + '" style="background:' + cellColor(c) + '"></div>';
    }).join('');
    return '<div class="hrow" data-lender="' + l.id + '"><div class="hl"><b>' + esc(l.name) + '</b><span>' + esc(l.label) + ' · ' + esc(l.policy) + '</span></div>' +
      '<div class="cells" role="img" aria-label="' + esc(l.name) + ' latency across ' + N + ' cases">' + inner + '</div>' +
      '<div class="hp50 num"><span style="color:var(--dim)">p50</span> <b>' + secs(D.eval.latencyP50Ms[l.id]) + '</b></div></div>';
  }).join('');
  var xl = ''; for(var i=0;i<N;i++){ xl += '<span' + (i === selIdx ? ' class="s"' : '') + '>' + String(i+1).padStart(2,'0') + '</span>'; }
  $('#hm-body').innerHTML = rows + '<div class="hx"><span class="dim0" style="font-size:11px">case P01 to P' + N + '</span><div class="xl">' + xl + '</div><span></span></div>';
}
function legendHtml(){
  if(HEAT.mode === 'latency'){

  }

function chipDefs(){

  defs.push(['source','real','recorded'],['source','ill','illustrative']);
  return defs;
}
function cellMatches(c){
  var f = HEAT.filters;
  function ok(g, v){ var keys = Object.keys(f[g]).filter(function(k){return f[g][k];}); return !keys.length || keys.indexOf(v) >= 0; }
  return ok('lender', c.lender) && ok('outcome', c.out) && ok('source', c.real ? 'real' : 'ill');
}
function renderChips(){

function applyFilter(){

function renderHeatPanel(){

  $('#credit').addEventListener('click', function(e){
    var b = e.target.closest('[data-dispute]'); if(!b) return;
    var i = b.getAttribute('data-dispute'); disputed[i] = !disputed[i]; renderCredit();
    var nb = $('[data-dispute="' + i + '"]'); if(nb) nb.focus();
  });
}

/* ---------- notice + audit ---------- */
function renderNotice(){
  var paras = S.notice.split(/\n\s*\n/).map(function(p){ return '<p>' + esc(p.trim()) + '</p>'; }).join('');
  $('#notice').innerHTML =
    '<div class="ph"><h2>Adverse-action notice</h2><span class="cnt num">' + S.notice.split(/\n\s*\n/).length + ' paragraphs</span><div class="r"><span class="pill acc">Draft · held for approval</span></div></div>' +
    '<div class="notice">' + paras + '</div>';
}
function renderAudit(){
  var t0 = Math.min.apply(null, D.audit.map(function(a){return a.at;}));
  var rows = D.audit.map(function(a){
    var c = /decline|unsupported/.test(a.action) ? (/unsupported/.test(a.action) ? 'a' : 'r') : /approve|supported|pass/.test(a.action) ? 'g' : /step|notice/.test(a.action) ? 'v' : '';
    return '<tr><td><div class="t">' + clock(a.at) + '</div><div class="d num">+' + (a.at - t0) + ' ms</div></td>' +
      '<td><span class="actor">' + esc(a.actor) + '</span></td>' +
      '<td><span class="act"><i class="' + c + '"></i>' + esc(a.action) + '</span></td>' +
      '<td><span class="ref">' + (a.ref ? esc(a.ref) : '—') + '</span></td>' +
      '<td style="color:var(--mut)">' + esc(a.note) + '</td></tr>';
  }).join('');
  $('#audit').innerHTML =
    '<div class="ph"><h2>Audit log</h2><span class="cnt num">' + D.audit.length + ' events · PT</span></div>' +
    '<table class="al"><thead><tr><th style="width:96px">Time</th><th style="width:150px">Actor</th><th style="width:160px">Action</th><th style="width:120px">Ref</th><th>Note</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

/* ---------- boot ---------- */
$('#app').innerHTML =
  '<section class="panel" aria-label="Queue"><div class="ph"><h2>Queue</h2><span class="cnt num">' + D.queue.length + ' applicants</span>' +
    '<div class="r"><span class="at">sort=rank</span><span class="at">status=all</span></div></div>' +
    '<div class="qhead"><span>Rank</span><span>Applicant</span><span>Amount</span><span>Status</span><span>Offers</span><span>Best offer</span><span style="text-align:right">Decision</span></div>' +
    '<div id="queue-body"></div><div class="live" id="live" role="status" aria-live="polite"></div></section>' +
  '<section class="panel" id="applicant" aria-label="Selected applicant"></section>' +
  '<section class="panel" id="heat" aria-label="Eval latency heatmap"></section>' +
  '<section class="panel" id="spans" aria-label="Lenders"></section>' +
  '<div class="g2"><section class="panel" id="credit" aria-label="Credit snapshot"></section>' +
    '<div style="display:flex;flex-direction:column;gap:var(--s4);min-width:0"><section class="panel" id="notice" aria-label="Notice"></section><section class="panel" id="audit" aria-label="Audit log"></section></div></div>' +
  '<div class="foot">' + esc(D.product.name) + ' · ' + esc(D.product.tagline) + ' · sandbox data, personas only · Dash0 study</div>';

buildCells();
renderTop(); renderQueue(); wireQueue();
renderApplicant();
renderHeatPanel();
renderSpans(); wireSpans();
renderCredit(); wireCredit();
renderNotice(); renderAudit();
})();
</script>
</body>
</html>
