<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Evidence study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#364152; --ink-2:#556070; --muted:#667085; --faint:#a9b1bd;
  --rule:#e4e8ee; --rule-2:#d3d9e1; --bg:#fff; --nav:#f9fafb;
  --blue:#236aa4; --blue-bg:#eef5fb;
  --green:#18794e; --green-bg:#e7f5ed;
  --amber:#955700; --amber-bg:#fdf1dc;
  --red:#b3261e; --red-bg:#fdecea;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bleed:100px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* left nav */
.side{position:fixed;inset:0 auto 0 0;width:190px;background:var(--nav);border-right:1px solid var(--rule);padding:20px 14px;font-family:var(--sans);overflow-y:auto}
.brand{display:flex;align-items:center;gap:var(--s2);font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.side .tag{margin:var(--s2) 0 var(--s4)}
.side ul{list-style:none;margin:0;padding:0}
.side li a{display:block;padding:5px 0;font-size:15px;color:var(--ink-2);text-decoration:none}
.side li a:hover{color:var(--blue)}
.side li a.on{color:var(--blue);font-weight:500}
.side h4{margin:var(--s5) 0 var(--s1);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side .lenders li{padding:4px 0;font-size:13px;line-height:1.35;color:var(--ink-2)}
.side .lenders li span{display:block;font-size:12px;color:var(--muted)}

/* main */
.main{margin-left:190px;min-width:0}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s5) 0 var(--s6);font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.crumbs{display:flex;align-items:center;gap:var(--s2)}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{color:var(--blue)}
.kebab{background:none;border:0;padding:var(--s2);color:var(--ink);cursor:pointer;border-radius:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;align-items:start}
.col{width:575px;max-width:100%;margin:0 auto;padding-bottom:160px}
.wide{margin-inline:calc(var(--bleed) * -1)}
.toc{position:sticky;top:var(--s5);padding:var(--s2) var(--s5) 0 var(--s2);font-family:var(--sans);font-size:13px;line-height:1.35}
.toc a{display:block;color:var(--ink);text-decoration:none;padding:5px 0}
.toc a:hover,.toc a.on{color:var(--blue)}
.toc a.on{font-weight:500}
.toc .l2{margin-left:1px;padding-left:var(--s3);border-left:2px solid var(--rule)}
.toc .l2 a{color:var(--ink-2)}
.toc .l3{padding-left:var(--s3)}
.toc .l3 a{font-size:12.5px;color:var(--muted)}
.toc a.on{color:var(--blue)}

/* type */
.pager{display:flex;justify-content:space-between;font-size:17px;margin:var(--s2) 0 var(--s1)}
.pager a{text-decoration:none;border-bottom:1.5px solid #bcd7ee}
.pager a:hover{border-bottom-color:var(--blue)}
h1,h2,h3,h4{font-family:var(--sans);color:var(--ink);scroll-margin-top:var(--s5)}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:0 0 var(--s3)}
h2{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:var(--s7) 0 var(--s3)}
h3{font-size:17px;line-height:1.3;font-weight:700;margin:var(--s6) 0 var(--s3)}
h4{font-size:13px;font-weight:600;margin:0 0 var(--s2)}
p{margin:0 0 var(--s4)}
.lede{margin:0 0 var(--s4)}
ul.bul{margin:0 0 var(--s4);padding-left:var(--s6)}
ul.bul li{margin:var(--s1) 0;padding-left:var(--s1)}
ul.bul li::marker{color:var(--ink)}
ul.bul .bad{color:var(--red);font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* stat row */
.stats{display:flex;flex-wrap:wrap;gap:var(--s4) var(--s6);margin:var(--s4) 0 var(--s5);font-family:var(--sans)}
.stat .l{font-size:13px;color:var(--ink-2)}
.stat .v{font-size:24px;line-height:1.35;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.stat .d.up{color:var(--ink-2)} .stat .d.bad{color:var(--red)} .stat .d.ok{color:var(--green)}
.stat .v.bad{color:var(--red)}

/* commentary */
.note{border-left:3px solid var(--rule-2);padding:var(--s2) var(--s4);margin:var(--s5) 0;color:var(--ink-2);background:transparent}
.note p{margin:0 0 var(--s2)}
.note p:last-child{margin:0}
.note.bad{border-left-color:#e7a29c}
.note .k{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:var(--s1)}

/* pills */
.pill{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1;padding:4px 7px;border-radius:3px;vertical-align:middle;white-space:nowrap}
.pill.ok{color:var(--green);background:var(--green-bg)}
.pill.warn{color:var(--amber);background:var(--amber-bg)}
.pill.bad{color:var(--red);background:var(--red-bg)}
.pill.info{color:var(--blue);background:var(--blue-bg)}
.pill.mute{color:var(--ink-2);background:#eef0f3}
.pill.solid{color:#fff;background:var(--green)}

/* tables */
.tw{margin:var(--s4) 0 var(--s5);font-family:var(--sans)}
table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--ink-2);padding:var(--s2) var(--s3) var(--s2) 0;border-bottom:1px solid var(--rule-2);white-space:nowrap}
td{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink)}
th.r,td.r{text-align:right}
th:last-child,td:last-child{padding-right:0}
td .sub{display:block;color:var(--muted);font-size:12.5px}
td .nm{font-weight:600}
tr.sel td{background:#f6f9fc}
tr.hs td{background:#fff7f6}
tr.hsn td{background:#fff7f6;padding-top:0;color:var(--red);font-size:12.5px}
tr.hsn td div{border-left:3px solid #e7a29c;padding:var(--s1) var(--s3)}
td.acts{white-space:nowrap}
td.acts .btn+.btn{margin-left:var(--s1)}
.cap::first-letter{text-transform:uppercase}

/* buttons */
.btn{font-family:var(--sans);font-size:12.5px;font-weight:500;line-height:1;padding:6px 10px;border-radius:4px;border:1px solid var(--rule-2);background:#fff;color:var(--blue);cursor:pointer}
.btn:hover:not(:disabled){background:var(--blue-bg);border-color:#b9d3ea}
.btn.ok{color:var(--green);border-color:#a8d6bf}
.btn.ok:hover:not(:disabled){background:var(--green-bg);border-color:#7fc2a1}
.btn.no{color:var(--red);border-color:#efb7b2}
.btn.no:hover:not(:disabled){background:var(--red-bg);border-color:#e49a93}
.btn:disabled{color:var(--faint);border-color:var(--rule);cursor:not-allowed;background:#fff}
.btn.big{font-size:13px;padding:9px 12px}

/* pipeline */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:var(--s2);background:var(--green);vertical-align:middle}
.dot.run{background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.dot.wait{background:var(--rule-2)}

/* lender cards */
.cards{display:grid;gap:var(--s4);margin:var(--s4) 0 var(--s5);font-family:var(--sans)}
.card{border:1px solid var(--rule);border-radius:6px;padding:var(--s4) var(--s5);background:#fff}
.card.best{border-color:#a8d6bf;box-shadow:inset 3px 0 0 var(--green)}
.card header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4)}
.card .nm{font-size:15px;font-weight:700;line-height:1.3}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .tags{display:flex;gap:var(--s2);align-items:center;flex:none}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s3);margin:var(--s3) 0}
.metrics .l{font-size:12px;color:var(--muted)}
.metrics .v{font-size:18px;line-height:1.35;color:var(--ink)}
.metrics .v.none{color:var(--faint)}
.card h5{margin:var(--s3) 0 var(--s1);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.card ul{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.5}
.card li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s3);padding:5px 0;border-top:1px solid var(--rule)}
.card li:first-child{border-top:0}
.card li .f{display:block;overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.card ul.cond li{grid-template-columns:minmax(0,1fr)}
.mk{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.mk.t{color:var(--green)} .mk.f{color:var(--red)} .mk.n{color:var(--muted)}

/* notice */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:var(--s5);align-items:start;margin:var(--s4) 0}
.paper{border:1px solid var(--rule);border-radius:6px;padding:var(--s5) var(--s5) var(--s4);background:#fff}
.paper p{font-size:16px;line-height:1.6;margin:0 0 var(--s4)}
.pair .note{margin:0;font-family:var(--sans);font-size:13px;line-height:1.5}
.pair .note ul{margin:0 0 var(--s3);padding-left:var(--s4)}
.pair .note li{margin:var(--s1) 0}
.pair .note textarea{width:100%;min-height:84px;resize:vertical;font:400 16px/1.5 var(--serif);color:var(--ink);background:transparent;border:0;border-top:1px solid var(--rule-2);padding:var(--s2) 0;margin-top:var(--s2)}
.pair .note textarea::placeholder{color:var(--faint)}
.pair .note textarea:focus-visible{outline-offset:0}
.signoff{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.signoff .st{min-height:20px;font-size:12.5px;color:var(--ink-2)}
.foot{margin-top:var(--s7);padding-top:var(--s4);border-top:1px solid var(--rule);font-family:var(--sans);font-size:12.5px;color:var(--muted)}

div.wide{margin-inline:calc(var(--bleed) * -1)}
@media (max-width:1360px){:root{--bleed:64px}}
@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  .col{width:min(640px,calc(100% - 48px))}
  :root{--bleed:0px}
  .pair{grid-template-columns:1fr}
  .tw{overflow-x:auto}
}
</style>
</head>

    var v = props[k];
    if (v == null || v === false) return;
    if (k === 'class') n.className = v;
    else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
  return n;
}
function add(n, c){
  if (c == null || c === false) return;

}

  var t = new Date(ms).toLocaleTimeString('en-US',{timeZone:TZ,hour12:false});

}

function bestLender(){

}

  return el('div',{class:'tw'}, el('table',null,
    el('thead',null, el('tr',null, el('th',null,'#'), el('th',null,'Type'), el('th',null,'Status'), el('th',null,'Opened'), el('th',{class:'r'},'Balance'), el('th',{class:'r'},'Action'))), tb));
}

var signoffHost = el('div',{class:'signoff'});
function renderSignoff(){
  signoffHost.textContent = '';
  var b = bestLender();
  var d = decisions[S.applicantId];
  signoffHost.appendChild(el('button',{class:'btn ok big',type:'button',disabled:!!d,onclick:function(){ approveBest(S.applicantId); }},
    'Approve best' + (b ? ' · ' + b.name + ' ' + b.apr.toFixed(1) + '%' : '')));
  signoffHost.appendChild(el('button',{class:'btn no big',type:'button',disabled:!!d,onclick:function(){ decline(S.applicantId); }},'Decline'));
  signoffHost.appendChild(el('div',{class:'st',role:'status','aria-live':'polite'},
    d === 'approved' ? 'Approved by you (demo, nothing saved).' : d === 'declined' ? 'Declined by you (demo, nothing saved).' : 'A human approves every offer.'));
}

function buildDoc(){
  var doc = document.getElementById('doc');
  var dk = D.desk, b = S.bundle, best = bestLender();
  var stamp = S.createdAt;

  doc.appendChild(el('div',{class:'pager',id:'top'},
    el('a',{href:'#queue'},'← Queue'), el('a',{href:'#notice'},'Notice →')));
  doc.appendChild(el('h1',{id:'title','data-toc':'1'},'Desk Review - ' + longDate(stamp)));
  doc.appendChild(el('p',{class:'lede'}, D.product.tagline + '. Five AI underwriters offer; one loan officer decides. ',
    D.product.sandbox ? 'CRS sandbox data only. ' : '', 'Last eval run ' + longDate(Date.parse(D.eval.lastRun)) + '.'));

  /* Summary */
  doc.appendChild(el('h2',{id:'summary','data-toc':'2'},'Summary'));
  doc.appendChild(el('h3',null,'Overall Today'));
  doc.appendChild(el('p',null,
    dk.waitingOnYou + ' applications are waiting on you, with ' + dk.inFlight + ' still in flight. The desk has decided ' +
    dk.decidedToday + ' today and approved ' + usd(dk.dollarsApprovedToday) + ' in loans. Requested amounts in the queue:'));
  doc.appendChild(el('ul',{class:'bul'}, D.queue.map(function(q){
    return el('li',null, q.name + ': ', el('span',{class:'num'}, usd(q.amountRequested)));
  })));
  doc.appendChild(el('h3',null,'Throughput'));
  doc.appendChild(el('div',{class:'stats'},
    stat('Waiting on you', String(dk.waitingOnYou), '▲ ' + dk.inFlight + ' in flight'),
    stat('Decided today', String(dk.decidedToday), '▲ decisions today'),
    stat('Approved today', usd(dk.dollarsApprovedToday), '▲ dollars approved'),
    stat('Median decision', dk.medianDecisionSeconds + ' s', '▼ per application')));

  /* Queue */
  doc.appendChild(el('h2',{id:'queue','data-toc':'2'},'Queue'));
  doc.appendChild(el('p',null,'Ranked by what needs you first. Approve best sends the lowest-APR offer for sign-off; every approval is yours.'));
  renderQueue();
  doc.appendChild(queueHost);
  D.queue.filter(function(q){ return q.hardStop; }).forEach(function(q){
    doc.appendChild(note('bad', el('span',{class:'k'},'Commentary'),
      el('p',null, q.name + ' never reached an underwriter. The desk stopped the file on ' + q.hardStop.field + ': ' + q.hardStop.note + '. No lender is shown it, so no offer or denial is produced.')));
  });

  /* Applicant */
  doc.appendChild(el('h2',{id:'applicant','data-toc':'2'},'Applicant'));
  doc.appendChild(el('p',null, 'Selected: ', el('strong',null, S.name), '. Everything below describes this file.'));
  doc.appendChild(el('ul',{class:'bul'},
    el('li',null,'Name: ' + S.name),
    el('li',null,'Status: ', statusPill(decisions[S.applicantId] || S.status)),
    el('li',null,'Purpose: ' + S.purpose),
    el('li',null,'Amount requested: ', el('span',{class:'num'}, usd(S.amountRequested))),
    el('li',null,'Stated income: ', el('span',{class:'num'}, usd(S.statedIncome))),
    el('li',null,'Persona: ' + S.personaId),
    el('li',null,'Card code: ' + (S.cardCode == null ? 'none on record' : S.cardCode))));

  doc.appendChild(el('h3',{id:'pipeline','data-toc':'3'},'Pipeline'));
  var pb = el('tbody');
  S.pipeline.forEach(function(p){
    var cls = p.state === 'done' ? '' : p.state === 'running' ? ' run' : ' wait';
    pb.appendChild(el('tr',null,
      el('td',null, el('span',{class:'dot'+cls,'aria-hidden':'true'}), el('span',{class:'nm'}, p.label)),
      el('td',{class:'cap'}, p.state),
      el('td',{class:'num'}, p.metric)));
  });
  doc.appendChild(el('div',{class:'tw'}, el('table',null,
    el('thead',null, el('tr',null, el('th',null,'Step'), el('th',null,'State'), el('th',null,'Metric'))), pb)));

  doc.appendChild(el('h3',{id:'offers','data-toc':'3'},'Lender offers'));
  doc.appendChild(el('p',null,'Five underwriters, one policy each. Reasons carry a verification mark: a reason is verified only when fixing its field alone flips the decision.'));
  doc.appendChild(el('div',{class:'cards wide'}, S.offers.map(function(o){ return lenderCard(o, best && o.lender === best.lender); })));

  doc.appendChild(el('h3',{id:'credit','data-toc':'3'},'Credit snapshot'));
  doc.appendChild(el('p',null,'Pulled from ' + b.source.toUpperCase() + ' at ' + clock(b.pulledAt) + ' Pacific.'));
  doc.appendChild(el('div',{class:'stats wide'},
    stat('Score', String(b.score), 'FICO 9'),
    stat('Vantage 4', String(b.vantage4), 'VantageScore 4'),
    stat('Utilization', pct(b.utilization), 'revolving'),
    stat('Inquiries', String(b.inquiries6mo), 'last 6 months'),
    stat('Fraud score', String(b.fraudScore), 'hard stop at 80'),
    stat('Identity', b.identityVerified ? 'Verified' : 'Failed', null, b.identityVerified ? '' : 'bad')));
  var FL = [['deceased','Deceased'],['frozen','File frozen'],['bankruptcy','Bankruptcy'],['eviction','Eviction'],['lienOrJudgment','Lien or judgment']];
  doc.appendChild(el('p',null,'Public-record flags:'));
  doc.appendChild(el('ul',{class:'bul'}, FL.map(function(f){
    var on = !!b.flags[f[0]];
    return el('li',{class:on?'bad':''}, f[1] + ': ' + (on ? 'yes' : 'no'));
  })));
  doc.appendChild(note('', el('span',{class:'k'},'Commentary'),
    el('p',null, FL.filter(function(f){ return b.flags[f[0]]; }).length
      ? 'Flag raised: ' + FL.filter(function(f){ return b.flags[f[0]]; }).map(function(f){ return f[1].toLowerCase(); }).join(', ') + '. It is the first reason in most of the denials below.'
      : 'No public-record flags raised.')));

  doc.appendChild(el('h3',{id:'tradelines','data-toc':'3'},'Tradelines'));
  doc.appendChild(el('p',null, b.tradelines.length + ' tradelines on file. Dispute drafts a dispute for the consumer reporting agency.'));
  doc.appendChild(tradelinesTable());

  /* Audit */
  doc.appendChild(el('h2',{id:'audit','data-toc':'2'},'Audit log'));
  doc.appendChild(el('p',null, D.audit.length + ' entries for this file, newest first. Times are Pacific.'));
  var ab = el('tbody');
  D.audit.forEach(function(a){
    ab.appendChild(el('tr',null,
      el('td',{class:'num mono'}, clock(a.at)),
      el('td',null, a.actor),
      el('td',{class:'mono'}, a.action),
      el('td',{class:'mono',style:'word-break:break-all'}, a.ref == null ? '—' : a.ref),
      el('td',null, a.note)));
  });
  doc.appendChild(el('div',{class:'tw wide'}, el('table',null,
    el('thead',null, el('tr',null, el('th',null,'Time'), el('th',null,'Actor'), el('th',null,'Action'), el('th',null,'Ref'), el('th',null,'Note'))), ab)));

  /* Eval */
  var E = D.eval;
  doc.appendChild(el('h2',{id:'eval','data-toc':'2'},'Eval results'));
  doc.appendChild(el('p',null,'Scored against the answer key, last run ' + longDate(Date.parse(E.lastRun)) + '.'));
  doc.appendChild(el('div',{class:'stats'},
    stat('Cases', String(E.cases), '▲ in the answer key'),
    stat('Agreement', pct(E.agreement), '▲ decision match'),
    stat('Per-lender', pct(E.perLenderAgreement), '▼ ' + pct(1 - E.perLenderAgreement) + ' off'),
    stat('Reasons verified', pct(E.reasonsVerified), '▲ of all reasons')));
  doc.appendChild(el('ul',{class:'bul'},
    el('li',null,'Fraud files with zero offers: ' + (E.fraudZeroOffers ? 'yes' : 'no')),
    el('li',null,'Average reasons per denial: ' + E.avgReasonsPerDenial.toFixed(2)),
    el('li',null,'Median latency by lender:')));
  doc.lastChild.lastChild.appendChild(el('ul',{class:'bul',style:'margin:var(--s1) 0 0'}, Object.keys(E.latencyP50Ms).map(function(k){
    return el('li',null, (lenderById[k] ? lenderById[k].name : k) + ': ', el('span',{class:'num'}, secs(E.latencyP50Ms[k])));
  })));

  /* Notice */
  doc.appendChild(el('h2',{id:'notice','data-toc':'2'},'Adverse-action notice'));
  doc.appendChild(el('p',null,'Drafted by compliance from verified reasons only. Read it before you approve.'));
  var paper = el('div',{class:'paper'}, S.notice.split(/\n\n/).map(function(p){ return el('p',null,p); }));
  var unsupported = D.audit.filter(function(a){ return a.action === 'verify.unsupported'; });
  var comp = D.audit.filter(function(a){ return a.action === 'compliance.notice'; });
  renderSignoff();
  var side = el('aside',{class:'note','aria-label':'Reviewer commentary'},
    el('span',{class:'k'},'Reviewer commentary'),
    el('ul',null,
      comp.map(function(a){ return el('li',null, a.note.charAt(0).toUpperCase() + a.note.slice(1) + '.'); }),
      unsupported.map(function(a){ return el('li',null, el('span',{class:'mono'}, a.ref), ': ', a.note + '.'); }),
      best ? el('li',null,'Best APR: ' + best.name + ', ' + best.apr.toFixed(1) + '% for ' + best.termMonths + ' months.') : null),
    el('label',{class:'sr',for:'rc'},'Reviewer commentary'),
    el('textarea',{id:'rc',placeholder:'Add commentary here...'}),
    signoffHost);
  doc.appendChild(el('div',{class:'pair wide'}, paper, side));
  doc.appendChild(el('div',{class:'foot'}, D.product.name + ' · ' + (D.product.sandbox ? 'sandbox data, personas only · ' : '') + 'a human approves every offer.'));
}

/* ---------- toc ---------- */
function buildToc(){
  var toc = document.getElementById('toc');
  var hs = Array.prototype.slice.call(document.querySelectorAll('#doc [data-toc]'));
  var links = [];
  var group = null;
  hs.forEach(function(h){
    var lvl = h.getAttribute('data-toc');
    var a = el('a',{href:'#'+h.id}, h.textContent);
    a.dataset.id = h.id;
    links.push(a);
    if (lvl === '1') { toc.appendChild(a); group = el('div',{class:'l2'}); toc.appendChild(group); }
    else if (lvl === '2') group.appendChild(a);
    else group.appendChild(el('div',{class:'l3'}, a));
  });
  function spy(){
    var y = 120, cur = links[0];
    links.forEach(function(a){
      var t = document.getElementById(a.dataset.id);
      if (t && t.getBoundingClientRect().top <= y) cur = a;
    });
    links.forEach(function(a){ a.classList.toggle('on', a === cur); if (a === cur) a.setAttribute('aria-current','location'); else a.removeAttribute('aria-current'); });
  }
  window.addEventListener('scroll', spy, {passive:true});
  window.addEventListener('resize', spy);
  spy();
}

buildNav(); buildTop(); buildDoc(); buildToc();
})();
