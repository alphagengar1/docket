function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
    else node.setAttribute(key, String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child != null) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const valid = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
const money = n => valid(n) ? new Intl.NumberFormat('en-US', {style:'currency', currency:'USD',minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).format(n) : 'Not provided';
const apr = n => valid(n) ? `${n.toFixed(2)}%` : 'Not provided';
const badge = (text, color = 'neutral') => el('span', {class:`pill ${color}`}, text);
const metric = (label, value) => el('div', {}, el('dt', {}, label), el('dd', {}, value ?? 'Not provided'));
const hasOffer = lender => lender.status === 'offer' || lender.status === 'counteroffer';
const statusText = status => ({offer:'Offer',counteroffer:'Counteroffer',declined:'Declined',pending:'Pending',error:'Unavailable'})[status] || 'Unknown';
const decisions = ['offer','counteroffer','declined'];

class DocketDashboard extends HTMLElement {
  constructor() {
    super(); this.attachShadow({mode:'open'}); this._data = null; this.filter = 'all'; this.sort = 'rate';
  }
  connectedCallback() { this.render(); }
  set data(value) { this._data = value; if (this.isConnected) this.render(); }
  get data() { return this._data; }
  emit(name, detail) { this.dispatchEvent(new CustomEvent(name, {detail,bubbles:true,composed:true})); }
  get lenders() { return Array.isArray(this._data?.lenders) ? this._data.lenders : []; }
  get best() {
    // Only supplied, valid offer rates are ranked. No credit decisions are computed here.
    return this.lenders.filter(l => hasOffer(l) && valid(l.apr)).slice().sort((a,b) => a.apr-b.apr)[0];
  }
  render() {
