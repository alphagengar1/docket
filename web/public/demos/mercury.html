<!-- Reference: Mercury (business banking) https://mercury.com : light, restrained list-plus-side-panel; slim left nav; 48px rows; colour only for state. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Mercury study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#272735;
  --ink2:#4b4b5a;
  --muted:#70707d;
  --faint:#a3a3ae;
  --line:#eeeef3;
  --line2:#e0e0e8;
  --hover:#f8f8fb;
  --sel:#f3f3f8;
  --nav:#f7f7fa;
  --accent:#5266eb;
  --accent-ink:#4457d6;
  --accent-soft:#eef0fd;
  --green:#1a8a5a;  --green-soft:#e8f5ee;
  --amber:#a8650a;  --amber-dot:#e0a030; --amber-soft:#fdf3df;
  --red:#c5352e;    --red-soft:#fdecea;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:8px;
  --panel-w:500px;
  --nav-w:208px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 14px/20px var(--sans);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------- nav ---------- */
.nav{width:var(--nav-w);flex:none;background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:var(--s4) var(--s3)}
.brand{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2) var(--s4)}
.brand svg{flex:none}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.tag{font-size:11px;line-height:16px;font-weight:500;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:0 var(--s2);background:#fff}
.nav-label{font-size:12px;color:var(--faint);padding:var(--s4) var(--s2) var(--s1);font-weight:500}
.nav button.item{display:flex;align-items:center;gap:var(--s3);width:100%;height:32px;border:0;background:none;border-radius:6px;padding:0 var(--s2);text-align:left;color:var(--ink2);cursor:pointer;font-weight:450}
.nav button.item:hover{background:#ededf2}
.nav button.item[aria-current="page"]{background:#e9e9f0;color:var(--ink);font-weight:500}
.nav button.item svg{flex:none;color:var(--muted)}
.nav .item .count{margin-left:auto;font-size:12px;color:var(--muted)}
.nav-foot{margin-top:auto;padding:var(--s3) var(--s2) 0;border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--muted)}
.nav-foot b{display:block;color:var(--ink2);font-weight:500;margin-bottom:2px}

/* ---------- main ---------- */
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;background:#fff}
.main-in{padding:var(--s5) 28px 64px;max-width:1120px}
.top{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s5);min-height:32px}
.top h1{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.top .tag{margin-left:2px}
.top .grow{flex:1}

.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s4);padding-bottom:var(--s5);border-bottom:1px solid var(--line);margin-bottom:var(--s5)}
.stat .l{font-size:12px;line-height:16px;color:var(--muted);margin-bottom:var(--s1)}
.stat .v{font-size:24px;line-height:32px;font-weight:500;letter-spacing:-.02em}

.sec-h{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s2)}
.sec-h h2{font-size:15px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.sec-h .aside{font-size:12px;color:var(--muted)}
.sec-h .grow{flex:1}

.filters{display:flex;gap:2px;background:var(--nav);border-radius:8px;padding:2px}
.filters button{border:0;background:none;height:26px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:450}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line2),0 1px 2px rgba(20,20,40,.04);font-weight:500}

.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 80px 108px 124px 150px;column-gap:var(--s3);align-items:center;padding:0 var(--s3)}
.cols{height:32px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.cols .r{text-align:right}
.rows{margin:0 calc(var(--s3) * -1)}
.rows .cols{margin:0 var(--s3)}
.row{min-height:56px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;padding-top:var(--s2);padding-bottom:var(--s2)}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--sel)}
.row .who{display:flex;align-items:center;gap:var(--s3);min-width:0}
.row .rk{width:16px;flex:none;font-size:12px;color:var(--faint);text-align:center}
.row .nm{min-width:0}
.row .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{display:block;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-weight:450}
.row .best b{display:block;font-weight:450}
.row .best span{display:block;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.row .acts{display:flex;gap:6px;justify-content:flex-end}
.row .hs{grid-column:1 / -1;font-size:12px;line-height:16px;color:var(--red);padding:var(--s1) 0 0 28px}
.row .hs code{font-family:var(--mono);font-size:11px;background:var(--red-soft);border-radius:4px;padding:1px 5px;margin-right:6px}
.empty{padding:var(--s5) var(--s3);color:var(--muted)}

.st{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.st.lg{background:var(--cs);color:var(--c);border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;line-height:20px;font-weight:500}
.s-wait{--c:var(--accent);--cs:var(--accent-soft)}
.s-ok{--c:var(--green);--cs:var(--green-soft)}
.s-bad{--c:var(--red);--cs:var(--red-soft)}
.row .s-bad{color:var(--red);font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover);border-color:#d3d3de}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.quiet:hover{color:var(--red);background:var(--red-soft)}
.btn.lgb{height:36px;padding:0 var(--s4)}
.btn[disabled]{opacity:.38;cursor:not-allowed;pointer-events:none}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:0 6px;height:24px;font-weight:450}
.btn.link:hover{background:var(--accent-soft)}
.btn.link[disabled]{color:var(--muted);opacity:1}

/* eval */
.evalsec{margin-top:var(--s7)}
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4) var(--s5);padding:var(--s4) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.evgrid .v{font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.015em}
.lat{margin-top:var(--s4)}
.lat h3{font-size:13px;font-weight:500;margin-bottom:var(--s2)}
.lat li{display:grid;grid-template-columns:200px minmax(0,1fr) 56px;gap:var(--s3);align-items:center;height:32px;font-size:13px}
.lat .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.lat .bar i{display:block;height:100%;background:#c3c5d2;border-radius:3px}
.lat .t{text-align:right;color:var(--ink2)}

/* ---------- side panel ---------- */
.panel{flex:none;width:0;overflow:hidden;border-left:1px solid transparent;background:#fff;transition:width .24s cubic-bezier(.3,.7,.2,1),border-color .24s;position:relative}
.panel.open{width:var(--panel-w);border-left-color:var(--line2);box-shadow:-8px 0 24px -16px rgba(20,20,40,.14)}
.panel-in{width:var(--panel-w);height:100%;overflow-y:auto;overflow-x:hidden}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.p-head{padding:var(--s5) var(--s5) var(--s4)}
.p-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.eyebrow{font-size:12px;color:var(--muted)}
.icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:none;border-radius:6px;color:var(--muted);cursor:pointer}
.icon:hover{background:var(--sel);color:var(--ink)}
.p-head h2{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.p-amt{font-size:32px;line-height:40px;font-weight:500;letter-spacing:-.03em;margin:var(--s2) 0 var(--s2)}
.p-amt span{font-size:13px;letter-spacing:0;font-weight:400;color:var(--muted);margin-left:var(--s2)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3) var(--s5);margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line)}
.kv dt{font-size:12px;line-height:16px;color:var(--muted);margin-bottom:2px}
.kv dd{font-size:14px}

.tabs{position:sticky;top:0;z-index:3;display:flex;gap:var(--s5);height:44px;padding:0 var(--s5);background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;height:44px;padding:0;color:var(--muted);cursor:pointer;font-weight:450;position:relative}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:500}
.tabs button[aria-current="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}

.psec{padding:var(--s5);border-bottom:1px solid var(--line)}
.psec > .sec-h h3{font-size:14px;font-weight:600}
.psec .sec-h{margin-bottom:var(--s3)}
.psec .sec-h .grow{flex:1}
.legend{font-size:12px;color:var(--muted);display:flex;gap:var(--s3);align-items:center}
.legend span{display:inline-flex;gap:4px;align-items:center}

.steps li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:var(--s3);align-items:center;min-height:36px;position:relative}
.steps li::before{content:'';position:absolute;left:9px;top:-18px;height:36px;width:1px;background:var(--line2)}
.steps li:first-child::before{display:none}
.dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;position:relative;z-index:1}
.dot.done{background:var(--ink);color:#fff}
.dot.run{border:2px solid var(--accent)}
.dot.run::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dot.todo{border:1.5px solid var(--line2)}
.steps .m{font-size:13px;color:var(--muted)}
.steps li.is-run .lbl{font-weight:500}
.steps li.is-run .m{color:var(--accent-ink);font-weight:500}

.offer{border:1px solid var(--line2);border-radius:12px;padding:var(--s4);margin-bottom:var(--s3);background:#fff}
.offer:last-child{margin-bottom:0}
.offer.is-best{border-color:#aab4f5;box-shadow:0 0 0 3px var(--accent-soft)}
.o-top{display:flex;align-items:flex-start;gap:var(--s3)}
.o-top .who{flex:1;min-width:0}
.o-top b{display:block;font-weight:500;font-size:14px}
.o-top .sub{font-size:12px;line-height:16px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;line-height:18px;font-weight:600;letter-spacing:.05em;padding:0 8px;border-radius:999px;color:var(--c);background:var(--cs);white-space:nowrap}
.pill.p-ok{--c:var(--green);--cs:var(--green-soft)}
.pill.p-mid{--c:var(--amber);--cs:var(--amber-soft)}
.pill.p-bad{--c:var(--red);--cs:var(--red-soft)}
.bestmark{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;font-weight:600;letter-spacing:.02em;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:1px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin:var(--s4) 0 var(--s1);padding:var(--s3) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.figs dt{font-size:12px;line-height:16px;color:var(--muted)}
.figs dd{font-size:15px;line-height:22px;font-weight:500}
.figs dd small{display:block;font-size:11px;line-height:14px;font-weight:400;color:var(--amber)}
.lab{font-size:12px;line-height:16px;color:var(--muted);font-weight:500;margin:var(--s3) 0 var(--s1)}
.conds li{position:relative;padding-left:14px;font-size:13px;line-height:19px;color:var(--ink2);margin-bottom:4px}
.conds li::before{content:'';position:absolute;left:3px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.reasons li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--s2);font-size:13px;line-height:19px;margin-bottom:var(--s2)}
.reasons li:last-child{margin-bottom:0}
.reasons .fld{display:block;font-family:var(--mono);font-size:11px;line-height:16px;color:var(--faint)}
.mark{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:2px}
.mark.t{background:var(--green-soft);color:var(--green)}
.mark.f{background:var(--red-soft);color:var(--red)}
.mark.n{background:var(--line);color:var(--muted)}
.o-foot{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4) var(--s4);padding-bottom:var(--s4)}
.metrics .l{font-size:12px;line-height:16px;color:var(--muted)}
.metrics .v{font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.015em}
.metrics .v.ok{color:var(--green);font-size:15px;display:flex;gap:6px;align-items:center;line-height:28px}
.flags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s5);border-top:1px solid var(--line);padding-top:var(--s2);margin-bottom:var(--s5)}
.flags li{display:flex;justify-content:space-between;align-items:center;height:32px;font-size:13px;border-bottom:1px solid var(--line)}
.flags .y{color:var(--red);font-weight:500}
.flags .y::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px}
.flags .n{color:var(--muted)}
.tl{width:100%;border-collapse:collapse;font-size:13px}
.tl th{font-weight:450;font-size:12px;color:var(--muted);text-align:left;height:28px;border-bottom:1px solid var(--line)}
.tl td{height:40px;border-bottom:1px solid var(--line);white-space:nowrap}
.tl .r{text-align:right}
.tl td:last-child,.tl th:last-child{text-align:right;padding-right:0}
.tl .closed{color:var(--muted)}

.notice{background:var(--nav);border:1px solid var(--line);border-radius:12px;padding:var(--s4) var(--s5)}
.notice p{font-size:13px;line-height:21px;color:var(--ink2);margin-bottom:var(--s3)}
.notice p:last-child{margin-bottom:0}
.note-meta{font-size:12px;color:var(--muted);margin-top:var(--s3)}

.log li{padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.log li:first-child{padding-top:0}
.log .a1{display:flex;gap:var(--s2);align-items:baseline;font-size:13px}
.log .actor{font-weight:500}
.log .act{font-family:var(--mono);font-size:12px;color:var(--muted)}
.log time{margin-left:auto;font-size:12px;color:var(--muted)}
.log .a2{font-size:13px;line-height:19px;color:var(--ink2);margin-top:2px}
.log .ref{display:inline-block;margin-top:4px;font-family:var(--mono);font-size:11px;line-height:16px;color:var(--muted);background:var(--nav);border:1px solid var(--line);border-radius:4px;padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}

.pfoot{position:sticky;bottom:0;z-index:3;display:flex;gap:var(--s2);align-items:center;padding:var(--s3) var(--s5);background:rgba(255,255,255,.96);border-top:1px solid var(--line2);backdrop-filter:blur(6px)}
.pfoot .grow{flex:1}
.pfoot .says{font-size:12px;line-height:16px;color:var(--muted)}
.pfoot .says b{display:block;color:var(--ink);font-weight:500;font-size:13px}
.hsbox{border:1px solid #f3c7c3;background:var(--red-soft);border-radius:12px;padding:var(--s4);font-size:13px;line-height:19px;color:var(--ink2)}
.hsbox b{display:block;color:var(--red);font-weight:600;margin-bottom:4px;font-size:14px}
.hsbox code{font-family:var(--mono);font-size:12px;color:var(--red)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1360px){
  :root{--nav-w:64px;--panel-w:480px}
  .brand b,.brand .tag,.nav-label,.nav .item span,.nav .item .count,.nav-foot span{display:none}
  .brand,.nav button.item{justify-content:center;padding-left:0;padding-right:0}
  .nav{padding-left:var(--s2);padding-right:var(--s2)}
  .nav-foot{text-align:center;font-size:10px}
  .nav-foot b{font-size:10px}
  .main-in{padding-left:var(--s5);padding-right:var(--s5)}
  .lat li{grid-template-columns:160px minmax(0,1fr) 56px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="nav" aria-label="Primary">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#272735"/><path d="M8 6.5h4.2c3.2 0 5.3 2.2 5.3 5.5s-2.1 5.5-5.3 5.5H8z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
      <b id="brandName">Docket</b>
      <span class="tag" id="brandTag">Sandbox</span>
    </div>
    <nav id="navItems"></nav>
    <div class="nav-foot"><b id="tagline"></b><span>CRS sandbox data only. A human approves every offer.</span></div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div class="main-in">
      <header class="top">
        <h1>Queue</h1><span class="tag" id="sbTag">Sandbox</span>
        <span class="grow"></span>
        <div class="filters" id="filters" role="group" aria-label="Filter queue"></div>
      </header>
      <section class="summary" id="summary" aria-label="Desk summary"></section>
      <section id="queue" aria-label="Applicant queue">
        <div class="sec-h"><h2>Applications</h2><span class="aside" id="qCount"></span></div>
        <div class="rows">
          <div class="cols" aria-hidden="true"><span>Applicant</span><span class="r">Amount</span><span>Status</span><span>Best offer</span><span class="r">Decision</span></div>
          <div id="rows" role="list"></div>
        </div>
      </section>
      <section class="evalsec" id="eval" aria-label="Evaluation"></section>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Applicant detail">
    <div class="panel-in" id="panelIn"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var usd0 = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
var usd2 = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
function apr(n){ return n == null ? '—' : n.toFixed(1) + '%'; }
function pct(n){ return Math.round(n * 100) + '%'; }
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){ var p = iso.split('-').map(Number); return MONTHS[p[1]-1] + ' ' + p[2] + ', ' + p[0]; }
function tz(ms, opts){
  opts.timeZone = 'America/Los_Angeles';
  return new Intl.DateTimeFormat('en-US', opts).format(new Date(ms));
}
function clock(ms){ return tz(ms,{hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3}); }
function stamp(ms){ return tz(ms,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) + ' PT'; }
function secs(ms){ return (ms/1000).toFixed(1) + 's'; }
function jsonLen(o){ return Object.keys(o).length; }

  check:'<path d="M3.5 8.5l3 3 6-7" />',

  notice:'<path d="M4 2.5h5.5L12 5v8.5H4z" /><path d="M9.5 2.5V5H12M6 8h4M6 10.5h4" />',

};
function ico(name,size){ size = size || 16; return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[name]+'</svg>'; }

var STATUS = {
  awaiting_human:{label:'Waiting on you',cls:'s-wait'},
  approved:{label:'Approved',cls:'s-ok'},
  hard_stop:{label:'Hard stop',cls:'s-bad'},
  declined:{label:'Declined',cls:'s-bad'}

var state = { sel: D.selected.applicantId, filter: 'all', over: {}, disputed: {}, tab: 'offers', lastSel: null };
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function statusOf(r){ return state.over[r.applicantId] || r.status; }
function stPill(key, big){ var s = STATUS[key] || {label:key,cls:'s-wait'}; return '<span class="st ' + s.cls + (big ? ' lg' : '') + '"><i></i>' + esc(s.label) + '</span>'; }
function detailFor(id){

function renderFilters(){

function rowHTML(r){
  var id = r.applicantId, st = statusOf(r), live = st === 'awaiting_human';

    best = '<b class="num">'+apr(r.best.apr)+' <span style="display:inline;font-size:12px;color:var(--muted)">APR</span></b><span class="num">'+esc(LENDERS[r.best.lender].label)+' · '+r.approvals+'/'+r.lenders+'</span>';
  } else {

  }

function renderQueue(){
  var list = D.queue.filter(function(r){ return state.filter==='all' || statusOf(r)===state.filter; });
  document.getElementById('rows').innerHTML = list.length ? list.map(rowHTML).join('') : '<div class="empty">Nothing here.</div>';
  document.getElementById('qCount').textContent = list.length + ' of ' + D.queue.length;
  renderFilters();
}

/* ---------- panel ---------- */
function offerHTML(o, bestId, requested){
  var cls = o.classification;
  var word = cls==='approve' ? 'OFFER' : cls==='counteroffer' ? 'COUNTEROFFER' : 'DECLINED';
  var pc = cls==='approve' ? 'p-ok' : cls==='counteroffer' ? 'p-mid' : 'p-bad';
  var isBest = o.apr != null && o.lender === bestId;
  var h = '<article class="offer'+(isBest?' is-best':'')+'">'
    + '<div class="o-top"><div class="who"><b>'+esc(o.name)+(isBest?'<span class="bestmark">Best APR</span>':'')+'</b><span class="sub">'+esc(o.label)+' · '+esc(o.policy)+' policy</span></div><span class="pill '+pc+'">'+word+'</span></div>';
  if (o.apr != null) {
    var short = o.amount != null && o.amount < requested ? '<small>of '+usd0.format(requested)+' requested</small>' : '';
    h += '<dl class="figs num"><div><dt>APR</dt><dd>'+apr(o.apr)+'</dd></div>'
      + '<div><dt>Monthly</dt><dd>'+(o.monthlyPayment!=null?usd2.format(o.monthlyPayment):'—')+'</dd></div>'
      + '<div><dt>Term</dt><dd>'+(o.termMonths!=null?o.termMonths+' mo':'—')+'</dd></div>'
      + '<div><dt>Amount</dt><dd>'+(o.amount!=null?usd0.format(o.amount):'—')+short+'</dd></div></dl>';
  }
  if (o.conditions && o.conditions.length) {
    h += '<div class="lab">Conditions</div><ul class="conds">'+o.conditions.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ul>';
  }
  h += '<div class="lab">Reasons</div><ul class="reasons">'+o.reasons.map(function(r){
    var k = r.verified === true ? ['t','check','Verified'] : r.verified === false ? ['f','x','Not supported'] : ['n','dash','Not tested'];
    return '<li><span class="mark '+k[0]+'" title="'+k[2]+'">'+ico(k[1],10)+'<span class="sr">'+k[2]+'</span></span><span>'+esc(r.text)+'<span class="fld">'+esc(r.field)+'</span></span></li>';
  }).join('')+'</ul>';
  h += '<div class="o-foot num"><span>Underwriter: '+esc(o.provider)+'</span><span>'+secs(o.latencyMs)+' latency</span></div></article>';
  return h;
}

function renderPanel(){
  var panel = document.getElementById('panel'), sc = document.getElementById('panelIn');
  var open = !!state.sel;
  if (open) {
    var keep = state.lastSel === state.sel ? sc.scrollTop : 0;
    sc.innerHTML = panelHTML(state.sel);
    sc.scrollTop = keep;
    state.lastSel = state.sel;
  }
  panel.classList.toggle('open', open);
  if ('inert' in panel) panel.inert = !open;
  panel.setAttribute('aria-hidden', open ? 'false' : 'true');
}

/* ---------- interaction ---------- */
var toastT;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 3200);
}
function refocusRow(id){
  var el = document.querySelector('.row[data-id="'+id+'"]');
  if (el) el.focus({preventScroll:true});
}
function renderAll(){ renderQueue(); renderPanel(); }
function select(id){ state.sel = id; renderAll(); }
function jumpIn(sc, el, off){
  if (!sc || !el) return;
  var d = el.getBoundingClientRect().top - sc.getBoundingClientRect().top - off;
  sc.scrollTo({top: sc.scrollTop + d, behavior: reduce ? 'auto' : 'smooth'});
}
function jumpPanel(sec){
  state.tab = sec;
  var target = document.getElementById('sec-' + sec);
  jumpIn(document.getElementById('panelIn'), target, 44);
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){ b.setAttribute('aria-current', String(b.getAttribute('data-sec') === sec)); });
}
function act(t){
  var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
  if (a === 'filter') { state.filter = t.getAttribute('data-f'); renderQueue(); return; }
  if (a === 'close') { var was = state.sel; state.sel = null; renderAll(); if (was) refocusRow(was); return; }
  if (a === 'jump') { jumpPanel(t.getAttribute('data-sec')); return; }
  if (a === 'go') {
    var g = t.getAttribute('data-go');
    if (g === 'queue' || g === 'eval') { jumpIn(document.getElementById('main'), document.getElementById(g), 16); return; }
    if (!state.sel || !detailFor(state.sel)) { state.sel = D.selected.applicantId; renderAll(); }
    jumpPanel(g); return;
  }
  if (a === 'dispute') { state.disputed[t.getAttribute('data-key')] = true; renderPanel(); toast('Dispute filed with the bureau (sandbox).'); return; }
  if (a === 'approve') {
    var r = rowFor(id), l = r && r.best ? LENDERS[r.best.lender] : null;
    state.over[id] = 'approved'; renderAll(); refocusRow(id);
    toast('Approved ' + (l ? l.name + ' at ' + apr(r.best.apr) + ' APR' : r.name) + '. Nothing is sent in the sandbox.');
    return;
  }
  if (a === 'decline') {
    state.over[id] = 'declined'; renderAll(); refocusRow(id);
    toast('Declined. The adverse action notice stays on file.');
  }
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (t) { act(t); return; }
  var row = e.target.closest('.row[data-id]');
  if (row) select(row.getAttribute('data-id'));
});
document.addEventListener('keydown', function(e){
  var row = e.target.closest ? e.target.closest('.row[data-id]') : null;
  if (row && e.target === row) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(row.getAttribute('data-id')); refocusRow(row.getAttribute('data-id')); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var sib = e.key === 'ArrowDown' ? row.nextElementSibling : row.previousElementSibling;
