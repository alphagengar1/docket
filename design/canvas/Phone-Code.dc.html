<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: enter card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1C46C9}a:hover{color:#141514}
.lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#565952}
.disp{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;margin:0}
.wrap{position:relative;align-self:flex-start}
.cells{display:flex;border:2px solid #141514;background:#FFFFFF}
.c{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:600;font-size:40px;width:66px;height:78px;display:flex;align-items:center;justify-content:center;border-left:1px solid #B9BBB3;box-sizing:border-box}
.c:first-child{border-left:0}
.cur{box-shadow:inset 0 -5px 0 #FF5A1F}
.hidden-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;cursor:text}
.wrap:focus-within .cells{outline:3px solid #1C46C9;outline-offset:3px}
.go{height:56px;border:0;background:#1C46C9;color:#FFFFFF;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:16px;cursor:pointer;width:100%}
.wait{height:56px;border:2px dashed #565952;background:transparent;color:#565952;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:15px;width:100%}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;padding:24px 20px;background:#E3E4DF;color:#141514;font-family:'Instrument Sans','Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;gap:24px">

<div style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;align-items:center;gap:8px"><div style="width:14px;height:14px;background:#FF5A1F"></div><span class="disp" style="font-size:15px">Underwrite</span></div>
<span class="lbl">Step 1 of 3</span>
</div>

<div style="display:flex;flex-direction:column;gap:10px;margin-top:28px">
<h1 style="margin:0;font-size:30px;line-height:1.12;font-weight:600">Type the code on your card.</h1>
<p style="margin:0;font-size:17px;line-height:1.4;color:#565952">The four digits at the top right.</p>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<label for="card-code" class="lbl" style="color:#141514">Card code</label>
<div class="wrap">
<div class="cells" aria-hidden="true">
<sc-for list="{{ cells }}" as="cell" hint-placeholder-count="4"><span class="{{ cell.cls }}">{{ cell.ch }}</span></sc-for>
</div>
<input id="card-code" class="hidden-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" value="{{ code }}" onChange="{{ onCode }}">
</div>
</div>

<div style="background:#F5F5F1;border:1px solid #B9BBB3;padding:14px 16px;display:flex;gap:14px;align-items:flex-start">
<div style="width:4px;align-self:stretch;background:#141514"></div>
<p style="margin:0;font-size:15px;line-height:1.4">Next, we pull your credit file and send it to three lenders at once. You pick the offer.</p>
</div>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<button type="button" class="go">Find my offers</button>
</sc-if>
<sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}">
<button type="button" class="wait" disabled>{{ left }}</button>
</sc-if>
<span class="lbl" style="text-align:center">Soft pull · your score does not change</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const code = (this.state && typeof this.state.code === 'string') ? this.state.code : '482';
const cells = [0, 1, 2, 3].map((i) => ({ ch: code[i] || '', cls: i === code.length ? 'c cur' : 'c' }));
const n = 4 - code.length;
return {
code: code,
cells: cells,
ready: code.length === 4,
notReady: code.length < 4,
left: n === 1 ? '1 more digit' : n + ' more digits',
onCode: (e) => this.setState({ code: String(e.target.value || '').replace(/[^0-9]/g, '').slice(0, 4) })
};
}
}
</script>
</body>
</html>
