<!-- Reference: Ramp (spend management) https://ramp.com - Docket desk restyled after Ramp's light, near-monochrome approvals inbox with one warm yellow accent. Design study only, not wired to anything. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Ramp study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --line:#E6E4DE; --line2:#EFEDE8;
  --ink:#141414; --ink2:#55534D; --ink3:#8A877F;
  --y:#F6D743; --ytint:#FFF8D2; --yline:#EBD76A;
  --g:#177245; --gt:#E4F3EA; --a:#B25E09; --at:#FDEBD3; --r:#C0282D; --rt:#FDE7E5;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --rad:6px; --radl:8px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);overflow-x:hidden;letter-spacing:-0.005em}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
.num,td,.stat b,.kv b{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--y);border-radius:var(--rad)}

/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--s4) var(--s3)}
.brand{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2) var(--s4)}
.brand svg{flex:none}
.brand b{font-size:16px;font-weight:700;letter-spacing:-0.03em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:var(--s4) var(--s2) var(--s1)}
.nav a{display:flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s2);border-radius:var(--rad);text-decoration:none;color:var(--ink2);font-weight:500}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a[aria-current]{background:var(--bg);color:var(--ink);font-weight:600}
.nav a svg{flex:none;color:currentColor}
.nav .cnt{margin-left:auto;background:var(--y);color:var(--ink);font-size:11px;font-weight:700;min-width:20px;height:18px;line-height:18px;text-align:center;border-radius:9px;padding:0 6px}
.side .foot{margin-top:auto;padding:var(--s3) var(--s2);border-top:1px solid var(--line2);font-size:12px;color:var(--ink3)}
.side .foot b{display:block;color:var(--ink2);font-weight:600}
.main{min-width:0}
.top{height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 var(--s6);position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:var(--s2);font-weight:500;color:var(--ink2)}
.crumb b{color:var(--ink);font-weight:600}
.top .right{display:flex;align-items:center;gap:var(--s3);font-size:13px;color:var(--ink2)}
#app{padding:var(--s5) var(--s6) 48px;display:flex;flex-direction:column;gap:var(--s5)}

/* tags and pills */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 var(--s2);border-radius:4px;background:var(--bg);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.02em;white-space:nowrap}
.tag.sb{background:var(--ytint);border-color:var(--yline);color:#5C4B00;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px 0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{background:var(--gt);color:var(--g)} .pill.a{background:var(--at);color:var(--a)}
.pill.r{background:var(--rt);color:var(--r)} .pill.y{background:var(--ytint);color:#5C4B00;box-shadow:inset 0 0 0 1px var(--yline)}
.pill.y::before{background:var(--y);box-shadow:0 0 0 1px #B89B00}
.pill.n{background:var(--bg);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.best{display:inline-flex;align-items:center;height:20px;padding:0 var(--s2);border-radius:4px;background:var(--y);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.02em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 var(--s3);border-radius:var(--rad);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2c2c2c}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line)} .btn.pri[disabled]:hover{background:var(--ink);border-color:var(--ink)}
.btn.done{background:var(--gt);border-color:var(--gt);color:var(--g);cursor:default}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radl);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:48px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
.ph h2{font-size:14px;font-weight:700;letter-spacing:-0.015em;display:flex;align-items:center;gap:var(--s2)}
.ph .meta{font-size:12px;color:var(--ink3)}
.pb{padding:var(--s4)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s5)}
.page-h h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-0.035em}
.page-h p{color:var(--ink2);margin-top:var(--s1);max-width:620px}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radl)}
.stat{padding:var(--s4) var(--s5);border-left:1px solid var(--line)} .stat:first-child{border-left:0}
.stat span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2)}
.stat b{display:block;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-0.03em;margin-top:var(--s1)}
.stat small{font-size:12px;color:var(--ink3)}
.dot-y{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 0 1px #B89B00}

/* toolbar + switch */
.tools{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;background:none;border:0;padding:0}
.sw .trk{width:34px;height:20px;border-radius:10px;background:#CFCCC4;position:relative;transition:background .15s;flex:none}
.sw .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"] .trk{background:var(--ink)}
.sw[aria-checked="true"] .trk::after{transform:translateX(14px);background:var(--y)}
.tools .hint{color:var(--ink2);font-size:13px}
.tools .chips{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}

/* table */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;font-weight:500;color:var(--ink2);text-align:left;height:34px;padding:0 var(--s3);background:#FBFAF8;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:0 var(--s3);height:44px;border-bottom:1px solid var(--line2);vertical-align:middle}
th.r,td.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
.q td{height:60px}
.q tr.main td{border-bottom:0}
.q tr.main.sel td:first-child{box-shadow:inset 3px 0 0 var(--y)}
.q tr.main.hs td:first-child{box-shadow:inset 3px 0 0 var(--r)}
.q tr.exc td{padding:0 var(--s3) var(--s3) 52px;height:auto;border-bottom:1px solid var(--line)}
.q tbody tr.exc:last-child td{border-bottom:0}
.who b{display:block;font-weight:600}
.who span{color:var(--ink2);font-size:13px}
.rank{color:var(--ink3);font-weight:600}
.pips{display:inline-flex;gap:2px;margin-left:var(--s2);vertical-align:middle}
.pips i{width:6px;height:14px;border-radius:2px;background:var(--line)} .pips i.on{background:var(--ink)}
.acts{display:flex;gap:var(--s2);justify-content:flex-end}
.quote{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s2) var(--s3);background:var(--ytint);border-left:3px solid var(--y);border-radius:0 var(--rad) var(--rad) 0;font-size:13px}
.quote.hs{background:var(--rt);border-left-color:var(--r)}
.quote .lab{flex:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5C4B00}
.quote.hs .lab{color:var(--r)}
.quote q{quotes:"\201C" "\201D";font-weight:500;color:var(--ink)}
.quote .src{flex:none;margin-left:auto;display:flex;gap:var(--s2);align-items:center;color:var(--ink3);font-size:12px}
.quote.ok{background:var(--bg);border-left-color:var(--line)} .quote.ok .lab{color:var(--ink3)}
.qfoot{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line);color:var(--ink2);font-size:13px}
.link{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* detail header */
.dh{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5)}
.av{width:44px;height:44px;border-radius:var(--rad);background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em;flex:none}
.dh h2{font-size:20px;font-weight:700;letter-spacing:-0.03em;display:flex;align-items:center;gap:var(--s3)}
.dh .sub{color:var(--ink2);margin-top:2px}
.dh .facts{margin-left:auto;display:flex;gap:var(--s5)}
.fact span{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.fact b{font-weight:600;font-size:15px}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:var(--s4) var(--s4) var(--s4)}
.step{position:relative;padding:0 var(--s2) 0 0}
.step .bar{height:3px;background:var(--ink);border-radius:2px;margin-bottom:var(--s3);margin-right:var(--s2)}
.step.running .bar{background:linear-gradient(90deg,var(--y) 0 50%,var(--line) 50%)}
.step.pending .bar{background:var(--line)}
.step b{display:flex;align-items:center;gap:6px;font-weight:600}
.step .st{font-size:12px;color:var(--ink3);font-weight:500;margin-top:2px}
.step .mt{font-size:12px;color:var(--ink2);margin-top:2px}
.step.running .st{color:#7A6400;font-weight:600}
.tick{width:14px;height:14px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--y);border-top-color:var(--ink);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* lenders */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s4)}
.lc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radl);min-width:0;overflow:hidden}
.lc.isbest{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lc .top3{height:3px;background:var(--line2)} .lc.isbest .top3{background:var(--y)}
.lc header{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2);padding:var(--s3) var(--s4) var(--s2)}
.lc header b{display:block;font-weight:700;letter-spacing:-0.015em;line-height:1.25}
.lc header .tags{display:flex;gap:var(--s1);margin-top:6px;flex-wrap:wrap;align-items:center}
.mets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin-top:var(--s2)}
.mets div{padding:var(--s2) var(--s3);border-left:1px solid var(--line2)} .mets div:first-child{border-left:0;padding-left:var(--s4)}
.mets span{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.mets b{font-size:14px;font-weight:700;white-space:nowrap;letter-spacing:-0.02em}
.mets b.dash{color:var(--ink3);font-weight:500}
.lc .sec{padding:var(--s3) var(--s4)}
.lc .sec h3{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.lc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lc li{font-size:13px}
.rs{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--s2)}
.rs .f{display:block;color:var(--ink3);font-family:var(--mono);font-size:11px;margin-top:1px;word-break:break-all}
.mk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;margin-top:1px;flex:none}
.mk.t{background:var(--gt);color:var(--g)} .mk.f{background:var(--rt);color:var(--r)} .mk.u{background:var(--bg);color:var(--ink3);box-shadow:inset 0 0 0 1px var(--line)}
.cd{position:relative;padding-left:14px}
.cd::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;background:var(--ink);border-radius:1px}
.lc footer{margin-top:auto;display:flex;justify-content:space-between;padding:var(--s2) var(--s4);border-top:1px solid var(--line2);font-size:12px;color:var(--ink3);background:#FBFAF8}
.legend{display:flex;gap:var(--s4);font-size:12px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dec{background:var(--ink);color:#fff;border-radius:var(--radl);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.dec h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#BDBAB1}
.dec .big{font-size:32px;font-weight:700;letter-spacing:-0.04em;line-height:1}
.dec .big small{font-size:14px;font-weight:500;color:#BDBAB1;letter-spacing:0;margin-left:6px}
.dec p{color:#D5D2C9;font-size:13px}
.dec .row{display:flex;gap:var(--s2);margin-top:auto}
.dec .btn{border-color:#4a4a46;background:transparent;color:#fff}
.dec .btn:hover{border-color:#fff}
.dec .btn.pri{background:var(--y);border-color:var(--y);color:var(--ink)}
.dec .btn.pri:hover{background:#ffe36a}
.dec :focus-visible{outline-color:#fff}

/* lower grid */
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kv{padding:var(--s3) var(--s4);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kv:nth-child(3n){border-right:0}
.kv span{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.kv b{display:flex;align-items:center;gap:var(--s2);font-size:22px;font-weight:700;letter-spacing:-0.03em;line-height:1.3;margin-top:2px}
.kv b.sm{font-size:15px;padding-top:4px;letter-spacing:-0.01em}
.meter{display:block;height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.flags{display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s3) var(--s4)}
.fl{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--bg);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.fl.on{background:var(--rt);color:var(--r);box-shadow:none}
.fl i{font-style:normal;font-weight:500;opacity:.75}
.notice{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);font-size:14px;line-height:1.55;color:#2a2926}
.notice p:first-child{font-weight:600;color:var(--ink)}
.notice p:last-child{color:var(--ink2);font-size:13px;padding-top:var(--s3);border-top:1px solid var(--line2)}
.ev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.lat{padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:6px}
.lat h3{font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:2px}
.lat div{display:grid;grid-template-columns:130px minmax(0,1fr) 56px;gap:var(--s3);align-items:center;font-size:13px}
.lat .tr{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.lat .tr i{display:block;height:100%;background:var(--ink)}
.actor{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.aud td{height:40px;font-size:13px}
.aud td.note{white-space:normal;line-height:1.35;padding-top:6px;padding-bottom:6px}
.aud td .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pg{padding:var(--s3) var(--s5);color:var(--ink3);font-size:12px;text-align:center}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--rad);font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .2s;z-index:20;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:var(--y)}

@media (max-width:1360px){
  .dh .facts{gap:var(--s4)} .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4)}
  #app{padding-left:var(--s5);padding-right:var(--s5)} .top{padding:0 var(--s5)}
  .kv b{font-size:19px}
}
@media (max-width:1100px){
  .app{grid-template-columns:64px minmax(0,1fr)} .nav a span,.nav .grp,.brand b,.brand .tag,.side .foot{display:none} .nav .cnt{display:none}
  .cols{grid-template-columns:minmax(0,1fr)} .pipe{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--s4)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="top" id="top"></div>
    <main id="app" aria-live="polite"></main>
  </div>
</div>
<div id="toast" role="status"></div>

<script type="application/json" id="data">

/* ---------- derived data ---------- */
var STATUS = { awaiting_human:{label:'Awaiting you',cls:'y'}, hard_stop:{label:'Hard stop',cls:'r'}, approved:{label:'Approved',cls:'g'} };
var statusOf = function(s){ return STATUS[s] || {label:human(s),cls:'n'}; };
var CLASSIFY = { approve:{word:'OFFER',cls:'g'}, counteroffer:{word:'COUNTEROFFER',cls:'a'}, deny:{word:'DECLINED',cls:'r'} };
var classOf = function(c){ return CLASSIFY[c] || {word:String(c).toUpperCase(),cls:'n'}; };

var details = {};
[D.selected, D.second].forEach(function(d){ if(d) details[d.applicantId] = d; });

/* The exceptions: anything a person still has to touch. Applicants already approved clear out of the way. */
function isException(q){ return q.status !== 'approved'; }

/* Quote the policy line that broke: the verified decline reason cited by the most lenders (flag rules win ties). */
function ruleFor(q){
  if(q.hardStop) return {kind:'Hard stop', text:q.hardStop.note, field:q.hardStop.field, cited:null, of:null, hs:true};
  if(q.status === 'approved') return {kind:'In policy', text:'No exception. Best offer already approved.', field:null, cited:null, of:null, ok:true};
  var d = details[q.applicantId]; if(!d) return null;
  var declined = d.offers.filter(function(o){ return o.classification === 'deny'; });
  var tally = {};
  declined.forEach(function(o){ o.reasons.forEach(function(r){
    if(r.verified === false) return;
    var t = tally[r.field] || (tally[r.field] = {field:r.field, text:r.text, n:0}); t.n++;
  }); });
  var best = null, bs = -1;
  Object.keys(tally).forEach(function(k){ var s = tally[k].n * 10 + (k.indexOf('flags.') === 0 ? 1 : 0); if(s > bs){ bs = s; best = tally[k]; } });
  if(!best) return null;
  return {kind:'Policy line broken', text:best.text, field:best.field, cited:best.n, of:declined.length};
}
function bestOffer(d){
  var b = null;
  d.offers.forEach(function(o){ if(o.apr != null && (!b || o.apr < b.apr)) b = o; });
  return b;
}

function queueRows(){
  var rows = D.queue.map(function(q){ return {q:q, rule:ruleFor(q)}; });
  var order = function(q){ if(q.status === 'awaiting_human') return 0; if(q.status === 'hard_stop') return 1; return 2; };
  rows.sort(function(a,b){ return order(a.q) - order(b.q) || (a.q.rank || 99) - (b.q.rank || 99); });
  var exc = rows.filter(function(r){ return isException(r.q); });
  var hidden = rows.length - exc.length;
  var shown = state.exceptionsOnly ? exc : rows;
  var split = exc.filter(function(r){ return r.q.status === 'awaiting_human'; }).length;
  var hs = exc.filter(function(r){ return r.q.status === 'hard_stop'; }).length;

  var body = shown.map(function(r){
    var q = r.q, st = statusOf(q.status), rule = r.rule;
    var hasBest = !!q.best, locked = q.status === 'approved' || q.status === 'hard_stop';
    var pips = '';
    if(q.lenders > 0){ for(var i = 0; i < q.lenders; i++) pips += '<i class="' + (i < q.approvals ? 'on' : '') + '"></i>'; }
    var cls = 'main' + (q.applicantId === D.selected.applicantId ? ' sel' : '') + (q.status === 'hard_stop' ? ' hs' : '');
    var main =
      '<tr class="' + cls + '">' +
        '<td class="rank num">' + (q.rank != null ? esc(q.rank) : '—') + '</td>' +
        '<td class="who"><b>' + esc(q.name) + '</b><span>' + esc(q.purpose) + '</span></td>' +
        '<td class="r num"><b style="font-weight:600">' + usd0(q.amountRequested) + '</b></td>' +
        '<td><span class="pill ' + st.cls + '">' + esc(st.label) + '</span></td>' +
        '<td class="num">' + (q.lenders > 0 ? '<b style="font-weight:600">' + esc(q.approvals) + '/' + esc(q.lenders) + '</b><span class="pips" aria-hidden="true">' + pips + '</span>' : '<span class="faint">0/0</span>') + '</td>' +
        '<td>' + (hasBest ? '<b style="font-weight:600" class="num">' + apr(q.best.apr) + '</b> <span class="muted">' + esc(lname(q.best.lender)) + '</span>' : '<span class="faint">No offers</span>') + '</td>' +
        '<td><div class="acts">' +
          '<button class="btn pri sm" data-act="approve" data-name="' + esc(q.name) + '"' + (!hasBest || locked ? ' disabled' : '') + '>Approve best</button>' +
          '<button class="btn sm" data-act="decline" data-name="' + esc(q.name) + '"' + (q.status === 'approved' ? ' disabled' : '') + '>Decline</button>' +
        '</div></td>' +
      '</tr>';
    var quote = '';
    if(rule){
      quote = '<tr class="exc"><td colspan="7"><div class="quote' + (rule.hs ? ' hs' : '') + (rule.ok ? ' ok' : '') + '">' +
        '<span class="lab">' + esc(rule.kind) + '</span><q>' + esc(rule.text) + '</q>' +
        '<span class="src">' + (rule.field ? '<span class="mono">' + esc(rule.field) + '</span>' : '') +
        (rule.cited != null ? '<span>cited by ' + rule.cited + ' of ' + rule.of + ' declining lenders</span>' : '') + '</span></div></td></tr>';
    }
    return main + quote;
  }).join('');

  var foot = state.exceptionsOnly
    ? (hidden > 0 ? hidden + ' applicant' + (hidden > 1 ? 's' : '') + ' already decided and hidden. <button class="link" data-act="showall">Show all ' + rows.length + '</button>' : 'Nothing is hidden.')
    : 'Showing all ' + rows.length + ' applicants. <button class="link" data-act="showexc">Exceptions only</button>';

  return {split:split, hs:hs, hidden:hidden, html:
    '<table class="q"><colgroup><col style="width:44px"><col><col style="width:96px"><col style="width:118px"><col style="width:112px"><col style="width:200px"><col style="width:204px"></colgroup>' +
    '<thead><tr><th>#</th><th>Applicant</th><th class="r">Amount</th><th>Status</th><th>Lenders approving</th><th>Best offer</th><th class="r">Decision</th></tr></thead>' +
    '<tbody>' + (body || '<tr><td colspan="7" style="height:80px;text-align:center" class="muted">Inbox zero. Nothing needs you.</td></tr>') + '</tbody></table>' +
    '<div class="qfoot">' + foot + '</div>'};
}

function mark(v){
  if(v === true) return '<span class="mk t" title="Verified: fixing this field flips the outcome" aria-label="verified">' + ICON.check + '</span>';
  if(v === false) return '<span class="mk f" title="Not supported: withheld from the notice" aria-label="not supported">' + ICON.x + '</span>';
  return '<span class="mk u" title="Not tested" aria-label="not tested">' + ICON.dash + '</span>';
}

function lenderCard(o, bestLender){
  var c = classOf(o.classification), isBest = o.lender === bestLender;
  var met = function(label, val){ return '<div><span>' + label + '</span><b class="num' + (val === '—' ? ' dash' : '') + '">' + val + '</b></div>'; };
  return '<article class="lc' + (isBest ? ' isbest' : '') + '"><div class="top3"></div>' +
    '<header><div><b>' + esc(o.name) + '</b><div class="tags"><span class="tag">' + esc(o.label) + '</span><span class="tag">' + esc(o.policy) + ' policy</span>' + (isBest ? '<span class="best">Best APR</span>' : '') + '</div></div>' +
    '<span class="pill ' + c.cls + '">' + esc(c.word) + '</span></header>' +
    '<div class="mets">' + met('APR', apr(o.apr)) + met('Monthly', usd2(o.monthlyPayment)) + met('Term', o.termMonths == null ? '—' : o.termMonths + ' mo') + met('Amount', usd0(o.amount)) + '</div>' +
    (o.conditions.length ? '<div class="sec"><h3>Conditions</h3><ul>' + o.conditions.map(function(t){ return '<li class="cd">' + esc(t) + '</li>'; }).join('') + '</ul></div>' : '') +
    '<div class="sec"><h3>Reasons</h3><ul>' + o.reasons.map(function(r){
      return '<li class="rs">' + mark(r.verified) + '<span>' + esc(r.text) + '<span class="f">' + esc(r.field) + '</span></span></li>';
    }).join('') + '</ul></div>' +
    '<footer><span>' + esc(o.provider) + '</span><span class="num">' + esc(o.latencyMs) + ' ms</span></footer></article>';
}

  var s = D.selected;
  renderSide();
  document.getElementById('app').innerHTML =
    '<div class="page-h"><div><h1>Approvals</h1><p>Five AI underwriters read each CRS sandbox file. In-policy applicants clear on their own; only exceptions reach you.</p></div></div>' +
    statStrip() + queuePanel() + detailHeader(s) + lendersSection(s) +
    '<div class="cols"><div class="col">' + creditPanel(s) + '</div><div class="col">' + noticePanel(s) + evalPanel() + '</div></div>' +
    auditPanel() +
    '<div class="pg">Docket · personas and sandbox data only, no real PII · a human approves every offer</div>';
  renderQueue();
}

/* ---------- interaction ---------- */
var tt;
function toast(html){
  var t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null; if(!el || el.disabled) return;
  var a = el.getAttribute('data-act');
  if(a === 'toggle'){ state.exceptionsOnly = !state.exceptionsOnly; renderQueue(); var s = document.getElementById('sw'); if(s) s.focus(); }
  else if(a === 'showall'){ state.exceptionsOnly = false; renderQueue(); }
  else if(a === 'showexc'){ state.exceptionsOnly = true; renderQueue(); }
  else if(a === 'approve'){ toast('Demo only. Approve best for <b>' + esc(el.getAttribute('data-name')) + '</b> would go to you for sign-off.'); }
  else if(a === 'decline'){ toast('Demo only. Decline for <b>' + esc(el.getAttribute('data-name')) + '</b> would send the adverse-action notice.'); }
  else if(a === 'dispute'){
    var done = el.classList.toggle('done'); el.textContent = done ? 'Disputed' : 'Dispute';
    el.setAttribute('aria-pressed', done ? 'true' : 'false');
    if(done) toast('Dispute marked for tradeline <b>' + (+el.getAttribute('data-i') + 1) + '</b>. Demo only.');
  }
});

renderAll();
})();
</script>
</body>
</html>
