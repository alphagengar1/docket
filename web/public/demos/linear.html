<!-- Reference: Linear (https://linear.app) - Triage inbox + command palette, restyled for the Docket lending desk. Static design study, not wired to anything. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Linear study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090a; --bg-side:#0b0c0e; --panel:#0f1012; --panel-2:#131417; --raised:#18191c; --pop:#16171a;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05); --line-3:rgba(255,255,255,.14);
  --hover:rgba(255,255,255,.04); --sel:rgba(255,255,255,.07);
  --tx:#f7f8f8; --tx-2:#d0d6e0; --tx-3:#8a8f98; --tx-4:#62666d;
  --acc:#5e6ad2; --acc-2:#8b94f5; --acc-bg:rgba(94,106,210,.16); --acc-line:rgba(94,106,210,.45);
  --grn:#4cb782; --grn-bg:rgba(76,183,130,.13); --grn-line:rgba(76,183,130,.35);
  --amb:#e5a23c; --amb-bg:rgba(229,162,60,.13); --amb-line:rgba(229,162,60,.35);
  --red:#eb5757; --red-bg:rgba(235,87,87,.12); --red-line:rgba(235,87,87,.35);
  --r:6px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --qw:320px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx-2);overflow-x:hidden}
body{font:400 13px/1.45 var(--font);font-feature-settings:'cv11','ss03';-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc-2);outline-offset:1px;border-radius:var(--r)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--tx-3)} .dim{color:var(--tx-4)}
.ic{display:inline-flex;width:16px;height:16px;flex:none;align-items:center;justify-content:center}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.app{display:grid;grid-template-columns:208px var(--qw) minmax(0,1fr);height:100vh;min-width:0}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.sb{background:var(--bg-side);border-right:1px solid var(--line);padding:var(--s3) var(--s2);overflow:auto;gap:2px}
.queue{border-right:1px solid var(--line);background:var(--bg)}
.detail{background:var(--bg)}
.scroll{overflow:auto;flex:1;min-height:0;scroll-behavior:smooth}
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);border-bottom:1px solid var(--line)}
.topbar h2{margin:0;font-size:13px;font-weight:500;color:var(--tx)}
.sp{flex:1}

/* kbd + buttons + pills */
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:4px;font:500 11px/1 var(--font);color:var(--tx-3);background:rgba(255,255,255,.06);border:1px solid var(--line);border-bottom-color:rgba(255,255,255,.03)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 var(--s2) 0 10px;border-radius:var(--r);border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx-2);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.07);color:var(--tx)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ok{background:var(--grn-bg);border-color:var(--grn-line);color:#7ad9a6}
.btn.ok:hover:not(:disabled){background:rgba(76,183,130,.22);color:#a2ecc4}
.btn.no{background:var(--red-bg);border-color:var(--red-line);color:#f28b8b}
.btn.no:hover:not(:disabled){background:rgba(235,87,87,.2);color:#ffb0b0}
.btn.sm{height:22px;padding:0 var(--s2);font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-3)}
.btn.ghost:hover:not(:disabled){background:var(--hover);color:var(--tx)}
.btn.ok .kbd,.btn.no .kbd{background:rgba(255,255,255,.08);color:inherit;border-color:rgba(255,255,255,.1)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:var(--r);color:var(--tx-3)}
.iconbtn:hover{background:var(--hover);color:var(--tx)}
.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 var(--s2) 0 6px;border-radius:10px;border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--tx-2);white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.nodot::before{display:none} .pill.nodot{padding-left:var(--s2)}
.pill.acc{color:var(--acc-2);background:var(--acc-bg);border-color:var(--acc-line)}
.pill.grn{color:#6fd09c;background:var(--grn-bg);border-color:var(--grn-line)}
.pill.amb{color:var(--amb);background:var(--amb-bg);border-color:var(--amb-line)}
.pill.red{color:#f27a7a;background:var(--red-bg);border-color:var(--red-line)}
.pill.gry{color:var(--tx-3)}
.pill.caps{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--s2);border-radius:var(--r);border:1px solid var(--line);font-size:12px;color:var(--tx-2)}
.tag .k{color:var(--tx-4)}

/* sidebar */
.ws{display:flex;align-items:center;gap:var(--s2);padding:4px var(--s2) var(--s2)}
.ws b{font-weight:600;color:var(--tx);font-size:13px}
.ws .pill{margin-left:auto;height:18px;font-size:10.5px}
.tagline{padding:0 var(--s2) var(--s3);color:var(--tx-4);font-size:12px}
.sb-search{display:flex;align-items:center;gap:var(--s2);height:28px;padding:0 var(--s2);border-radius:var(--r);border:1px solid var(--line);color:var(--tx-3);margin-bottom:var(--s3);width:100%}
.sb-search:hover{background:var(--hover);color:var(--tx-2)}
.sb-search .kbd{margin-left:auto}
.sb-item{display:flex;align-items:center;gap:var(--s2);height:28px;padding:0 var(--s2);border-radius:var(--r);color:var(--tx-3);width:100%}
.sb-item:hover{background:var(--hover);color:var(--tx-2)}
.sb-item.active{background:var(--sel);color:var(--tx)}
.sb-item .n{margin-left:auto;color:var(--tx-4);font-size:11.5px;font-variant-numeric:tabular-nums}
.sb-item .n.pol{font-size:11px}
.sb-sec{padding:var(--s4) var(--s2) var(--s1);font-size:11.5px;font-weight:500;color:var(--tx-4)}
.lg{display:inline-flex;width:16px;height:16px;border-radius:4px;background:var(--raised);border:1px solid var(--line);font-size:8px;font-weight:600;align-items:center;justify-content:center;color:var(--tx-3);flex:none;letter-spacing:.02em}
.kv{display:flex;align-items:baseline;gap:var(--s2);padding:3px var(--s2);font-size:12.5px}
.kv span:first-child{color:var(--tx-3)} .kv b{margin-left:auto;font-weight:500;color:var(--tx);font-variant-numeric:tabular-nums}
.sb-foot{margin-top:auto;padding:var(--s3) var(--s2) 0;color:var(--tx-4);font-size:11.5px;line-height:1.5}

/* queue */
.q-sub{padding:var(--s2) var(--s4);color:var(--tx-4);font-size:12px;border-bottom:1px solid var(--line-2);display:flex;gap:var(--s2);align-items:center}
.qlist{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.qrow{border-bottom:1px solid var(--line-2);position:relative}
.qrow.sel{background:var(--sel)}
.qrow.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.qrow.hs{background:linear-gradient(90deg,rgba(235,87,87,.07),transparent 70%)}
.qrow.sel.hs{background:linear-gradient(90deg,rgba(235,87,87,.12),var(--sel) 80%)}
.qmain{display:block;width:100%;padding:var(--s3) var(--s4) var(--s1)}
.qmain:hover{background:var(--hover)}
.q1{display:flex;align-items:center;gap:var(--s2)}
.q1 .rk{width:14px;color:var(--tx-4);font-size:11.5px;font-variant-numeric:tabular-nums}
.q1 .nm{font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q1 .am{margin-left:auto;color:var(--tx);font-variant-numeric:tabular-nums;font-weight:500}
.q2{display:flex;align-items:center;gap:var(--s2);margin:var(--s1) 0 0 22px;color:var(--tx-3);font-size:12px;min-width:0}
.q2 .pp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.q3{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s4) var(--s3) 38px;color:var(--tx-3);font-size:12px}
.q3 .bo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.q3 .bo b{color:var(--tx-2);font-weight:500}
.q3 .ctl{display:flex;gap:var(--s1);margin-left:auto;flex:none}
.qflag{margin:var(--s1) var(--s4) 0 38px;padding:6px var(--s2);border-radius:var(--r);border:1px solid var(--red-line);background:var(--red-bg);color:#f3a0a0;font-size:12px;line-height:1.4}
.qflag .mono{color:#ffb0b0;display:block;margin-bottom:2px}

/* detail */
.wrap{padding:var(--s5) var(--s5) 64px;max-width:1240px;margin:0 auto}
.h1row{display:flex;align-items:center;gap:var(--s3)}
.h1row h1{margin:0;font-size:20px;line-height:28px;font-weight:600;color:var(--tx);letter-spacing:-.012em}
.meta{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3);align-items:center}
.toolbar{display:flex;align-items:center;gap:var(--s2);margin:var(--s4) 0 var(--s5);padding:var(--s3) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .hint{margin-left:auto;display:flex;gap:var(--s3);color:var(--tx-4);font-size:12px;align-items:center}
.toolbar .hint span{display:inline-flex;gap:6px;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:var(--s5);align-items:start}
.main-col{min-width:0;display:flex;flex-direction:column;gap:var(--s5)}
.aside{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
section{scroll-margin-top:var(--s4)}
.sh{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s2);font-size:12.5px;font-weight:500;color:var(--tx-3)}
.sh .c{color:var(--tx-4);font-weight:400;font-variant-numeric:tabular-nums}
.sh .sp{flex:1}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--acc-line);background:var(--acc-bg)}100%{box-shadow:0 0 0 2px transparent}}

.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.step{padding:var(--s3);border-right:1px solid var(--line-2);min-width:0}
.step:last-child{border-right:0}
.step .l{display:flex;align-items:center;gap:6px;color:var(--tx-2);font-weight:500;font-size:12.5px;line-height:1.3}
.step .m{margin-top:var(--s1);color:var(--tx-4);font-size:11.5px;font-variant-numeric:tabular-nums;padding-left:22px;line-height:1.4}
.step.done .ic{color:var(--acc)} .step.running .ic{color:var(--amb)} .step.running .l{color:var(--tx)} .step.running .m{color:var(--amb)}
.step .l span:last-child{min-width:0}

.lenders{display:flex;flex-direction:column;gap:var(--s3)}
.lc{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.lc.best{border-color:var(--acc-line);box-shadow:0 0 0 1px rgba(94,106,210,.15) inset}
.lc-h{display:flex;align-items:center;gap:var(--s2);padding:10px var(--s3);border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.lc-h .nm{font-weight:500;color:var(--tx)}
.lc-h .ex{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.lc-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lc-l{padding:var(--s3);border-right:1px solid var(--line-2);min-width:0}
.lc-r{padding:var(--s3);min-width:0}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3) var(--s2)}
.terms .t .k{font-size:11px;color:var(--tx-4);margin-bottom:2px}
.terms .t .v{font-size:15px;font-weight:500;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.terms .t .v.na{color:var(--tx-4);font-weight:400}
.cond{list-style:none;margin:var(--s3) 0 0;padding:var(--s3) 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.cond li{display:flex;gap:var(--s2);color:var(--tx-2);font-size:12.5px;line-height:1.45}
.cond li::before{content:'';flex:none;width:4px;height:4px;border-radius:50%;background:var(--tx-4);margin-top:8px}
.cond-h{font-size:11px;color:var(--tx-4);margin-top:var(--s3)}
.rs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.rs li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--s2)}
.rs .txt{color:var(--tx-2);font-size:12.5px;line-height:1.45}
.rs .fl{display:flex;align-items:center;gap:var(--s2);margin-top:4px;font-size:11px;color:var(--tx-4)}
.rs .fl .mono{font-size:11px;color:var(--tx-3)}
.vt{color:var(--grn)} .vf{color:var(--red)} .vn{color:var(--tx-4)}
.rs-h{font-size:11px;color:var(--tx-4);margin-bottom:var(--s2)}

.notice{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:var(--s4) var(--s5)}
.notice p{margin:0 0 var(--s3);color:var(--tx-2);font-size:13px;line-height:1.6;max-width:72ch}
.notice p:last-child{margin-bottom:0}
.notice p:first-child{color:var(--tx);font-size:13.5px}
.notice p.lead-red b{color:var(--tx)}

.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;font-variant-numeric:tabular-nums}
.tblwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.tblwrap .tbl{border:0}
.tbl th{font-weight:500;font-size:11.5px;color:var(--tx-4);text-align:left;padding:6px var(--s3);border-bottom:1px solid var(--line)}
.tbl td{padding:5px var(--s3);border-bottom:1px solid var(--line-2);color:var(--tx-2);height:34px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl .r{text-align:right}

.audit{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.au{display:grid;grid-template-columns:68px minmax(0,1fr);gap:var(--s3);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line-2)}
.au:last-child{border-bottom:0}
.au .tm{color:var(--tx-4);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.au .a1{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.au .actor{color:var(--tx);font-weight:500}
.au .act{color:var(--acc-2)}
.au .nt{color:var(--tx-3);font-size:12.5px;margin-top:2px;line-height:1.45}
.au .rf{color:var(--tx-4);font-family:var(--mono);font-size:11px;word-break:break-all}

.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:var(--s2) 0}
.prop{display:grid;grid-template-columns:104px minmax(0,1fr);gap:var(--s2);align-items:center;min-height:28px;padding:0 var(--s3);font-size:12.5px}
.prop .k{color:var(--tx-3)} .prop .v{color:var(--tx);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.score{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s2) var(--s3) var(--s3)}
.score b{font-size:28px;line-height:1;font-weight:600;color:var(--tx);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--acc)}
.flags{display:flex;flex-wrap:wrap;gap:6px;padding:var(--s2) var(--s3) var(--s2)}
.flag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--s2) 0 6px;border-radius:var(--r);font-size:12px;border:1px solid var(--line);color:var(--tx-4)}
.flag.set{color:#f27a7a;background:var(--red-bg);border-color:var(--red-line);font-weight:500}
.flag .ic{width:12px;height:12px}
.lat{display:grid;grid-template-columns:20px minmax(0,1fr) 44px;gap:var(--s2);align-items:center;padding:3px var(--s3);font-size:12px;color:var(--tx-3)}
.lat .bar{height:3px}
.lat .num{text-align:right;color:var(--tx-2)}
.callout{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:var(--s4)}
.callout.red{border-color:var(--red-line);background:var(--red-bg)}
.callout h3{margin:0 0 var(--s2);font-size:13px;color:var(--tx);font-weight:600;display:flex;gap:var(--s2);align-items:center}
.callout p{margin:var(--s2) 0 0;color:var(--tx-2)}

/* palette */
.pal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal-back[hidden]{display:none}
.pal{width:580px;max-width:calc(100vw - 32px);background:var(--pop);border:1px solid var(--line-3);border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);height:48px;border-bottom:1px solid var(--line)}
.pal-in .chip{display:none;height:22px;align-items:center;padding:0 var(--s2);border-radius:var(--r);background:var(--acc-bg);color:var(--acc-2);border:1px solid var(--acc-line);font-size:12px;white-space:nowrap}
.pal-in .chip.on{display:inline-flex}
.pal-in input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:400 15px var(--font);padding:0;height:100%;outline:0}
.pal-in input::placeholder{color:var(--tx-4)}
.pal-list{max-height:360px;overflow:auto;padding:var(--s2)}
.pal-g{padding:var(--s2) var(--s2) var(--s1);font-size:11.5px;font-weight:500;color:var(--tx-4)}
.pi{display:flex;align-items:center;gap:var(--s3);height:36px;padding:0 10px;border-radius:var(--r);color:var(--tx-2);cursor:pointer}
.pi .ic{color:var(--tx-3)}
.pi.sel{background:var(--sel);color:var(--tx)} .pi.sel .ic{color:var(--tx)}
.pi .sub{color:var(--tx-4);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .ks{margin-left:auto;display:flex;gap:var(--s1);flex:none}
.pi .rt{margin-left:auto;color:var(--tx-4);font-size:12px;flex:none}
.pal-empty{padding:var(--s5);text-align:center;color:var(--tx-4)}
.pal-ft{display:flex;gap:var(--s4);padding:var(--s2) var(--s4);border-top:1px solid var(--line);color:var(--tx-4);font-size:11.5px;align-items:center}
.pal-ft span{display:inline-flex;gap:6px;align-items:center}
.toasts{position:fixed;right:var(--s4);bottom:var(--s4);display:flex;flex-direction:column;gap:var(--s2);z-index:60;align-items:flex-end}
.toast{background:var(--pop);border:1px solid var(--line-3);border-radius:var(--r);padding:var(--s2) var(--s3);color:var(--tx);box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:420px;display:flex;gap:var(--s2);align-items:center}

@media (max-width:1399px){
  :root{--qw:296px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
  .aside > *{min-width:0}

      h('div', {class:'main-col'},
        row.hardStop
          ? h('div', {class:'callout red'}, h('h3', null, icon('alert'), 'Hard stop · pipeline halted'), h('div', {class:'mono'}, row.hardStop.field), h('p', null, row.hardStop.note), h('p', {class:'muted'}, 'Underwriting did not run: ' + row.lenders + ' lenders asked, ' + row.approvals + ' offers.'))
          : h('div', {class:'callout'}, h('h3', null, statusIcon(st), STATUS[st].label), h('p', null, row.approvals + ' of ' + row.lenders + ' lenders approved' + (best ? '. Best offer: ' + best.name + ' at ' + pct1(row.best.apr) + ' APR.' : '.')),
              h('p', {class:'muted'}, 'Full underwriting detail is loaded for the two awaiting applicants in this study.')),
        section('sec-audit', 'Audit log', D.audit.length, audit())),
      h('div', {class:'aside'}, evalPanel()));
  }
  $('#detail').replaceChildren(topbar, h('div', {class:'scroll', id:'scroll'}, h('div', {class:'wrap'}, header, toolbar, body)));
}

/* ---------- actions ---------- */
function render(){ renderSidebar(); renderQueue(); renderDetail(); }
function select(id){ state.sel = id; render(); }
function step(d){ const i = D.queue.indexOf(curRow()); select(D.queue[(i + d + D.queue.length) % D.queue.length].applicantId); }
function decide(kind){
  const row = curRow(), st = effStatus(row);
  if(kind === 'approved' && !(st === 'awaiting_human' && row.best)) { toast('Nothing to approve for ' + row.name); return; }
  if(kind === 'declined' && !(st === 'awaiting_human' || st === 'hard_stop')) { toast(row.name + ' is already decided'); return; }
  state.dec[row.applicantId] = kind;
  if(kind === 'approved'){ const l = lenderById(row.best.lender); toast('Approved ' + l.name + ' · ' + pct1(row.best.apr) + ' APR for ' + row.name); }
  else toast('Declined ' + row.name + ' · notice goes out with the reasons on file');
  const next = D.queue.find(r => effStatus(r) === 'awaiting_human');
  if(next) state.sel = next.applicantId;
  render();
}
function goto(id){
  closePal();
  const el = document.getElementById(id); if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'start'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function runEval(){
  closePal();
  const el = document.getElementById('sec-eval');
  if(el){ el.scrollIntoView({behavior:'smooth', block:'nearest'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  toast('Eval run · ' + D.eval.cases + ' cases · agreement ' + pct0(D.eval.agreement) + ' · reasons verified ' + pct0(D.eval.reasonsVerified));
}
function copyNotice(a){
  try{ navigator.clipboard.writeText(a.notice).then(() => toast('Notice copied'), () => toast('Copy blocked by the browser')); }catch(e){ toast('Copy unavailable here'); }
}
function toast(msg){
  const t = h('div', {class:'toast', role:'status'}, icon('check'), msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3600);
}

/* ---------- command palette ---------- */
const pal = {open:false, q:'', idx:0, mode:'root', items:[], prevFocus:null};
function palItems(){
  const q = pal.q.trim().toLowerCase();
  const people = D.queue.map(r => ({group:pal.mode === 'jump' ? 'Jump to applicant' : 'Applicants', ico:'user', title:r.name, sub:r.purpose + ' · ' + money(r.amountRequested), right:STATUS[effStatus(r)].label, run:() => { closePal(); select(r.applicantId); }}));
  let items;
  if(pal.mode === 'jump') items = people;
  else items = [
    {group:'Suggested', ico:'user', title:'Jump to applicant', sub:'Search the queue', keys:['G', 'A'], keep:true, run:() => { pal.mode = 'jump'; pal.q = ''; pal.idx = 0; syncPal(); }},
    {group:'Suggested', ico:'play', title:'Run eval', sub:D.eval.cases + ' cases · ' + D.product.lenders.length + ' lenders', keys:['E'], run:runEval}
  ].concat(people, [
    {group:'Actions', ico:'check', title:'Approve best offer', sub:curRow().name, keys:['A'], run:() => { closePal(); decide('approved'); }},
    {group:'Actions', ico:'x', title:'Decline applicant', sub:curRow().name, keys:['X'], run:() => { closePal(); decide('declined'); }},
    {group:'Go to', ico:'doc', title:'Adverse-action notice', run:() => goto('sec-notice')},
    {group:'Go to', ico:'log', title:'Audit log', run:() => goto('sec-audit')},
    {group:'Go to', ico:'arrow', title:'Credit snapshot', run:() => goto('sec-credit')},
    {group:'Go to', ico:'arrow', title:'Lender offers', run:() => goto('sec-offers')}
  ]);
  if(q) items = items.filter(i => (i.title + ' ' + (i.sub || '')).toLowerCase().indexOf(q) !== -1);
  return items;
}
function syncPal(){
  const input = $('#palinput'); input.value = pal.q;
  input.placeholder = pal.mode === 'jump' ? 'Jump to applicant…' : 'Type a command or search…';
  const chip = $('#palchip'); chip.textContent = 'Jump to applicant'; chip.classList.toggle('on', pal.mode === 'jump');
  $('#palicon').replaceChildren(icon('search').firstChild);
  pal.items = palItems(); if(pal.idx >= pal.items.length) pal.idx = Math.max(0, pal.items.length - 1);
  const list = $('#pallist'); list.replaceChildren();
  if(!pal.items.length){ list.append(h('div', {class:'pal-empty'}, 'No results')); return; }
  let g = null;
  pal.items.forEach((it, i) => {
    if(it.group !== g){ g = it.group; list.append(h('div', {class:'pal-g'}, g)); }
    list.append(h('div', {class:'pi' + (i === pal.idx ? ' sel' : ''), role:'option', 'data-i':i, 'aria-selected':i === pal.idx ? 'true' : 'false',
      on:{mouseenter:() => setIdx(i, false), click:() => it.run()}},
      icon(it.ico), h('span', null, it.title), it.sub ? h('span', {class:'sub'}, it.sub) : null,
      it.keys ? h('span', {class:'ks'}, it.keys.map(kbd)) : it.right ? h('span', {class:'rt'}, it.right) : null));
  });
}
function setIdx(i, scroll){
  pal.idx = i;
  document.querySelectorAll('#pallist .pi').forEach(el => { const on = +el.getAttribute('data-i') === i; el.classList.toggle('sel', on); el.setAttribute('aria-selected', on ? 'true' : 'false'); if(on && scroll) el.scrollIntoView({block:'nearest'}); });
}
function openPal(mode){
  pal.prevFocus = document.activeElement; pal.open = true; pal.mode = mode || 'root'; pal.q = ''; pal.idx = 0;
  $('#palback').hidden = false; syncPal(); $('#palinput').focus();
}
function closePal(){
  if(!pal.open) return; pal.open = false; $('#palback').hidden = true;
  try{ if(pal.prevFocus && pal.prevFocus.focus && document.contains(pal.prevFocus)) pal.prevFocus.focus(); }catch(e){}
}
function wirePal(){
  const input = $('#palinput');
  input.addEventListener('input', () => { pal.q = input.value; pal.idx = 0; syncPal(); });
  input.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); if(pal.items.length) setIdx((pal.idx + 1) % pal.items.length, true); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); if(pal.items.length) setIdx((pal.idx - 1 + pal.items.length) % pal.items.length, true); }
    else if(e.key === 'Enter'){ e.preventDefault(); const it = pal.items[pal.idx]; if(it) it.run(); }
    else if(e.key === 'Backspace' && !input.value && pal.mode === 'jump'){ e.preventDefault(); pal.mode = 'root'; pal.idx = 0; syncPal(); }
  });
  $('#palback').addEventListener('mousedown', e => { if(e.target === $('#palback')) closePal(); });
}
document.addEventListener('keydown', e => {
  const k = e.key;
  if((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k'){ e.preventDefault(); pal.open ? closePal() : openPal('root'); return; }
  if(k === 'Escape' && pal.open){ e.preventDefault(); closePal(); return; }
  if(pal.open || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const lk = k.toLowerCase();
  if(lk === 'a') decide('approved'); else if(lk === 'x') decide('declined');
  else if(lk === 'j') step(1); else if(lk === 'k') step(-1); else if(lk === 'e') runEval();
});

/* ---------- boot ---------- */
render(); wirePal(); openPal('root');
})();
</script>
</body>
</html>
