<!doctype html><html><head><meta charset="utf-8"><title>Docket thumbnail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--alu:#e3e4df;--ink:#141514;--sig:#ff5a1f;--mute:#565952}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;background:var(--alu);color:var(--ink);overflow:hidden}
.s{width:100vw;height:100vh;padding:7vh 6vw;display:flex;flex-direction:column;justify-content:space-between;font-family:'Instrument Sans',sans-serif;border-bottom:1.4vh solid var(--ink)}
.brand{display:flex;align-items:center;gap:2vw}
.sq{width:9vh;height:9vh;background:var(--sig)}
.w{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;font-size:15vh;line-height:1}
.tag{font-size:5.6vh;font-weight:600}
.l{font-family:'JetBrains Mono',monospace;font-size:3.6vh;display:flex;flex-direction:column;gap:1.6vh;border-top:.5vh solid var(--ink);padding-top:3vh}
.l span{color:var(--mute)} .l b{color:var(--ink);font-weight:600}
</style></head><body><div class="s">
<div class="brand"><div class="sq"></div><div class="w">Docket</div></div>
<div class="tag">A one-person credit union</div>
<div class="l"><div>5 AI underwriters · 1 human</div><div>Every denial reason verified</div><div>CRS · Convex · Claude · CREAO</div></div>
</div></body></html>
