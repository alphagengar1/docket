<!-- Reference: Arize Phoenix, https://phoenix.arize.com (trace tree + experiment compare). Docket design study, static demo, not wired to anything. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Arize Phoenix study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090a; --panel:#111113; --panel2:#17171a; --raise:#1d1d21; --line:#26262b; --line2:#36363d;
  --text:#f3f3f4; --mute:#a0a0a8; --dim:#6d6d76;
  --orange:#ee6a30; --orange-bg:rgba(238,106,48,.16);
  --blue:#3bb4f2; --yellow:#f6c418; --grey:#c9c9cf;
  --ok:#3ecf8e; --ok-bg:#0c3626; --ok-line:#14573b; --out-bg:#0b2219; --out-line:#143d2b;
  --warn:#f5a524; --warn-bg:#3a2a0a; --bad:#f2555a; --bad-bg:#3b1416;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .dim{color:var(--dim)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s5);height:64px;border-bottom:1px solid var(--line);background:#050506}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand span.tag{color:var(--mute);font-size:14px}
.topbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid var(--line2);border-radius:999px;color:var(--mute);font-size:12.5px;white-space:nowrap}
.pill.sandbox{color:var(--warn);border-color:rgba(245,165,36,.45);background:var(--warn-bg);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:var(--s2);height:36px;padding:0 14px;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--raise);border-color:#4a4a52}
.btn .count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--raise);font-size:12px;font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.go{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.btn.go:hover{background:#0f4631}
.btn.no:hover{color:var(--bad);border-color:rgba(242,85,90,.5);background:var(--bad-bg)}
.btn[aria-disabled=true]{opacity:.38;cursor:not-allowed}
.btn.link{border:0;background:none;padding:0 6px;color:var(--mute)}
.btn.link:hover{color:var(--text);background:none;text-decoration:underline}

.page{padding:var(--s4) var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s4);max-width:1760px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}
.phead{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);min-height:56px}
.phead h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.phead h3{margin:0;font-size:16px;font-weight:600}
.phead .grow{flex:1}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:var(--s3) 56px;padding:var(--s4) var(--s5)}
.stat .k{font-size:16px;color:var(--mute);line-height:1.2}
.stat .v{display:flex;align-items:center;gap:var(--s2);font-size:32px;line-height:1.25;font-weight:500;letter-spacing:-.01em;margin-top:2px}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
.stat .v.mono{font-family:var(--mono);font-weight:500;font-size:30px}
.stat .sub{font-size:12.5px;color:var(--dim)}

/* queue */
.qrow{display:grid;grid-template-columns:44px minmax(150px,1.3fr) minmax(130px,1fr) 100px 150px 120px minmax(160px,1.3fr) 214px;gap:var(--s3);align-items:center;padding:10px var(--s4);border-bottom:1px solid var(--line);min-height:56px}
.qrow:last-child{border-bottom:0}
.qrow.qhead{min-height:36px;padding-top:6px;padding-bottom:6px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.07em;background:var(--panel2)}
.qrow.sel{background:#1b1b1f;box-shadow:inset 3px 0 0 var(--orange)}
.qrow.hs{background:linear-gradient(90deg,rgba(242,85,90,.12),rgba(242,85,90,.03));box-shadow:inset 3px 0 0 var(--bad)}
.qrow .name{font-weight:600;font-size:15px}
.qrow .rank{font-family:var(--mono);color:var(--mute);font-size:15px}
.qrow .amt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px}
.qrow .acts{display:flex;gap:var(--s2);justify-content:flex-end;align-items:center}
.hsnote{grid-column:2 / -1;display:flex;gap:var(--s2);align-items:flex-start;color:#f3a5a8;font-size:13px;margin-top:-4px}
.hsnote code{font-family:var(--mono);color:var(--bad);background:var(--bad-bg);border-radius:4px;padding:0 6px;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.st.warn{color:var(--warn);background:var(--warn-bg);border-color:rgba(245,165,36,.4)}
.st.bad{color:var(--bad);background:var(--bad-bg);border-color:rgba(242,85,90,.45)}
.st.idle{color:var(--mute);background:var(--raise);border-color:var(--line2)}
.segs{display:flex;gap:3px;align-items:center}
.segs i{width:14px;height:6px;border-radius:2px;background:var(--line2)}
.segs i.on{background:var(--ok)}
.segs .n{margin-left:var(--s2);font-family:var(--mono);font-size:13px;color:var(--mute)}
.decided{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ok)}

/* applicant header */
.ahead{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ahead h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.idpill{display:inline-flex;align-items:center;gap:var(--s2);height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);font-family:var(--mono);font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.idpill b{color:var(--text);font-weight:500}
.tagp{display:inline-flex;align-items:center;height:24px;padding:0 10px;border:1px solid var(--line2);border-radius:999px;color:var(--text);font-size:13px;background:var(--panel2)}

/* tiles (span icons) */
.tile{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.tile.llm{background:#2a1608;color:var(--orange);box-shadow:inset 0 0 0 1px rgba(238,106,48,.35)}
.tile.chain{background:var(--blue);color:#06293b}
.tile.tool{background:var(--yellow);color:#3a2d00}
.tile.agent{background:#2a2a2f;color:var(--grey);box-shadow:inset 0 0 0 1px var(--line2)}

/* compare */
.cmp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.col{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.col:last-child{border-right:0}
.col.best{background:linear-gradient(180deg,rgba(238,106,48,.07),transparent 240px)}
.chead{padding:var(--s4) var(--s4) var(--s3);display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:var(--s2);min-width:0}
.letter{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:6px;border:1px solid currentColor;font-family:var(--mono);font-size:13px;font-weight:600}
.letter.ok{color:var(--ok)} .letter.warn{color:var(--warn)} .letter.bad{color:var(--bad)}
.lname{font-size:16px;font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.best-badge{margin-left:auto;flex:none;height:20px;padding:0 7px;display:inline-flex;align-items:center;border-radius:5px;background:var(--orange);color:#1a0a02;font-size:10.5px;font-weight:700;letter-spacing:.06em;font-family:var(--mono)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.meta .k{color:var(--dim);letter-spacing:.04em}
.ist{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.ist span{display:inline-flex;align-items:center;gap:6px}
.ist .ic{color:var(--mute)}
.metric{display:flex;align-items:center;gap:var(--s2);font-family:var(--mono);font-size:13px;min-width:0}
.metric .dot{width:8px;height:8px;border-radius:2px;background:var(--orange);flex:none}
.metric .mk{color:var(--text);width:62px;flex:none}
.chip{display:inline-block;min-width:44px;text-align:center;padding:1px 8px;border-radius:5px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:500}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.n{background:var(--raise);color:var(--dim)}
.bar{flex:1;min-width:24px;height:6px;border-radius:3px;background:#2d2d32;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--orange)}
.strip{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s4);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0e0e10;min-height:56px}
.strip .apr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.02em}
.strip .apr small{font-size:12px;color:var(--dim);margin-left:4px;letter-spacing:.04em}
.strip .grow{flex:1}
.strip .ic{color:var(--dim)}
.cbody{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s3);margin:0;font-size:13.5px}
.kv dt{color:var(--mute)} .kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sect{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;gap:var(--s2);font-size:13.5px;line-height:1.45}
.list li>div{min-width:0}
.list .fld{display:block;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.cond li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-top:7px}
.mk{display:inline-grid}
.mark{flex:none;margin-top:2px}
.mark.t{color:var(--ok)} .mark.f{color:var(--bad)} .mark.u{color:var(--dim)}
.legend{display:flex;gap:var(--s5);flex-wrap:wrap;padding:10px var(--s4);border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);background:#0e0e10}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* split */
.split{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:var(--s4);align-items:start}
.tree{list-style:none;margin:0;padding:var(--s2) var(--s2) var(--s4)}
.tree ul{list-style:none;margin:0;padding:0 0 0 16px;margin-left:16px}
.tree li{position:relative}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:0;width:14px;height:25px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);border-bottom-left-radius:9px}
.tree ul>li:not(:last-child)::after{content:"";position:absolute;left:-16px;top:25px;bottom:0;border-left:1px solid var(--line2)}
.node{display:flex;align-items:center;gap:10px;min-height:50px;padding:5px var(--s3) 5px 4px;border-radius:8px;list-style:none;cursor:default}
.node::-webkit-details-marker{display:none}
summary.node{cursor:pointer}
.node:hover{background:var(--panel2)}
.node.root{background:#232327}
.node .t{min-width:0;flex:1}
.node .nm{font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.node .mt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:2px;overflow-wrap:anywhere}
.node .chev{flex:none;color:var(--mute);transition:transform .15s}
details[open]>summary .chev{transform:rotate(180deg)}
.node .done{color:var(--ok);flex:none}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(245,165,36,.5)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(245,165,36,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.node .chev{transition:none}}
.runpill{height:20px;padding:0 7px;border-radius:5px;background:var(--warn-bg);color:var(--warn);font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;display:inline-flex;align-items:center}
.tlegend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);padding:var(--s3) var(--s4);border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.tlegend span{display:inline-flex;align-items:center;gap:6px}
.tlegend .tile{width:18px;height:18px;border-radius:5px}

/* tabs */
.tabs{display:flex;gap:var(--s5);padding:0 var(--s4);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{position:relative;display:inline-flex;align-items:center;gap:var(--s2);height:52px;border:0;background:none;color:var(--mute);font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text)}
.tab .count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--raise);color:var(--text);font-size:12.5px;font-weight:600}
.tp{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
.tp[hidden]{display:none}
.blk{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.blk>summary{display:flex;align-items:center;gap:var(--s3);height:48px;padding:0 var(--s4);cursor:pointer;list-style:none;font-size:17px;font-weight:600}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary .chev{transition:transform .15s;transform:rotate(-90deg);color:var(--mute)}
.blk[open]>summary .chev{transform:rotate(0)}
.blk>summary .grow{flex:1}
.blk .bb{padding:var(--s4);border-top:1px solid var(--line)}
.blk.out{background:linear-gradient(180deg,var(--out-bg),#0a1812);border-color:var(--out-line)}
.blk.out .bb{border-top-color:var(--out-line)}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;color:var(--mute);cursor:pointer}
.iconbtn:hover{color:var(--text);background:var(--raise)}
.sel-fake{display:inline-flex;align-items:center;gap:var(--s3);height:32px;padding:0 10px 0 12px;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;font-size:13.5px;color:var(--text)}
.snap{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--s4) var(--s4)}
.snap .k{font-size:13px;color:var(--mute)}
.snap .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;line-height:1.3;display:flex;align-items:center;gap:6px}
.flags{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.flag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);font-size:13px;color:var(--mute);background:var(--panel2)}
.flag.on{color:var(--bad);border-color:rgba(242,85,90,.5);background:var(--bad-bg);font-weight:600}
.flag b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;font-weight:600}
.srcline{margin:var(--s3) 0 0;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.notice p{margin:0 0 var(--s4);font-family:var(--mono);font-size:13px;line-height:1.7;color:#d6e5dc;overflow-wrap:anywhere}
.notice p:last-child{margin-bottom:0}
.notice p:first-child{color:#fff}

/* tables */
.tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.trow{display:grid;gap:var(--s3);align-items:center;padding:9px var(--s4);border-bottom:1px solid var(--line);font-size:13.5px;min-width:0}
.trow:last-child{border-bottom:0}
.trow.th{background:var(--panel2);color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.07em;padding-top:7px;padding-bottom:7px}
.trow:not(.th):hover{background:#151518}
.tl{grid-template-columns:minmax(110px,1.2fr) 110px 120px minmax(90px,1fr) 100px}
.tl .r{text-align:right}
.au{grid-template-columns:104px 150px 150px minmax(120px,.9fr) minmax(180px,2fr)}
.au>*{min-width:0;overflow-wrap:anywhere}
.actor{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px}
.actor::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--grey)}
.actor.uw::before{background:var(--orange)} .actor.crs::before{background:var(--blue)} .actor.rules::before{background:var(--yellow)} .actor.compliance::before{background:var(--ok)}
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--s4)}
.evc{border:1px solid var(--line);border-radius:10px;padding:var(--s4);background:var(--panel2)}
.evc .k{font-size:16px;color:var(--mute)}
.evc .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:32px;font-weight:500;margin:2px 0 var(--s2)}
.lat{display:grid;grid-template-columns:minmax(150px,1.2fr) 70px 3fr;gap:var(--s3);align-items:center;padding:8px var(--s4);border-bottom:1px solid var(--line);font-size:13.5px}
.lat:last-child{border-bottom:0}
.lat .num{text-align:right}

.foot{color:var(--dim);font-size:12.5px;text-align:center;padding:var(--s2) 0 0}

@media (max-width:1180px){
  .cmp{grid-template-columns:repeat(3,minmax(0,1fr))}
  .col{border-bottom:1px solid var(--line)}
  .split{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="page">
  <section class="panel" id="desk" aria-label="Desk summary"></section>
  <section class="panel" id="queue" aria-label="Queue"></section>
  <section class="panel" id="applicant" aria-label="Selected applicant"></section>
  <section class="panel" id="compare" aria-label="Lender comparison"></section>
  <div class="split">
    <aside class="panel" id="tree" aria-label="Pipeline"></aside>
    <section class="panel" id="detail" aria-label="Applicant detail"></section>
  </div>
  <div class="foot" id="foot"></div>
</main>

<script type="application/json" id="data">{
  "_about": "Shared demo data for the UI reference mock pages (design/ui-catalog). Numbers come from the deterministic stub over the real CRS sandbox fixtures. Every mock renders the same information so the designs can be compared.",
  "product": {
    "name": "Docket",
    "tagline": "A one-person credit union",
    "sandbox": true,
    "lenders": [
      {
        "id": "cu",
        "name": "Pacific Ridge Credit Union",
        "label": "Credit Union",
        "policy": "Conservative"
      },
      {
        "id": "fintech",

/* compare */
var offers = sel.offers, req = sel.amountRequested;
var bestApr = null;
offers.forEach(function(o){ if(o.apr != null && (bestApr == null || o.apr < bestApr)) bestApr = o.apr; });
var nTested = 0, nTrue = 0;
offers.forEach(function(o){ o.reasons.forEach(function(r){ if(r.verified !== null){ nTested++; if(r.verified === true) nTrue++; } }); });
function markFor(v){
  if(v === true) return '<span class="mark t" title="Verified: fixing this field alone flips the decline">' + ic("checkc", 16) + '<span class="sr">verified</span></span>';
  if(v === false) return '<span class="mark f" title="Not supported: withheld from the notice">' + ic("xc", 16) + '<span class="sr">not supported</span></span>';
  return '<span class="mark u" title="Not tested">' + ic("dash", 16) + '<span class="sr">not tested</span></span>';
}
var cols = "";
offers.forEach(function(o, i){

  var isBest = bestApr != null && o.apr === bestApr;
  var covered = o.amount != null ? Math.min(1, o.amount / req) : 0;
  var tested = o.reasons.filter(function(r){ return r.verified !== null; });
  var ver = tested.length ? tested.filter(function(r){ return r.verified === true; }).length / tested.length : null;

function stepMeta(s){
  if(s.state === "running") return '<span class="pulse"></span><span style="color:var(--warn)">' + esc(s.metric) + '</span>';
  return ic("clock", 13) + esc(s.metric);
}
function stepTail(s){
  return s.state === "done" ? ic("checkc", 18, "done") : '<span class="runpill">RUNNING</span>';
}
function leafNode(kind, name, meta, tail, cls){
  return '<div class="node ' + (cls||"") + '">' + tile(kind) + '<div class="t"><div class="nm">' + name + '</div><div class="mt">' + meta + '</div></div>' + (tail||"") + '</div>';
}
var treeKids = "";
steps.forEach(function(s){
  var kind = KIND[s.id] || "chain";
  if(s.id === "underwrite"){
    var kids = offers.map(function(o){
      var c = CLS[o.classification] || {w:"", t:"idle"};
      var col = c.t === "ok" ? "var(--ok)" : c.t === "warn" ? "var(--warn)" : "var(--bad)";
      return '<li>' + leafNode("llm", esc(o.name), ic("ring", 13) + secs(o.latencyMs) + ' · <span style="color:' + col + '">' + c.w + '</span>', "") + '</li>';
    }).join("");
    treeKids += '<li><details open><summary class="node">' + tile(kind) + '<div class="t"><div class="nm">' + esc(s.label) + '</div><div class="mt">' + stepMeta(s) + '</div></div>' + stepTail(s) + ic("chev", 18, "chev") + '</summary><ul>' + kids + '</ul></details></li>';
  } else {
    treeKids += '<li>' + leafNode(kind, esc(s.label), stepMeta(s), stepTail(s)) + '</li>';
  }
});

    evc("Per-lender agreement", E.perLenderAgreement.toFixed(2), "mean across five lenders", E.perLenderAgreement) +
    evc("Reasons verified", E.reasonsVerified.toFixed(2), "share of reasons that survive the flip test", E.reasonsVerified) +
    evc("Fraud: zero offers", E.fraudZeroOffers ? '<span style="color:var(--ok);display:inline-flex;align-items:center;gap:8px;font-size:28px">' + ic("checkc", 28) + 'OK</span>' : '<span style="color:var(--bad)">FAIL</span>', "fraud cases never receive an offer") +
    evc("Reasons per denial", E.avgReasonsPerDenial.toFixed(2), "every denial carries at least two") +
  '</div>' +
  '<div class="tbl"><div class="trow th" style="grid-template-columns:minmax(150px,1.2fr) 70px 3fr"><div>Lender</div><div style="text-align:right">p50</div><div>Latency</div></div>' + latRows + '</div>';

var TABS = [
  {id:"info", label:"Info", html:infoPane},
  {id:"trade", label:"Tradelines", n:B.tradelines.length, html:tradePane},
  {id:"audit", label:"Audit", n:D.audit.length, html:auditPane},
  {id:"eval", label:"Eval", html:evalPane}
];
$("detail").innerHTML =
  '<div class="phead"><span class="tagp">applicant</span><h3 style="font-size:22px;font-weight:600">' + esc(sel.name) + '</h3>' + ic("checkc", 22).replace('class="ic ', 'style="color:var(--ok)" class="ic ') + '<span class="grow"></span><span class="mono dim" style="font-size:12.5px">' + esc(sel.purpose) + ' · ' + usd(sel.amountRequested) + '</span></div>' +
  '<div class="tabs" role="tablist" aria-label="Applicant detail">' + TABS.map(function(t, i){
    return '<button class="tab" role="tab" type="button" id="tab-' + t.id + '" aria-controls="tp-' + t.id + '" aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '" data-tabid="' + t.id + '">' + t.label + (t.n != null ? ' <span class="count">' + t.n + '</span>' : '') + '</button>';
  }).join("") + '</div>' +
  TABS.map(function(t, i){ return '<div class="tp" role="tabpanel" id="tp-' + t.id + '" aria-labelledby="tab-' + t.id + '"' + (i === 0 ? "" : " hidden") + '>' + t.html + '</div>'; }).join("");

function showTab(id){
  TABS.forEach(function(t){
    var on = t.id === id, b = $("tab-" + t.id);
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    $("tp-" + t.id).hidden = !on;
  });
}
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("button") : null; if(!el) return;
  if(el.dataset.tabid){ showTab(el.dataset.tabid); return; }
  if(el.dataset.tab){ showTab(el.dataset.tab); $("detail").scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(el.dataset.act){ decisions[el.dataset.id] = el.dataset.act; renderQueue(); return; }
  if(el.dataset.undo){ delete decisions[el.dataset.undo]; renderQueue(); return; }
  if(el.dataset.dispute != null){ el.textContent = "Dispute filed"; el.disabled = true; el.setAttribute("aria-disabled","true"); el.style.opacity = ".6"; return; }
  if(el.dataset.copy != null && el.dataset.copy !== ""){ try { navigator.clipboard.writeText(el.dataset.copy); } catch(err){} return; }
  if(el.hasAttribute("data-copy-notice")){ try { navigator.clipboard.writeText(sel.notice); } catch(err){} return; }
});
document.addEventListener("keydown", function(e){
  if(e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  var b = e.target.closest ? e.target.closest(".tab") : null; if(!b) return;
  var i = TABS.map(function(t){ return t.id; }).indexOf(b.dataset.tabid);
  var n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length].id;
  showTab(n); $("tab-" + n).focus();
});
$("foot").textContent = D.product.name + " · sandbox personas only · a human approves every offer · design study after Arize Phoenix";
})();
</script>
</body>
</html>
