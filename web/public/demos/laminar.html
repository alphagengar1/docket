<!-- Reference: Laminar (https://www.lmnr.ai), agent tracing: traces table with 3px status bars, Failure Detector card, transcript inspector. Docket desk restyled after it. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Laminar study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --nav:#0d0d0d; --panel:#0f0f0f; --raise:#141414; --raise2:#1b1b1b; --hover:#131313; --sel:#171717;
  --line:#202020; --line2:#2b2b2b;
  --tx:#ececec; --tx2:#a1a1a1; --tx3:#686868;
  --blue:#3b82f6; --blue-soft:#0f1b2d; --blue-line:#1d3556;
  --green:#22c55e; --amber:#f5a524; --red:#ef4444; --violet:#8b5cf6; --cyan:#22b8cf;
  --green-soft:rgba(34,197,94,.12); --amber-soft:rgba(245,165,36,.12); --red-soft:rgba(239,68,68,.12);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --insp:500px; --navw:190px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:4px}
.ico{flex:none;display:block}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--tx3)} .mut{color:var(--tx2)}
.green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)} .blue{color:var(--blue)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.app{display:grid;grid-template-columns:var(--navw) minmax(0,1fr) var(--insp);height:100vh;min-width:0}

/* nav */
.nav{background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:var(--s3) var(--s2);min-width:0;overflow:hidden}
.ws{display:flex;align-items:center;gap:var(--s2);height:36px;padding:0 var(--s2);margin-bottom:var(--s3)}
.ws .name{font-weight:500;font-size:14px}
.ws .sp{flex:1}
.nav-item{display:flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s2);border-radius:6px;color:var(--tx2);width:100%;background:none;border:0;text-align:left;font-size:13px}
.nav-item:hover{background:var(--hover);color:var(--tx)}
.nav-item.on{background:var(--raise2);color:var(--tx)}
.nav-item .lbl{flex:1}
.nav-item .badge{font:500 10px var(--mono);background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line);padding:0 6px;border-radius:999px;line-height:16px}
.nav .grow{flex:1}
.os{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:var(--s3);margin-bottom:var(--s3);color:var(--tx2);font-size:12px;line-height:1.4}
.os b{display:block;color:var(--tx);font-weight:500;margin-bottom:var(--s1)}
.wordmark{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s2) var(--s1);color:#4a4a4a;font-size:22px;font-weight:600;letter-spacing:-.02em}

/* chips + buttons */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:6px;font-size:11px;color:var(--tx2);background:var(--panel);white-space:nowrap;max-width:100%}
.chip.pill{border-radius:999px}
.chip .sq{width:14px;height:14px;border-radius:4px;background:#1d3a66;color:#7fb0ff;display:grid;place-items:center;flex:none}
.tone-green{color:var(--green);border-color:rgba(34,197,94,.35);background:var(--green-soft)}
.tone-amber{color:var(--amber);border-color:rgba(245,165,36,.35);background:var(--amber-soft)}
.tone-red{color:var(--red);border-color:rgba(239,68,68,.35);background:var(--red-soft)}
.tone-blue{color:#6ea8ff;border-color:var(--blue-line);background:var(--blue-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);font-size:12px;color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--raise2)}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn.ok{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.btn.ok:hover{background:rgba(34,197,94,.16)}
.btn.no:hover{color:var(--red);border-color:rgba(239,68,68,.45)}
.btn[disabled]{opacity:.35;cursor:not-allowed;background:transparent}
.btn.icon{width:28px;padding:0;color:var(--tx2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* main */
.main{overflow:auto;min-width:0;background:var(--bg);scroll-behavior:smooth}
.mh{display:flex;align-items:center;gap:var(--s3);height:48px;padding:0 var(--s4);position:sticky;top:0;background:var(--bg);z-index:5}
.mh h1{font-size:15px;font-weight:500;margin:0}
.mh .sp{flex:1}
.pad{padding:0 var(--s4) var(--s5)}
.tabs{display:inline-flex;background:var(--raise);border-radius:8px;padding:3px;gap:2px;margin:var(--s1) 0 var(--s3)}
.tabs a{height:24px;padding:0 10px;display:inline-flex;align-items:center;border-radius:6px;font-size:12px;color:var(--tx2)}
.tabs a:hover{color:var(--tx)}
.tabs a.on{background:var(--raise2);color:var(--tx);box-shadow:0 0 0 1px var(--line2) inset}
.toolbar{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
.search{display:flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s3);border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--tx3);margin-bottom:var(--s3)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;color:var(--tx);font-size:12.5px}
.search input::placeholder{color:var(--tx3)}
.search:focus-within{border-color:var(--blue-line);box-shadow:0 0 0 1px var(--blue-line)}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;min-width:0}
.sec{margin-top:var(--s5);scroll-margin-top:56px}
.sec-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);min-height:28px}
.sec-h h2{font-size:13px;font-weight:500;margin:0}
.sec-h .sp{flex:1}
.count{font:500 10.5px var(--mono);color:var(--tx2);background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:16px}

/* desk strip + chart */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stat{padding:var(--s3) var(--s4);border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-size:11px;color:var(--tx3);margin-bottom:2px;white-space:nowrap}
.stat .v{font:500 20px/1.2 var(--mono);letter-spacing:-.02em}
.stat .v small{font-size:11px;color:var(--tx3);font-weight:400;margin-left:2px}
.chart{position:relative;height:150px;padding:var(--s3) var(--s4) 0 48px}
.chart .grid{position:absolute;left:48px;right:var(--s4);top:var(--s3);height:104px}
.chart .gl{position:absolute;left:0;right:0;border-top:1px solid #181818}
.chart .gl span{position:absolute;left:-40px;top:-8px;width:34px;text-align:right;font:10px var(--mono);color:var(--tx3)}
.bars{position:absolute;left:48px;right:var(--s4);top:var(--s3);height:104px;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar-b{width:44px;border-radius:3px 3px 0 0;min-height:2px}
.bx{position:absolute;top:108px;font-size:10.5px;color:var(--tx3);white-space:nowrap}
.bcol .bv{font:10px var(--mono);color:var(--tx2);margin-bottom:2px}

/* queue grid */
.qcols{display:grid;grid-template-columns:3px 24px minmax(0,1.15fr) minmax(0,1.15fr) 64px 38px minmax(0,.95fr) 134px;column-gap:var(--s2);align-items:center;padding:0 var(--s3)}
.q-head{height:36px;color:var(--tx3);font-size:11.5px;border-bottom:1px solid var(--line);background:var(--panel)}
.q-item{border-bottom:1px solid var(--line);position:relative}
.q-item:last-child{border-bottom:0}
.q-item.sel{background:var(--sel)}
.q-item:hover{background:var(--hover)} .q-item.sel:hover{background:var(--sel)}
.q-row{height:41px}
.sbar{width:3px;height:22px;border-radius:2px;background:var(--tx3)}
.t-green .sbar{background:var(--green)} .t-red .sbar{background:var(--red)} .t-blue .sbar{background:var(--blue)} .t-amber .sbar{background:var(--amber)} .t-dim .sbar{background:#3a3a3a}
.q-row .nm{line-height:1.2;min-width:0}
.q-row .nm b{font-weight:500;display:block}
.q-row .nm span{font-size:11px}
.acts{display:flex;gap:var(--s1);justify-content:flex-end}
.q-sub{display:grid;grid-template-columns:3px 1fr;column-gap:var(--s3);padding:0 var(--s3) var(--s3) var(--s3);margin-left:0}
.q-sub .rail{background:var(--red);border-radius:2px;opacity:.5}
.q-sub .fcard{margin:0}
.empty{padding:var(--s4);color:var(--tx3);font-size:12px}

/* failure card */
.fcard{border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:6px;overflow:hidden}
.fcard>header{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);font-size:12px;font-weight:500}
.fcard>header .sp{flex:1}
.fcard .fb{padding:0 var(--s3) var(--s3)}
.fl{font-size:12px;color:#6d86a8;margin:var(--s2) 0 var(--s1)}
.fcard p{margin:0;font-size:12.5px;line-height:1.45;color:#dbe4f2}
.cat{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border:1px solid #2a4469;border-radius:999px;font:11.5px var(--mono);color:#cfe0f7;background:#0b1422}
.cat .dot{color:var(--red)}
.fcard .pills{display:flex;gap:6px;flex-wrap:wrap;padding:0 var(--s3) var(--s1)}
.pillbtn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid #2a4469;border-radius:999px;font-size:12px;color:#cfe0f7;background:#0b1422}
.pillbtn:hover{background:#13233b}
.fcard .grp+.grp{border-top:1px solid #172a44;margin-top:var(--s3);padding-top:var(--s1)}
.fcard .by{font-size:11px;color:#6d86a8;margin-left:var(--s2)}
.fcard.sm{background:#0e1726}
.fcard.sm .fb{padding-top:var(--s2)}
.fcard.hs{border-color:rgba(239,68,68,.3);background:#160d0d}
.fcard.hs .cat{border-color:rgba(239,68,68,.4);background:#1c0f0f;color:#ffc2c2}
.fcard.hs .fl{color:#9b6a6a} .fcard.hs p{color:#f0d6d6}

/* credit */
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kv .c{padding:var(--s3) var(--s4);border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kv .c:nth-child(4n){border-right:0}
.kv .c.wide{grid-column:1/-1;border-right:0;border-bottom:0}
.kv .k{font-size:11px;color:var(--tx3);margin-bottom:2px}
.kv .v{font:500 18px/1.25 var(--mono);letter-spacing:-.02em}
.kv .v.sm{font-size:13px;letter-spacing:0;padding-top:3px}
.meter{height:4px;background:#1a1a1a;border-radius:2px;margin-top:var(--s2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s1)}
.tcols{display:grid;grid-template-columns:3px minmax(0,1fr) 92px 88px 96px 84px;column-gap:var(--s3);align-items:center;padding:0 var(--s3)}
.t-head{height:32px;color:var(--tx3);font-size:11.5px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.t-row{height:41px;border-bottom:1px solid var(--line)} .t-row:last-child{border-bottom:0}
.t-row:hover{background:var(--hover)}
.t-row .sbar{height:20px}
.r{text-align:right}

/* notice, audit, eval */
.notice{padding:var(--s4) var(--s5);max-width:78ch}
.notice p{margin:0 0 var(--s3);color:#d0d0d0;line-height:1.65}
.notice p:last-child{margin-bottom:0}
.notice strong{color:var(--tx);font-weight:500}
.acols{display:grid;grid-template-columns:3px 96px 128px minmax(0,1fr) 112px;column-gap:var(--s3);align-items:center;padding:0 var(--s3)}
.a-head{height:32px;color:var(--tx3);font-size:11.5px;border-bottom:1px solid var(--line)}
.a-row{min-height:46px;padding-top:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--line);align-items:start}
.a-row:last-child{border-bottom:0}
.a-row:hover{background:var(--hover)}
.a-row .sbar{height:100%;min-height:28px}
.a-row .act{font:12px var(--mono);color:var(--tx)}
.a-row .note{font-size:11.5px;color:var(--tx2);line-height:1.4;margin-top:2px}
.evgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.evgrid>div+div{border-left:1px solid var(--line)}
.ecols{display:grid;grid-template-columns:3px minmax(0,1fr) auto;column-gap:var(--s3);align-items:center;padding:0 var(--s3);height:41px;border-bottom:1px solid var(--line)}
.ecols:last-child{border-bottom:0}
.eh{padding:var(--s2) var(--s3);font-size:11.5px;color:var(--tx3);border-bottom:1px solid var(--line);height:32px;display:flex;align-items:center}
.lat{display:grid;grid-template-columns:104px minmax(0,1fr) 52px;column-gap:var(--s3);align-items:center;height:41px;padding:0 var(--s3);border-bottom:1px solid var(--line)}
.lat:last-child{border-bottom:0}
.lbar{height:4px;background:#171717;border-radius:2px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--cyan);border-radius:2px}

/* inspector */
.insp{border-left:1px solid var(--line);background:var(--bg);overflow:auto;min-width:0}
.ih{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:var(--s2);height:48px;padding:0 var(--s3)}
.ih .t{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:500;margin-left:var(--s1)}
.ih .sp{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line2);border-radius:6px;font-size:12px;background:none;color:var(--tx)}
.ibtn:hover{background:var(--raise)}
.ibtn.hot{color:var(--red);border-color:rgba(239,68,68,.5)}
.ibtn.hot:hover{background:var(--red-soft)}
.ib{padding:0 var(--s3) var(--s5)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s3)}
.crumb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;background:var(--panel);white-space:nowrap;max-width:100%}
.crumb .k{color:var(--tx3)}
.ib .fcard{margin-bottom:var(--s3)}
.gantt{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:var(--s3);padding:var(--s2) var(--s3) var(--s2)}
.gr{display:grid;grid-template-columns:106px minmax(0,1fr) 150px;column-gap:var(--s2);align-items:center;min-height:24px}
.gr .lb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx2);min-width:0}
.gr .mt{font:10px/1.25 var(--mono);color:var(--tx3);text-align:right}
.gr:hover .lb{color:var(--tx)} .gr:hover .mt{color:var(--tx2)}
.track{position:relative;height:16px}
.track .tk{position:absolute;top:0;bottom:0;width:1px;background:#1a1a1a}
.gb{position:absolute;top:6px;height:4px;border-radius:2px;min-width:3px}
.gb.run{background:repeating-linear-gradient(135deg,var(--blue) 0 4px,#1e3a6b 4px 8px)!important;animation:slide 1s linear infinite;background-size:11.3px 11.3px}
@keyframes slide{to{background-position:11.3px 0}}
.axis .track{height:16px}
.axis .tl{position:absolute;top:2px;font:10px var(--mono);color:var(--tx3);white-space:nowrap}
.tbar{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) 0;flex-wrap:wrap}
.sel{position:relative}
.selbox{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;background:var(--panel)}
.mchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border:1px solid var(--line2);border-radius:6px;font:11px var(--mono);color:var(--tx2);background:var(--panel);white-space:nowrap}
.step{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:var(--s2);overflow:hidden}
.step.best{border-color:rgba(34,197,94,.35)}
.step>summary{list-style:none;cursor:pointer;padding:var(--s3);display:block}
.step>summary::-webkit-details-marker{display:none}
.step>summary:hover{background:var(--hover)}
.sr1{display:flex;align-items:center;gap:var(--s2);min-width:0}
.sr1 .nm{font-weight:500;font-size:13px;flex:1;min-width:0}
.sr1 .chev{color:var(--tx3);transition:transform .15s}
.step[open] .chev{transform:rotate(90deg)}
.sr2{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:6px;padding-left:28px;flex-wrap:wrap}
.sr2 .meta{font-size:11px;color:var(--tx3)}
.sr2 .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.sico{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none}
.sico.blue{background:#1d3a66;color:#7fb0ff}.sico.green{background:var(--green-soft);color:var(--green)}.sico.amber{background:var(--amber-soft);color:var(--amber)}.sico.red{background:var(--red-soft);color:var(--red)}
.sbody{padding:0 var(--s3) var(--s3);display:grid;gap:var(--s3)}
.sbody .fcard{margin:0}
.terms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.terms div{padding:var(--s2) var(--s3);border-right:1px solid var(--line);min-width:0}
.terms div:last-child{border-right:0}
.terms .k{font-size:10.5px;color:var(--tx3)}
.terms .v{font:500 14px/1.3 var(--mono);letter-spacing:-.02em}
.terms s{color:var(--tx3);font-size:10.5px;font-weight:400;margin-left:4px}
.lh{display:flex;align-items:center;gap:var(--s2);font-size:11px;color:var(--tx3);margin-bottom:var(--s1)}
.lh .sp{flex:1}
.cond{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cond li{display:grid;grid-template-columns:14px 1fr;gap:var(--s2);font-size:12px;color:#cfcfcf;line-height:1.4}
.cond li svg{margin-top:2px;color:var(--tx3)}
.rs{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.rs li{display:grid;grid-template-columns:16px 1fr;gap:var(--s2);font-size:12px;line-height:1.4;color:#d4d4d4}
.mk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.mk.t{background:var(--green-soft);color:var(--green)} .mk.f{background:var(--red-soft);color:var(--red)} .mk.n{background:#1a1a1a;color:var(--tx3)}
.rs .fld{display:flex;gap:var(--s2);align-items:center;margin-top:3px;font:10.5px var(--mono);color:var(--tx3)}
.rs .fld em{font-style:normal;font-family:var(--sans)}
.rs .fld .t{color:var(--green)} .rs .fld .f{color:var(--red)}
.inbody{padding:0 var(--s3) var(--s3);font-size:12.5px;color:#cfcfcf;display:grid;gap:var(--s1)}

   +'<div class="panel"><div class="q-head qcols"><span></span><span>#</span><span>Applicant</span><span>Purpose</span><span>Amount</span><span title="approvals / lenders">Appr</span><span>Best offer</span><span></span></div><div id="qlist">'+queueRows()+'</div></div></section>'
   +'<section class="sec" id="sec-credit"><div class="sec-h"><h2>Credit snapshot</h2><span class="chip">'+esc(SEL.name)+'</span><span class="sp"></span><span class="count">'+SEL.bundle.tradelines.length+' tradelines</span></div>'+'<div id="credit">'+creditHtml()+'</div></section>'
   +'<section class="sec" id="sec-notice"><div class="sec-h"><h2>Adverse-action notice</h2><span class="sp"></span><span class="chip tone-blue pill">draft · awaiting loan officer</span></div>'+noticeHtml()+'</section>'
   +'<section class="sec" id="sec-audit"><div class="sec-h"><h2>Audit log</h2><span class="count">'+D.audit.length+'</span></div>'+auditHtml()+'</section>'
   +'<section class="sec" id="sec-eval"><div class="sec-h"><h2>Eval summary</h2><span class="sp"></span><span class="chip">'+D.eval.cases+' cases</span></div>'+evalHtml()+'</section>'
   +'</div>';
  document.getElementById('main').innerHTML=h;
}

/* ---------- inspector ---------- */
function groupedFailures(){
  var g={}, order=[];
  declines.forEach(function(o){
    var r=o.reasons[0]; if(!r) return;
    if(!g[r.field]){ g[r.field]={field:r.field,text:r.text,by:[]}; order.push(r.field); }
    g[r.field].by.push(lenderOf(o.lender).label);
  });
  return order.map(function(k){return g[k];}).sort(function(a,b){return b.by.length-a.by.length;});
}
function ganttHtml(){
  var p=SEL.pipeline;
  var t0=Math.min.apply(null,p.map(function(s){return s.startedAt;}));
  var doneEnd=Math.max.apply(null,p.map(function(s){return s.finishedAt==null?s.startedAt:s.finishedAt;}));
  var running=p.some(function(s){return s.finishedAt==null;});
  var end=doneEnd-t0+(running?1600:0), step=end>12000?4000:2000;
  var ticks='', tk='';
  for(var t=0;t<=end+1;t+=step){
    var left=t/end*100, tr=left>92?'transform:translateX(-100%)':(left<2?'':'transform:translateX(-50%)');
    ticks+='<span class="tl" style="left:'+left+'%;'+tr+'">'+(t/1000)+'s</span>';
    tk+='<span class="tk" style="left:'+left+'%"></span>';
  }
  var colors=['#3b82f6','#8b5cf6','#22b8cf','#3b82f6','#8b5cf6','#3b82f6'];
  var lanes=p.map(function(s,i){
    var l=(s.startedAt-t0)/end*100, w=((s.finishedAt==null?t0+end:s.finishedAt)-s.startedAt)/end*100;
    var run=s.state==='running';
    return '<div class="gr" title="'+esc(s.label+' · '+s.state)+'"><span class="lb">'+(run?'<span class="dot pulse blue"></span>':'<span class="dim">'+ico('check',11)+'</span>')+'<span class="trunc">'+esc(s.label)+'</span></span>'
      +'<div class="track">'+tk+'<span class="gb'+(run?' run':'')+'" style="left:'+l+'%;width:'+w+'%;background:'+colors[i%colors.length]+'"></span></div>'
      +'<span class="mt">'+esc(s.metric)+'</span></div>';
  }).join('');
  return '<div class="gantt" aria-label="Pipeline timeline"><div class="gr axis"><span></span><div class="track">'+ticks+'</div><span></span></div>'+lanes+'</div>';
}
function reasonsHtml(o){
  return '<ul class="rs">'+o.reasons.map(function(r){
    var m=r.verified===true?{c:'t',i:'check',l:'verified'}:(r.verified===false?{c:'f',i:'x',l:'unsupported, withheld from notice'}:{c:'n',i:'minus',l:'not tested'});
    return '<li><span class="mk '+m.c+'" title="'+m.l+'">'+ico(m.i,10)+'</span><div>'+esc(r.text)+'<div class="fld"><span>'+esc(r.field)+'</span><em class="'+m.c+'">'+m.l+'</em></div></div></li>';
  }).join('')+'</ul>';
}
function lenderStep(o){
  var c=classify(o), L=lenderOf(o.lender), isBest=BEST && BEST.lender===o.lender;
  var chips='<span class="mchip">'+ico('clock',11)+secs(o.latencyMs)+'</span>';
  if(o.apr!=null){
    chips+='<span class="mchip">'+usd0(o.amount)+' &rarr; '+o.termMonths+' mo</span><span class="mchip">'+o.apr.toFixed(1)+'% APR</span><span class="mchip">'+usd2(o.monthlyPayment)+'/mo</span>';
  } else chips+='<span class="mchip">no offer</span><span class="mchip">'+o.reasons.length+' reasons</span>';
  var h='<details class="step'+(isBest?' best':'')+'" open><summary><div class="sr1"><span class="sico '+c.tone+'">'+ico(c.icon,12)+'</span>'
    +'<span class="nm trunc">'+esc(o.name)+'</span>'
    +(isBest?'<span class="chip pill tone-green" style="height:20px">'+ico('star',10)+'best APR</span>':'')
    +'<span class="chip pill tone-'+c.tone+'" style="height:20px;font-weight:500">'+c.word+'</span>'
    +'<span class="chev">'+ico('right',13)+'</span></div>'
    +'<div class="sr2"><span class="meta">'+esc(o.label)+' · '+esc(o.policy)+' · '+esc(o.provider)+'</span><span class="chips">'+chips+'</span></div></summary><div class="sbody">';
  if(o.classification==='deny'){
    var r0=o.reasons[0];
    h+='<div class="fcard sm"><div class="fb"><div class="fl" style="margin-top:0">category</div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="cat"><i class="dot"></i>'+esc(r0.field)+'</span><span class="mchip">'+o.reasons.length+' reasons</span></div><div class="fl">description</div><p>'+esc(r0.text)+'</p></div></div>';
    h+='<div><div class="lh"><span>Reasons</span><span class="count">'+o.reasons.length+'</span></div>'+reasonsHtml(o)+'</div>';
  } else {
    var req = SEL.amountRequested;
    h+='<div class="terms"><div><div class="k">Amount</div><div class="v">'+usd0(o.amount)+(o.amount!==req?'<s>'+usd0(req)+' asked</s>':'')+'</div></div>'
      +'<div><div class="k">APR</div><div class="v '+c.tone+'">'+o.apr.toFixed(1)+'%</div></div>'
      +'<div><div class="k">Term</div><div class="v">'+o.termMonths+' mo</div></div>'
      +'<div><div class="k">Monthly</div><div class="v">'+usd2(o.monthlyPayment)+'</div></div></div>';
    if(o.conditions.length) h+='<div><div class="lh"><span>Conditions</span><span class="count">'+o.conditions.length+'</span></div><ul class="cond">'+o.conditions.map(function(x){return '<li>'+ico('check',12)+'<span>'+esc(x)+'</span></li>';}).join('')+'</ul></div>';
    h+='<div><div class="lh"><span>Reasons</span><span class="count">'+o.reasons.length+'</span></div>'+reasonsHtml(o)+'</div>';
  }
  return h+'</div></details>';
}
function renderInspector(){
  var st=STAT[statusOf(SEL)]||{label:words(SEL.status),tone:'blue'};
  var unsupported=0; SEL.offers.forEach(function(o){ o.reasons.forEach(function(r){ if(r.verified===false) unsupported++; }); });
  var groups=groupedFailures();
  var intake=D.audit.filter(function(a){return a.actor==='intake';})[0];
  var elapsed=SEL.pipeline.reduce(function(a,s){return a+(s.finishedAt!=null?s.finishedAt-s.startedAt:0);},0);
  var doneN=SEL.pipeline.filter(function(s){return s.state==='done';}).length;
  var h='<div class="ih"><button class="btn icon" aria-label="Collapse">'+ico('dright',16)+'</button><button class="btn icon" aria-label="Expand">'+ico('max',15)+'</button>'
   +'<span class="t">Applicant '+ico('down',14)+'</span><span class="sp"></span>'
   +'<a class="ibtn" href="#sec-notice">'+ico('file',13)+'Notice</a>'
   +'<a class="ibtn hot" href="#sec-lenders" title="Declined lenders">'+ico('shield',13)+'Declines ('+declines.length+')</a>'
   +'<a class="ibtn" href="#sec-audit">'+ico('clock',13)+'Audit</a>'
   +'<button class="btn icon" aria-label="Share">'+ico('share',15)+'</button></div>'
   +'<div class="ib">'
   +'<div class="crumbs"><span class="crumb">'+ico('layers',13)+'<b style="font-weight:500">'+esc(SEL.name)+'</b>'+ico('ext',11)+'</span>'
   +'<span class="crumb tone-'+st.tone+'"><i class="dot pulse"></i>'+esc(st.label)+'</span>'
   +'<span class="crumb"><span class="k">purpose</span>'+esc(SEL.purpose)+'</span>'
   +'<span class="crumb"><span class="k">asked</span><span class="num">'+usd0(SEL.amountRequested)+'</span></span>'
   +'<span class="crumb"><span class="k">income</span><span class="num">'+usd0(SEL.statedIncome)+'</span></span>'
   +'<span class="crumb"><span class="k">card code</span><span class="num">'+(SEL.cardCode==null?'–':esc(SEL.cardCode))+'</span></span>'
   +'<span class="crumb"><span class="k">persona</span><span class="num">'+esc(SEL.personaId)+'</span></span>'
   +'<span class="crumb"><span class="k">created</span><span class="num">'+esc(fmtDT(SEL.createdAt))+'</span></span></div>'
   +'<section class="fcard" id="fdetect"><header>Decline Detector<span class="sp"></span><span class="mchip" style="height:20px">'+declines.length+' of '+SEL.offers.length+' lenders</span><button class="btn icon" style="width:22px;height:22px;border:0;background:none;color:#8aa3c6" data-act="close-fd" aria-label="Dismiss detector">'+ico('x',14)+'</button></header>'
   +'<div class="pills"><a class="pillbtn" href="#sec-notice">Open notice '+ico('ext',11)+'</a><a class="pillbtn" href="#sec-audit">Open audit log '+ico('ext',11)+'</a></div><div class="fb">'
   +groups.map(function(g){
      return '<div class="grp"><div class="fl">category</div><div><span class="cat"><i class="dot"></i>'+esc(g.field)+'</span><span class="by">'+esc(g.by.join(' · '))+'</span></div><div class="fl">description</div><p>'+esc(g.text)+'</p></div>';
   }).join('')
   +(unsupported?'<div class="grp"><div class="fl">note</div><p>'+unsupported+' unsupported reason'+(unsupported>1?'s':'')+' withheld from the notice. Every denial still carries at least two reasons.</p></div>':'')
   +'</div></section>'
   +ganttHtml()
   +'<div class="tbar"><span class="selbox">Transcript '+ico('down',12)+'</span>'
   +'<span class="mchip">'+ico('clock',11)+secs(elapsed)+'</span><span class="mchip">'+doneN+'/'+SEL.pipeline.length+' steps</span><span class="mchip">'+offersN+' offers</span><span class="mchip">'+declines.length+' declines</span></div>'
   +'<div class="step" style="padding:var(--s3) var(--s3) var(--s1)"><div class="sr1"><span class="sico blue">'+ico('arrowin',12)+'</span><span class="nm">Input</span><span class="mchip">'+esc(SEL.personaId)+'</span></div>'
   +'<div class="inbody" style="padding:var(--s2) 0 var(--s2) 28px"><span>'+esc(SEL.name)+' asks for <b class="num" style="font-weight:500">'+usd0(SEL.amountRequested)+'</b> for '+esc(SEL.purpose)+'. Stated income <span class="num">'+usd0(SEL.statedIncome)+'</span>.</span>'
   +(intake?'<span class="dim" style="font-size:12px">'+esc(intake.note)+'</span>':'')+'</div></div>'
   +'<div id="sec-lenders" style="scroll-margin-top:56px">'+SEL.offers.map(lenderStep).join('')+'</div>'
   +'<div class="step" style="padding:var(--s3)"><div class="sr1"><span class="sico blue">'+ico('hand',12)+'</span><span class="nm">Output · Human</span><span class="chip pill tone-blue" style="height:20px"><i class="dot pulse"></i>waiting</span></div>'
   +'<div class="inbody" style="padding:var(--s2) 0 0 28px"><span>Waiting on a loan officer. A human approves every offer.'+(BEST?' Best APR: <b style="font-weight:500">'+esc(BEST.name)+'</b> at <span class="num green">'+BEST.apr.toFixed(1)+'%</span>, '+usd2(BEST.monthlyPayment)+'/mo.':'')+'</span></div></div>'
   +'</div>';
  document.getElementById('insp').innerHTML=h;
}

/* ---------- events ---------- */
var toastT;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},3200); }
function refreshDesk(){
  document.getElementById('stats').innerHTML=statsHtml();
  document.getElementById('chart').innerHTML=chartHtml();
  document.getElementById('qlist').innerHTML=queueRows();
  renderNav();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-tab],a[href^="#"]'); if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='approve'||act==='decline'){
    var id=el.getAttribute('data-id'), row=D.queue.filter(function(r){return r.applicantId===id;})[0]; if(!row) return;
    S.decided[id]=act==='approve'?'approved':'declined'; refreshDesk();
    toast(act==='approve' ? 'Sandbox: approved '+row.name+' at '+(row.best?row.best.apr.toFixed(1)+'% APR':'best offer')+'. No funds move.' : 'Sandbox: declined '+row.name+'. Notice stays with the reasons above.');
    return;
  }
  if(act==='dispute'){ var i=el.getAttribute('data-i'); S.disputed[i]=!S.disputed[i]; document.getElementById('credit').innerHTML=creditHtml(); return; }
  if(act==='close-fd'){ var f=document.getElementById('fdetect'); if(f) f.style.display='none'; return; }
  var href=el.getAttribute('href');
  if(href && href.charAt(0)==='#'){
    e.preventDefault();
    if(href.length<2) return;
    var tgt=document.querySelector(href); if(!tgt) return;
    var wrap=tgt.closest('.insp')?document.getElementById('insp'):document.getElementById('main');
    if(href==='#sec-notice'||href==='#sec-audit'){ wrap=document.getElementById('main'); tgt=document.querySelector(href); }
    tgt.scrollIntoView({behavior:'smooth',block:'start'});
    var tab=el.getAttribute('data-tab');
    if(tab){ [].forEach.call(document.querySelectorAll('.tabs a'),function(a){a.classList.toggle('on',a===el);}); }
  }
});
function init(){
  renderNav(); renderMain(); renderInspector();
  var q=document.getElementById('q');
  q.addEventListener('input',function(){ S.q=q.value; document.getElementById('qlist').innerHTML=queueRows(); });
}
init();
})();
</script>
