<!-- Reference: Fey (https://www.fey.com), a markets app. Docket desk restyled after its dark holdings table, hero value and group subtotal rows. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Fey study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f12; --panel:#131318; --panel-2:#111115; --line:#1c1c22; --line-2:#26262e;
  --text:#f3f3f6; --grey:#8b8b95; --dim:#5d5d68; --chip:#1a1a20; --chip-2:#202028;
  --green:#4fd69c; --green-bg:#133528; --green-line:#1d5a42;
  --red:#ff6b78; --red-bg:#3a1a21; --red-line:#5c2630;
  --amber:#f3b547; --amber-bg:#382b12; --amber-line:#5a4519;
  --focus:#7fb0ff;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px;
  --r:12px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 Inter,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.num,.tab{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--s6)}
/* top bar */
.top{display:flex;align-items:center;gap:var(--s3);height:60px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:16px;letter-spacing:-.01em}
.tag{color:var(--grey);font-size:12px;margin-left:var(--s2)}
.top .sp{flex:1}
/* pills (15px tall, 4px radius, as in Fey's change pill) */
.pill{display:inline-block;height:15px;line-height:15px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums;background:var(--chip);color:var(--grey)}
.pill.pos{background:var(--green-bg);color:var(--green)}
.pill.neg{background:var(--red-bg);color:var(--red)}
.pill.amb{background:var(--amber-bg);color:var(--amber)}
.pill.neu{background:var(--chip-2);color:var(--grey)}
.pill.up{text-transform:uppercase;letter-spacing:.04em;font-size:10px}
/* layout */
.cols{display:grid;grid-template-columns:420px minmax(0,1fr);gap:var(--s7);padding-top:var(--s6);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.ph{display:flex;align-items:center;gap:var(--s3);min-height:40px}
.ph .sp{flex:1}
.lab{color:var(--grey);font-size:12px;line-height:16px}
.val{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.val .c{opacity:.6}
.grey{color:var(--grey)} .dimc{color:var(--dim)} .gr{color:var(--green)} .rd{color:var(--red)} .am{color:var(--amber)}
/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s5)}
.hv .row{display:flex;align-items:center;gap:var(--s2)}
/* cards */
.card{background:linear-gradient(180deg,#141418 0%,#111115 100%);border:1px solid #1a1a20;border-radius:var(--r);padding:var(--s4) var(--s5)}
.card .ct{display:flex;align-items:center;gap:var(--s2);color:var(--grey);font-size:12px;min-height:24px;margin-bottom:var(--s2)}
.card .ct .sp{flex:1}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#131318;color:var(--grey)}
.ibtn:hover{color:var(--text);background:var(--chip)}
/* segmented */
.seg{display:inline-flex;gap:2px}
.seg button{border:0;background:transparent;color:var(--grey);font-weight:600;font-size:14px;height:32px;padding:0 var(--s3);border-radius:8px}
.seg button[aria-selected="true"]{background:#17171d;color:var(--text)}
.seg button:hover{color:var(--text)}
/* tables */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-weight:400;color:var(--grey);font-size:12px;text-align:right;height:32px;padding:0 var(--s2);white-space:nowrap}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
th.l,td.l{text-align:left}
td{height:38px;padding:0 var(--s2);text-align:right;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.l{text-align:left;overflow:hidden;text-overflow:ellipsis}
tr.grp td{border:0;height:44px;padding-top:var(--s3);color:#a4a4ae;font-weight:600;font-size:14px;text-align:left;vertical-align:bottom}
tr.sub td{border-bottom:0;border-top:1px dashed var(--line-2);height:38px;font-size:12px;color:var(--grey);text-align:right}
tr.sub td b{color:#d9d9df;font-weight:600;margin-right:var(--s2)}
tr.row:last-child td{border-bottom:1px solid var(--line)}
.tk{font-weight:700;font-size:15px;color:#fff;margin-right:var(--s2)}
.nm{font-size:15px;color:var(--grey);font-weight:400}
.px{font-weight:700;color:#fff}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:14px;background:#1b1b22;border:1px solid var(--line-2);font-size:11px;font-weight:700;color:#cfcfd6;margin-right:var(--s3);vertical-align:middle;flex:none}
.nmcell{display:flex;align-items:center;min-width:0}
.nmcell .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.sel td{background:#131318}
tr.sel td:first-child{box-shadow:inset 2px 0 0 #fff}
tr.hs td{background:rgba(255,107,120,.05)}
tr.hs td:first-child{box-shadow:inset 2px 0 0 var(--red)}
tr.hsn td{background:rgba(255,107,120,.05);height:auto;padding:0 0 var(--s3) 40px;white-space:normal;text-align:left;font-size:12px;color:#d98d95;border-bottom:1px solid var(--line)}
tr.hsn td code{color:var(--red);font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace}
.btn{height:26px;padding:0 var(--s3);border-radius:8px;border:1px solid transparent;font-size:12px;font-weight:600;white-space:nowrap}
.btn.approve{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.btn.approve:hover{background:#184530}
.btn.decline{background:transparent;color:var(--red);border-color:var(--line-2)}
.btn.decline:hover{background:var(--red-bg)}
.btn.ghost{background:transparent;color:var(--grey);border-color:var(--line-2)}
.btn.ghost:hover{color:var(--text);background:var(--chip)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.acts{display:flex;gap:var(--s2);justify-content:flex-end}
.rk{color:var(--dim);font-size:12px;margin-right:var(--s2);display:inline-block;width:12px}
/* pipeline */
.legend{display:flex;align-items:center;gap:var(--s4);font-size:14px;color:var(--grey)}
.legend span{display:inline-flex;align-items:center;gap:var(--s2)}
.legend i{display:inline-block;width:2px;height:14px;border-radius:1px}
.steps{display:flex;flex-direction:column}
.step{padding:var(--s2) 0;border-bottom:1px solid var(--line);min-height:38px}
.step:last-child{border-bottom:0}
.step .l1{display:flex;align-items:center;gap:var(--s2);font-size:13px}
.step .l1 .sp{flex:1}
.step .l1 .m{color:var(--grey);font-size:12px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:4px;background:var(--green);flex:none}
.dot.run{background:var(--amber);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
.trk{position:relative;height:4px;border-radius:2px;background:#1a1a20;margin-top:6px;margin-left:16px}
.trk b{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--green);opacity:.85}
.trk b.run{background:repeating-linear-gradient(135deg,var(--amber) 0 4px,#8a6a25 4px 8px)}
/* snapshot */
.score{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s1) 0 var(--s2)}
.kv{display:flex;align-items:center;min-height:38px;border-top:1px solid var(--line);font-size:14px;gap:var(--s2)}
.kv .k{color:var(--grey);flex:1}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.flags{display:flex;flex-wrap:wrap;gap:6px;padding:var(--s3) 0 var(--s1);border-top:1px solid var(--line)}
.flag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 var(--s2);border-radius:6px;background:var(--chip);font-size:12px;color:var(--grey)}
.flag.on{background:var(--red-bg);color:var(--red)}
.ubar{width:64px;height:4px;border-radius:2px;background:#1a1a20;position:relative}
.ubar b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--amber)}
/* applicant header */
.ap{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s4);align-items:center}
.apav{width:44px;height:44px;border-radius:22px;font-size:15px;margin:0}
.ap h2{display:flex;align-items:center;gap:var(--s3)}
.apkv{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)}
.apkv .v{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
/* lender cards */
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.lc{padding:var(--s4)}
.lc.best{border-color:var(--green-line);box-shadow:0 0 0 1px rgba(79,214,156,.12) inset}
.lc .hd{display:flex;align-items:flex-start;gap:var(--s2)}
.lc .hd .sp{flex:1}
.lc .nm1{font-weight:700;font-size:15px}
.lc .meta{color:var(--grey);font-size:12px;margin-top:2px}
.lstats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin:var(--s3) 0;padding:var(--s3) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lstats .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.sec{font-size:12px;color:var(--grey);margin:var(--s3) 0 var(--s1)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{display:flex;gap:var(--s2);font-size:13px;line-height:18px;padding:5px 0;border-bottom:1px solid var(--line);color:#d4d4da}
ul.plain li:last-child{border-bottom:0}
ul.plain li .t{flex:1;min-width:0}
ul.plain li code{display:block;color:var(--dim);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:1px}
.mk{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:8px;margin-top:1px}
.mk.t{background:var(--green-bg);color:var(--green)}
.mk.f{background:var(--red-bg);color:var(--red)}
.mk.n{background:var(--chip-2);color:var(--dim)}
.cnd li:before{content:"";flex:none;width:4px;height:4px;border-radius:2px;background:var(--amber);margin-top:8px}
/* notice */
.notice p{margin:0 0 var(--s3);font-size:14px;line-height:21px;color:#c9c9d0;max-width:78ch}
.notice p b{color:#fff;font-weight:600}
.notice p:last-child{margin-bottom:0}
/* eval */
.eg{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s4)}
.lat{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s5);margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)}
.lat .bar{height:4px;border-radius:2px;background:#1a1a20;margin-top:6px;position:relative}
.lat .bar b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#5b5b68}
/* audit */
.audit td{font-size:13px}
.audit td.ref{color:var(--dim);font-size:12px}
.audit td.note{color:#b4b4bd;white-space:normal;padding:var(--s2) 0 var(--s2) var(--s2);text-align:left}
.audit td.l{text-align:left}
.tick{font-weight:700;color:#fff}
.sc{display:flex;flex-direction:column;gap:var(--s5);margin-top:var(--s5);padding-bottom:var(--s7)}
#toast{position:fixed;right:var(--s5);bottom:var(--s5);max-width:380px;background:#1b1b22;border:1px solid var(--line-2);border-radius:10px;padding:var(--s3) var(--s4);font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .15s,transform .15s}
#toast.on{opacity:1;transform:none}
@media (max-width:1360px){
  .cols{grid-template-columns:380px minmax(0,1fr);gap:var(--s6)}
  .hero{grid-template-columns:1fr 1fr}
  .nm{font-size:14px}
}
@media (max-width:1100px){
  .cols{grid-template-columns:1fr}
  .eg{grid-template-columns:repeat(4,1fr)}
  .lgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main>
    <div class="cols">
      <div class="stack" id="left"></div>
      <div class="stack" id="right"></div>
    </div>
    <div class="sc" id="bottom"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

/* ---------- pipeline ---------- */
function renderPipeline(){
  var P = S.pipeline;

  var tDone = Math.max.apply(null, fin);
  var tEnd = tDone + 1500;
  var total = tEnd - t0;
  var rows = P.map(function(p){
    var end = p.finishedAt != null ? p.finishedAt : tEnd;
    var left = (p.startedAt - t0) / total * 100;
    var w = Math.max(2, (end - p.startedAt) / total * 100);
    var run = p.state === 'running';
    return '<div class="step"><div class="l1"><span class="dot' + (run ? ' run' : '') + '"></span><span>' + esc(p.label) + '</span><span class="sp"></span><span class="m">' + esc(p.metric) + '</span></div>' +

  }).join('');
  return '<section class="card" aria-label="Pipeline">' +
    '<div class="ct"><span>Pipeline</span><span class="sp"></span><span class="num">' + ((tDone - t0)/1000).toFixed(2) + 's elapsed &middot; ' + esc(S.name) + '</span></div>' +

}

    '<div class="ct"><span>Credit snapshot</span><span class="sp"></span><span class="num">' + esc(b.source.toUpperCase()) + ' &middot; pulled ' + tm(b.pulledAt) + '</span></div>' +
    '<div class="score"><div class="val">' + b.score + '</div><span class="lab">Score &middot; Vantage 4 <b class="num" style="color:var(--text)">' + b.vantage4 + '</b></span></div>' +
    '<div class="kv"><span class="k">Utilization</span><span class="ubar"><b style="width:' + (b.utilization*100) + '%"></b></span><span class="v">' + pct(b.utilization) + '</span></div>' +
    '<div class="kv"><span class="k">Inquiries (6 mo)</span><span class="v">' + b.inquiries6mo + '</span></div>' +
    '<div class="kv"><span class="k">Identity</span>' + (b.identityVerified ? pill('pos', 'Verified') : pill('neg', 'Not verified')) + '</div>' +
    '<div class="kv"><span class="k">Fraud score</span><span class="v">' + b.fraudScore + '</span></div>' +
    '<div class="flags" aria-label="Flags">' + flags + '</div></section>';
}

/* ---------- tradelines ---------- */
function renderTradelines(){
  var T = S.bundle.tradelines;
  function typeName(t){ var s = t.replace(/_/g,' '); return s.charAt(0).toUpperCase() + s.slice(1); }
  var rows = T.map(function(t, i){
    var sp = t.status === 'open' ? pill('pos', 'open') : t.status === 'closed' ? pill('neu', 'closed') : pill('neg', esc(t.status.replace(/_/g,' ')));
    return '<tr class="row"><td class="l"><span class="tk" style="font-size:14px">' + typeName(t.type) + '</span></td>' +
      '<td class="grey">' + esc(t.openedAt) + '</td><td class="px">' + money(t.balance) + '</td><td>' + sp + '</td>' +
      '<td><button class="btn ghost" type="button" data-toast="Dispute drafted for ' + esc(typeName(t.type)) + ' opened ' + esc(t.openedAt) + ' (demo, nothing sent)" aria-label="Dispute ' + esc(typeName(t.type)) + ' opened ' + esc(t.openedAt) + '">Dispute</button></td></tr>';
  }).join('');
  return '<section class="card" aria-label="Tradelines">' +
    '<div class="ct"><span>Tradelines</span><span class="sp"></span><span class="num">' + T.length + ' accounts</span></div>' +
    '<table><colgroup><col><col style="width:82px"><col style="width:68px"><col style="width:62px"><col style="width:70px"></colgroup>' +
    '<thead><tr><th class="l">Type</th><th>Opened</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></section>';
}

/* ---------- queue ---------- */
function statusPill(s){
  if (s === 'awaiting_human') return pill('amb', 'Awaiting you');
  if (s === 'approved') return pill('pos', 'Approved');
  if (s === 'hard_stop') return pill('neg', 'Hard stop');
  return pill('neu', esc(s));
}
function queueRow(q){
  var hs = q.status === 'hard_stop';
  var sel = q.applicantId === S.applicantId;
  var best = q.best ? '<span class="grey" style="margin-right:6px;font-size:12px">' + esc(LEND[q.best.lender].label) + '</span><span class="px">' + q.best.apr.toFixed(1) + '%</span>' : '<span class="dimc">&mdash;</span>';
  var acts = hs
    ? '<div class="acts"><button class="btn approve" type="button" disabled title="Blocked by hard stop">Approve best</button><button class="btn decline" type="button" data-toast="Decline queued for ' + esc(q.name) + ' (demo)">Decline</button></div>'
    : '<div class="acts"><button class="btn approve" type="button" data-toast="Approve best queued for ' + esc(q.name) + (q.best ? ' with ' + esc(LEND[q.best.lender].name) + ' at ' + q.best.apr.toFixed(1) + '% APR' : '') + ' (demo; a human approves every offer)">Approve best</button><button class="btn decline" type="button" data-toast="Decline queued for ' + esc(q.name) + ' (demo)">Decline</button></div>';
  var h = '<tr class="row' + (hs ? ' hs' : '') + (sel ? ' sel' : '') + '">' +
    '<td class="l"><div class="nmcell"><span class="rk">' + (q.rank != null ? q.rank : '') + '</span><span class="av">' + esc(initials(q.name)) + '</span><span class="t"><span class="tk">' + esc(q.name) + '</span><span class="nm">' + esc(q.purpose) + '</span></span></div></td>' +
    '<td class="px">' + money(q.amountRequested) + '</td>' +
    '<td class="' + (hs ? 'dimc' : '') + '">' + q.approvals + '/' + q.lenders + '</td>' +
    '<td>' + best + '</td><td>' + statusPill(q.status) + '</td><td>' + acts + '</td></tr>';
  if (hs && q.hardStop) {
    h += '<tr class="hsn"><td colspan="6"><code>' + esc(q.hardStop.field) + '</code> &nbsp;' + esc(q.hardStop.note) + '</td></tr>';
  }
  return h;
}
function renderQueue(){
  var Q = D.queue;
  var groups = [
    {key:'awaiting_human', title:'Waiting on you', sub:function(r){
      var amt = r.reduce(function(a,q){return a+q.amountRequested;},0);
      var ap = r.reduce(function(a,q){return a+q.approvals;},0), ln = r.reduce(function(a,q){return a+q.lenders;},0);
      return '<b>' + money(amt) + '</b>requested &middot; ' + ap + '/' + ln + ' lenders approving'; }},
    {key:'approved', title:'Approved today', sub:function(r){
      var amt = r.reduce(function(a,q){return a+q.amountRequested;},0);
      var lo = Math.min.apply(null, r.map(function(q){return q.best.apr;}));
      return '<b>' + money(amt) + '</b>approved &middot; best ' + lo.toFixed(1) + '% APR'; }},
    {key:'hard_stop', title:'Declined today &middot; hard stop', sub:function(r){
      var amt = r.reduce(function(a,q){return a+q.amountRequested;},0);
      return '<b>' + money(amt) + '</b>held &middot; no lender consulted'; }}
  ];
  var body = groups.map(function(g){
    var r = Q.filter(function(q){ return q.status === g.key; });
    if (!r.length) return '';
    return '<tr class="grp"><td colspan="6">' + g.title + '</td></tr>' + r.map(queueRow).join('') +
      '<tr class="sub"><td colspan="6">' + g.sub(r) + '</td></tr>';
  }).join('');
  return '<section aria-label="Queue"><div class="ph"><h2>Your queue</h2><span class="sp"></span>' +
    pill('amb', D.desk.waitingOnYou + ' waiting on you') +
    '<button class="ibtn" type="button" aria-label="Sort queue" data-toast="Queue is ranked by expected offer value (demo)">' + ICON.sort + '</button></div>' +
    '<table><colgroup><col><col style="width:80px"><col style="width:68px"><col style="width:104px"><col style="width:96px"><col style="width:176px"></colgroup>' +
    '<thead><tr><th class="l">Applicant</th><th>Amount</th><th>Approvals</th><th>Best offer</th><th>Status</th><th></th></tr></thead><tbody>' + body + '</tbody></table></section>';
}

/* ---------- applicant ---------- */
function renderApplicant(){
  var card = S.cardCode == null ? '<span class="grey">Not entered</span>' : esc(S.cardCode);
  return '<section class="card" aria-label="Selected applicant"><div class="ap">' +
    '<span class="av apav">' + esc(initials(S.name)) + '</span>' +
    '<div><h2>' + esc(S.name) + ' ' + statusPill(S.status) + '</h2><div class="lab" style="font-size:13px;margin-top:2px">' + esc(S.purpose) + ' &middot; ' + esc(S.applicantId) + '</div></div>' +
    '<div style="text-align:right"><div class="val">' + money(S.amountRequested) + '<span class="c">.00</span></div><div class="lab">Amount requested</div></div></div>' +
    '<div class="apkv">' +
      '<div><div class="lab">Purpose</div><div class="v">' + esc(S.purpose) + '</div></div>' +
      '<div><div class="lab">Stated income</div><div class="v">' + money(S.statedIncome) + '</div></div>' +
      '<div><div class="lab">Card code</div><div class="v">' + card + '</div></div>' +
      '<div><div class="lab">Persona &middot; applied</div><div class="v">' + esc(S.personaId) + ' &middot; ' + esc(fDay.format(new Date(S.createdAt))) + '</div></div>' +
    '</div></section>';
}

/* ---------- offers ---------- */
function offerRow(o){
  var isBest = o.apr != null && Math.abs(o.apr - bestApr) < 0.0001;
  var L = LEND[o.lender];
  var dash = '<span class="dimc">&mdash;</span>';
  var amtCls = o.amount != null && o.amount < S.amountRequested ? 'am' : '';
  return '<tr class="row"><td class="l"><span class="tk">' + esc(o.label) + '</span><span class="nm" title="' + esc(o.name) + '">' + esc(o.policy) + '</span></td>' +
    '<td>' + clsPill(o) + '</td>' +
    '<td class="px">' + (o.apr != null ? (isBest ? '<span class="gr" style="margin-right:4px;vertical-align:-1px" title="Best APR">' + ICON.star + '</span>' : '') + o.apr.toFixed(1) + '%' : dash) + '</td>' +
    '<td>' + (o.monthlyPayment != null ? money(o.monthlyPayment, 2) : dash) + '</td>' +
    '<td class="grey">' + (o.termMonths != null ? o.termMonths + ' mo' : '&mdash;') + '</td>' +
    '<td class="' + amtCls + '">' + (o.amount != null ? money(o.amount) : dash) + '</td>' +
    '<td class="grey">' + (o.latencyMs/1000).toFixed(1) + 's</td>' +
    '<td>' + deltaPill(o) + '</td></tr>';
}
function offersBody(filter){
  var offered = S.offers.filter(function(o){ return o.apr != null; });
  var declined = S.offers.filter(function(o){ return o.apr == null; });
  var out = '';
  if (filter !== 'declined' && offered.length) {
    var dollars = offered.reduce(function(a,o){ return a + o.amount; }, 0);
    out += '<tr class="grp"><td colspan="8">Offered</td></tr>' + offered.map(offerRow).join('') +
      '<tr class="sub"><td colspan="8"><b>' + money(dollars) + '</b>offered &middot; ' + offered.length + ' of ' + S.offers.length + ' lenders &middot; best ' + bestApr.toFixed(1) + '% APR</td></tr>';
  }
  if (filter !== 'offers' && declined.length) {
    var nr = declined.reduce(function(a,o){ return a + o.reasons.length; }, 0);
    out += '<tr class="grp"><td colspan="8">Declined today</td></tr>' + declined.map(offerRow).join('') +
      '<tr class="sub"><td colspan="8"><b>' + declined.length + ' declined</b>' + nr + ' reasons given &middot; $0 offered</td></tr>';
  }
  return out;
}
function renderOffers(){
  return '<section aria-label="Offers"><div class="ph"><h2>Offers</h2><span class="sp"></span>' +
    '<div class="seg" role="tablist" aria-label="Filter offers"><button type="button" role="tab" aria-selected="true" data-f="all">All</button><button type="button" role="tab" aria-selected="false" data-f="offers">Offers</button><button type="button" role="tab" aria-selected="false" data-f="declined">Declined</button></div></div>' +
    '<table><colgroup><col><col style="width:108px"><col style="width:62px"><col style="width:78px"><col style="width:54px"><col style="width:74px"><col style="width:52px"><col style="width:76px"></colgroup>' +
    '<thead><tr><th class="l">Lender</th><th>Status</th><th>APR</th><th>Per month</th><th>Term</th><th>Amount</th><th>Time</th><th>vs best</th></tr></thead>' +
    '<tbody id="offersBody">' + offersBody('all') + '</tbody></table></section>';
}

/* ---------- lender cards ---------- */
function mark(v){
  if (v === true) return '<span class="mk t" title="Verified">' + ICON.yes + '</span>';
  if (v === false) return '<span class="mk f" title="Unsupported">' + ICON.no + '</span>';
  return '<span class="mk n" title="Not tested">' + ICON.nul + '</span>';
}
function lenderCard(o){
  var isBest = o.apr != null && Math.abs(o.apr - bestApr) < 0.0001;
  var dash = '<span class="dimc">&mdash;</span>';
  var stats = '<div class="lstats">' +
    '<div><div class="lab">APR</div><div class="v ' + (isBest ? 'gr' : '') + '">' + (o.apr != null ? o.apr.toFixed(1) + '%' : dash) + '</div></div>' +
    '<div><div class="lab">Per month</div><div class="v">' + (o.monthlyPayment != null ? money(o.monthlyPayment, 2) : dash) + '</div></div>' +
    '<div><div class="lab">Term</div><div class="v">' + (o.termMonths != null ? o.termMonths + ' mo' : dash) + '</div></div>' +
    '<div><div class="lab">Amount</div><div class="v ' + (o.amount != null && o.amount < S.amountRequested ? 'am' : '') + '">' + (o.amount != null ? money(o.amount) : dash) + '</div></div></div>';
  var conds = o.conditions.length
    ? '<div class="sec">Conditions</div><ul class="plain cnd">' + o.conditions.map(function(c){ return '<li><span class="t">' + esc(c) + '</span></li>'; }).join('') + '</ul>'
    : '';
  var reasons = '<div class="sec">Reasons (' + o.reasons.length + ')</div><ul class="plain">' + o.reasons.map(function(r){
    return '<li>' + mark(r.verified) + '<span class="t">' + esc(r.text) + '<code>' + esc(r.field) + '</code></span></li>';
  }).join('') + '</ul>';
  return '<article class="card lc' + (isBest ? ' best' : '') + '">' +
    '<div class="hd"><div><div class="nm1">' + esc(o.name) + '</div><div class="meta">' + esc(o.label) + ' &middot; ' + esc(o.policy) + ' policy &middot; ' + esc(o.provider) + ' &middot; <span class="num">' + (o.latencyMs/1000).toFixed(1) + 's</span></div></div><span class="sp"></span>' +
    (isBest ? pill('pos', 'Best APR') + ' ' : '') + clsPill(o) + '</div>' + stats + conds + reasons + '</article>';
}
function renderLenders(){
  return '<section aria-label="Lender detail"><div class="ph"><h2>Lender detail</h2><span class="sp"></span>' +
    '<span class="legend" style="font-size:12px"><span><span class="mk t">' + ICON.yes + '</span>verified</span><span><span class="mk f">' + ICON.no + '</span>unsupported</span><span><span class="mk n">' + ICON.nul + '</span>not tested</span></span></div>' +
    '<div class="lgrid">' + S.offers.map(lenderCard).join('') + '</div></section>';
}

/* ---------- notice ---------- */
function renderNotice(){
  var names = S.offers.map(function(o){ return o.name; });
  var paras = S.notice.split(/\n\s*\n/).map(function(p){
    var e = esc(p);
    names.forEach(function(n){
      var en = esc(n);
      if (e.indexOf(en) === 0) e = '<b>' + en + '</b>' + e.slice(en.length);
    });
    return '<p>' + e + '</p>';
  }).join('');
  return '<section class="card notice" aria-label="Adverse-action notice"><div class="ct"><span>Adverse-action notice</span><span class="sp"></span>' + pill('neu', 'Drafted by compliance') + '</div>' + paras + '</section>';
}

/* ---------- eval ---------- */
function renderEval(){
  var E = D.eval;
  function c(label, val){ return '<div><div class="val" style="font-size:20px">' + val + '</div><div class="lab">' + label + '</div></div>'; }
  var maxL = Math.max.apply(null, Object.keys(E.latencyP50Ms).map(function(k){ return E.latencyP50Ms[k]; }));
  var lat = D.product.lenders.map(function(l){
    var v = E.latencyP50Ms[l.id];
    return '<div><div style="display:flex;justify-content:space-between;font-size:12px"><span class="grey">' + esc(l.label) + '</span><b class="num">' + (v/1000).toFixed(1) + 's</b></div><div class="bar"><b style="width:' + (v/maxL*100) + '%"></b></div></div>';
  }).join('');
  return '<section class="card" aria-label="Eval summary"><div class="ct"><span>Eval summary</span><span class="sp"></span><span class="num">Last run ' + esc(fDay.format(new Date(E.lastRun))) + '</span></div>' +
    '<div class="eg">' +
      c('Cases', E.cases) + c('Agreement', pct(E.agreement)) + c('Per-lender agreement', pct(E.perLenderAgreement)) +
      c('Reasons verified', pct(E.reasonsVerified)) + c('Avg reasons / denial', E.avgReasonsPerDenial.toFixed(2)) +
      c('Fraud cases with zero offers', E.fraudZeroOffers ? pill('pos', 'Yes') : pill('neg', 'No')) +
      c('Eval cases run', E.cases + ' / ' + E.cases) +
    '</div><div class="lat" aria-label="Median latency by lender">' + lat + '</div></section>';
}

/* ---------- audit ---------- */
function renderAudit(){
  var rows = D.audit.map(function(a){
    var parts = String(a.actor).split(':');
    var actor = '<span class="tick">' + esc(parts[0]) + '</span>' + (parts[1] ? '<span class="nm" style="font-size:13px">:' + esc(parts[1]) + '</span>' : '');
    return '<tr class="row"><td class="l num grey">' + tm(a.at) + '</td><td class="l">' + actor + '</td><td class="l grey">' + esc(a.action) + '</td>' +
      '<td class="l ref" title="' + esc(a.ref || '') + '">' + (a.ref ? esc(a.ref) : '&mdash;') + '</td><td class="note">' + esc(a.note) + '</td></tr>';
  }).join('');
  return '<section class="card" aria-label="Audit log"><div class="ct"><span>Audit log</span><span class="sp"></span><span class="num">' + D.audit.length + ' events &middot; newest first</span><span style="margin-left:8px" class="grey">' + ICON.clock + '</span></div>' +
    '<table class="audit"><colgroup><col style="width:84px"><col style="width:190px"><col style="width:170px"><col style="width:220px"><col></colgroup>' +
    '<thead><tr><th class="l">Time (PT)</th><th class="l">Actor</th><th class="l">Action</th><th class="l">Ref</th><th class="l" style="padding-left:8px">Note</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
}

/* ---------- mount ---------- */
renderTop();
document.getElementById('left').innerHTML = renderHero() + renderPipeline() + renderSnapshot() + renderTradelines();
document.getElementById('right').innerHTML = renderQueue() + renderApplicant() + renderOffers() + renderLenders() + renderNotice();
document.getElementById('bottom').innerHTML = renderEval() + renderAudit();

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-toast]') : null;
  if (t && !t.disabled) { toast(t.getAttribute('data-toast')); return; }
  var f = e.target.closest ? e.target.closest('[data-f]') : null;
  if (f) {
    var btns = f.parentNode.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-selected', btns[i] === f ? 'true' : 'false');
    document.getElementById('offersBody').innerHTML = offersBody(f.getAttribute('data-f'));
  }
});
})();
</script>
</body>
</html>
