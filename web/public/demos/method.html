<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket · Method study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafbfc; --ink:#0b0d12; --mute:#6a7280; --soft:#9aa1ad; --line:#e6e8ec; --hover:#f2f4f7; --white:#fff;
  --green:#22a050; --amber:#e0a013; --red:#e5534b; --grey:#5b6370;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:40px; --s7:64px;
  --sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{max-width:1600px;margin:0 auto;padding:0 var(--s6) 96px}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13.5px;letter-spacing:-.01em}
.mute{color:var(--mute)}
.r{text-align:right}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

/* top bar */
.top{display:flex;align-items:center;gap:var(--s3);height:64px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:18px;letter-spacing:-.01em}
.tagline{color:var(--mute);margin-left:var(--s2)}
.nav{margin-left:auto;display:flex;gap:var(--s5)}
.nav a{color:var(--mute);text-decoration:none;font-size:15px}
.nav a:hover{color:var(--ink)}

/* sections */
section{margin-top:var(--s7)}
section:first-of-type{margin-top:var(--s6)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);padding-bottom:var(--s3)}
h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
h2 .c{font-weight:400;color:var(--mute)}
h3{margin:var(--s6) 0 0;font-size:17px;font-weight:600}
.meta{display:inline-flex;align-items:center;gap:var(--s2);color:var(--mute);font-size:14.5px}
.meta svg{flex:none}

/* entity header */
.entity h1{margin:0;font-size:26px;line-height:34px;font-weight:700;letter-spacing:-.015em}
.entity .idline{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);color:var(--mute)}
.entity .idline .mono{font-size:14.5px}
.entity .sub{margin-top:var(--s2);color:var(--mute)}
.entity .sub b{color:var(--ink);font-weight:500}

/* key/value overview: no chrome */
.kv{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,3),minmax(40px,auto));grid-template-columns:1fr 1fr;column-gap:56px;margin:0;border-top:1px solid var(--line);padding-top:var(--s2)}
.kv-i{display:grid;grid-template-columns:200px minmax(0,1fr);align-items:center;column-gap:var(--s3);min-height:40px}
.kv dt{color:var(--mute);font-size:15px}
.kv dd{margin:0;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.flagrow{display:grid;grid-template-columns:200px 1fr;column-gap:var(--s3);align-items:center;min-height:48px;border-top:1px solid var(--line);margin-top:var(--s2)}
.flagrow .pills{display:flex;flex-wrap:wrap;gap:var(--s2)}
.flagrow dt{color:var(--mute)}

/* tables: hairlines only */
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{height:40px;text-align:left;font-weight:400;color:var(--mute);font-size:14.5px;padding:0 var(--s2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
thead th.r{text-align:right}
tbody td{height:44px;padding:var(--s2);border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px}
tbody tr.nb td{border-bottom:0}
tbody tr:not(.note):hover td{background:var(--hover)}
tbody tr.sel td{background:#f5f6f8}
td.ell,th.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.wrap{white-space:normal;overflow-wrap:anywhere;line-height:1.4}
tbody tr.note td{height:auto;padding:0 var(--s2) var(--s3) 56px;background:transparent}
.hs{display:flex;gap:var(--s3);align-items:baseline;color:var(--ink);font-size:14.5px}
.hs .t{color:var(--red);font-weight:600;white-space:nowrap}
.cellflex{display:flex;align-items:center;gap:var(--s3);min-width:0}
.cellflex .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.cellflex .pa{color:var(--mute);white-space:nowrap}

/* pills with a dot */
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px 1px 8px;border:1px solid var(--line);background:var(--white);border-radius:999px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.pill.caps{font-size:12px;letter-spacing:.05em;font-weight:600;text-transform:uppercase}
.pill.muted{color:var(--mute);font-weight:400}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none}
.d-green{background:var(--green)}.d-amber{background:var(--amber)}.d-red{background:var(--red)}
.d-ink{background:var(--ink)}.d-grey{background:var(--grey)}.d-none{background:transparent;box-shadow:inset 0 0 0 1px var(--soft)}
.d-pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.d-pulse{animation:none}}
.tag{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-size:13px;font-weight:600;white-space:nowrap}

/* avatars */
.av{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;letter-spacing:.02em}
.av.ic{background:var(--ink)}
.av svg{display:block}

/* buttons */
.btn{font:500 14px/1 var(--sans);height:28px;padding:0 12px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#252932}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn[aria-pressed="true"]{border-color:var(--ink)}
.acts{display:flex;gap:var(--s2);justify-content:flex-end}

/* lenders */
.lhead,.lrow{display:grid;grid-template-columns:minmax(220px,2.4fr) 140px 72px 104px 72px 112px 124px;column-gap:var(--s2);align-items:center;padding:0 var(--s2)}
.lhead{height:40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mute);font-size:14.5px}
.lender{border-bottom:1px solid var(--line)}
.lrow{min-height:52px;padding-top:var(--s2);padding-bottom:var(--s2)}
.lrow .nm{font-weight:600}
.lrow .sub{color:var(--mute);font-size:14px}
.best-apr{color:var(--green);font-weight:700}
.ldetail{display:grid;grid-template-columns:1fr 1.5fr;column-gap:56px;padding:0 var(--s2) var(--s5) 44px}
.ldetail h4{margin:0 0 var(--s2);font-size:14px;font-weight:400;color:var(--mute)}
.ldetail ul{list-style:none;margin:0;padding:0}
.ldetail li{display:grid;grid-template-columns:20px 1fr;column-gap:var(--s2);padding:4px 0;line-height:1.4}
.ldetail .cond li::before{content:"";width:8px;height:1px;background:var(--soft);margin-top:11px;margin-left:4px}
.ldetail .why{display:block}
.ldetail .why .f{display:block;color:var(--soft);margin-top:2px}
.vt svg{display:block;margin-top:2px}
.vt .v1{fill:var(--green)}.vt .v0{fill:var(--red)}.vt .vn{fill:none;stroke:var(--soft);stroke-dasharray:2 2}
.legend{display:flex;gap:var(--s4);color:var(--mute);font-size:14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* notice */
.notice{border-top:1px solid var(--line);padding-top:var(--s5);max-width:78ch}
.notice p{margin:0 0 var(--s4);font-size:15.5px;line-height:1.65}
.notice p:first-child{font-weight:500}

/* bars */
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

footer{margin-top:var(--s7);padding-top:var(--s4);border-top:1px solid var(--line);color:var(--soft);font-size:14px;display:flex;justify-content:space-between}
@media (max-width:1100px){.kv{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr}.ldetail{grid-template-columns:1fr}.nav{display:none}}
</style>
</head>

    else if (k === 'style') e.style.cssText = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');

  });

    list.forEach(function(c){
      if (c == null || c === false) return;
      if (Array.isArray(c)) return add(c);

}

        : '<path d="M5.4 8h5.2" fill="none" stroke="#9aa1ad" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0"/>';
  var el = h('span',{class:'vt',title:txt,role:'img','aria-label':txt});
  el.append(svg('<svg width="16" height="16" viewBox="0 0 16 16"><circle class="'+cls+'" cx="8" cy="8" r="'+(v==null?7.2:8)+'"/>'+g+'</svg>'));
  return el;
}
var CLS = { approve:['green','Offer'], counteroffer:['amber','Counteroffer'], deny:['red','Declined'] };

function lenders(){
  var offers = SEL.offers;
  var min = Infinity, bestId = null;
  offers.forEach(function(o){ if (o.apr != null && o.apr < min){ min = o.apr; bestId = o.lender; } });
  var legend = h('div',{class:'legend'},
    h('span',null, vmark(true), 'Verified'), h('span',null, vmark(false), 'Unsupported'), h('span',null, vmark(null), 'Not tested'));
  var list = offers.map(function(o){
    var c = CLS[o.classification] || ['grey', o.classification];
    var isBest = o.lender === bestId;
    var has = o.apr != null;
    var row = h('div',{class:'lrow'},
      h('div',{class:'cellflex'}, avatar(o.name),
        h('div',{style:'min-width:0'},
          h('div',{class:'nm'}, o.name, ' ', isBest ? h('span',{class:'tag'}, svg(STAR), 'Best APR') : null),
          h('div',{class:'sub'}, o.label + ' · ' + o.policy))),
      h('div',null, pill(c[0], c[1], 'caps')),
      h('div',{class:'r num'+(isBest?' best-apr':'')}, aprF(o.apr)),
      h('div',{class:'r num'}, has ? usd(o.monthlyPayment,2) : '—'),
      h('div',{class:'r num'}, has ? o.termMonths + ' mo' : '—'),
      h('div',{class:'r num'}, has ? usd(o.amount,2) : '—'),
      h('div',{class:'r num mute'}, o.provider + ' · ' + secs(o.latencyMs)));
    var conds = h('div',{class:'cond'}, h('h4',null,'Conditions' + (o.conditions.length ? ' ('+o.conditions.length+')' : '')),
      o.conditions.length ? h('ul',null, o.conditions.map(function(t){ return h('li',null, h('span',{style:'grid-column:2'},t)); }))
                          : h('div',{class:'mute'},'None'));
    var why = h('div',null, h('h4',null,'Reasons ('+o.reasons.length+')'),
      h('ul',null, o.reasons.map(function(r){
        return h('li',null, vmark(r.verified), h('span',{class:'why'}, r.text, h('span',{class:'f mono'}, r.field)));
      })));
    return h('article',{class:'lender','aria-label':o.name}, row, h('div',{class:'ldetail'}, conds, why));
  });
  var head = h('div',{class:'lhead',role:'presentation'},
    h('div',null,'Lender'), h('div',null,'Status'), h('div',{class:'r'},'APR'), h('div',{class:'r'},'Monthly'),
    h('div',{class:'r'},'Term'), h('div',{class:'r'},'Amount'), h('div',{class:'r'},'Latency'));
  return section('lenders','Lenders',offers.length, legend, [head, list]);
}

function credit(){
  var b = SEL.bundle;
  var FL = { deceased:'Deceased', frozen:'Frozen file', bankruptcy:'Bankruptcy', eviction:'Eviction', lienOrJudgment:'Lien or judgment' };
  var flags = h('div',{class:'pills'}, Object.keys(b.flags).map(function(k){
    return b.flags[k] ? pill('red', FL[k] || k) : pill('none', FL[k] || k, 'muted');
  }));
  var flagrow = h('dl',{class:'flagrow',style:'margin-bottom:0'}, h('dt',null,'Flags'), h('dd',{style:'margin:0'}, flags));
  var grid = kv([
    ['Score', h('b',{class:'num'}, b.score)],
    ['VantageScore 4.0', h('span',{class:'num'}, b.vantage4)],
    ['Utilization', h('span',{class:'num'}, pct(b.utilization))],
    ['Inquiries, 6 months', h('span',{class:'num'}, b.inquiries6mo)],
    ['Identity', b.identityVerified ? pill('green','Verified') : pill('red','Not verified')],
    ['Fraud score', h('span',{class:'num'}, b.fraudScore)]
  ]);
  var TL = { open:['green','Open'], closed:['ink','Closed'], charge_off:['red','Charge-off'] };
  var rows = b.tradelines.map(function(t, i){
    var id = 'tl_' + String(i+1).padStart(2,'0');
    var on = !!state.disp[i];
    var st = TL[t.status] || ['grey', t.status];
    return h('tr',null,
      h('td',null, h('span',{class:'cellflex'}, t.type === 'auto' ? iconAv(CAR,'#2f6690') : iconAv(CARD,'#2b3a55'),
        h('span',{class:'nm'}, t.type === 'auto' ? 'Auto loan' : 'Credit card'))),
      h('td',{class:'mono mute'}, id),
      h('td',null, pill(st[0], st[1])),
      h('td',{class:'num'}, t.openedAt),
      h('td',{class:'r num'}, usd(t.balance,2)),
      h('td',null, h('div',{class:'acts'}, h('button',{class:'btn',type:'button','aria-pressed':on?'true':'false','data-k':'disp'+i,
        'aria-label':'Dispute tradeline '+id,
        onclick:function(){ act('disp'+i, function(){ state.disp[i] = !state.disp[i]; }); }}, on ? 'Dispute drafted' : 'Dispute'))));
  });
  var tl = h('div',null, h('h3',null,'Tradelines ', h('span',{class:'mute',style:'font-weight:400'},'('+b.tradelines.length+')')),
    h('div',{style:'margin-top:var(--s3)'}, tbl([{w:'24%',label:'Type'},{w:'16%',label:'ID'},{w:'16%',label:'Status'},{w:'16%',label:'Opened'},{label:'Balance',r:1},{w:'164px',label:'',r:1}], rows, 'Tradelines')));
  return section('credit','Credit snapshot',null, meta(b.source.toUpperCase() + ' sandbox · pulled ' + dateTime(b.pulledAt)), [grid, flagrow, tl]);
}

function notice(){
  var paras = SEL.notice.split(/\n\s*\n/);
  return section('notice','Adverse-action notice',null, meta('Drafted for ' + SEL.name),
    h('div',{class:'notice'}, paras.map(function(p){ return h('p',null,p.trim()); })));
}

function audit(){
  var rows = D.audit.map(function(a){
    return h('tr',null,
      h('td',{class:'mono num'}, mFmt.format(a.at)),
      h('td',{class:'ell',title:a.actor}, a.actor),
      h('td',{class:'mono ell',title:a.action}, a.action),
      h('td',{class:'mono mute ell',title:a.ref||''}, a.ref || '—'),
      h('td',{class:'wrap'}, a.note));
  });
  return section('audit','Audit log',D.audit.length, meta('Times in Pacific, ' + dFmt.format(D.audit[D.audit.length-1].at)),
    tbl([{w:'118px',label:'Time'},{w:'190px',label:'Actor',ell:1},{w:'190px',label:'Action'},{w:'240px',label:'Ref'},{label:'Note'}], rows, 'Audit log'));
}

function evalSec(){
  var e = D.eval;
  var max = Math.max.apply(null, Object.keys(e.latencyP50Ms).map(function(k){ return e.latencyP50Ms[k]; }));
  var rows = Object.keys(e.latencyP50Ms).map(function(k){
    var ms = e.latencyP50Ms[k], l = L[k] || {name:k};
    return h('tr',null,
      h('td',null, h('span',{class:'cellflex'}, avatar(l.name), h('span',{class:'nm'}, l.name))),
      h('td',{class:'mono mute'}, k),
      h('td',{class:'r num'}, ms.toLocaleString('en-US') + ' ms'),
      h('td',null, h('div',{class:'bar',role:'img','aria-label':secs(ms)}, h('i',{style:'width:'+(ms/max*100)+'%'}))));
  });
  return section('eval','Eval',null, meta('Last run ' + dateTime(Date.parse(e.lastRun))), [
    kv([
      ['Cases', h('span',{class:'num'}, e.cases)],
      ['Agreement', h('span',{class:'num'}, pct(e.agreement))],
      ['Per-lender agreement', h('span',{class:'num'}, pct(e.perLenderAgreement))],
      ['Reasons verified', h('span',{class:'num'}, pct(e.reasonsVerified))],
      ['Fraud cases', e.fraudZeroOffers ? pill('green','Zero offers') : pill('red','Offers issued')],
      ['Avg reasons per denial', h('span',{class:'num'}, e.avgReasonsPerDenial.toFixed(2))],
      ['Last run', dateTime(Date.parse(e.lastRun))]
    ]),
    h('h3',null,'Median latency by lender'),
    h('div',{style:'margin-top:var(--s3)'}, tbl([{w:'34%',label:'Lender'},{w:'12%',label:'ID'},{w:'140px',label:'p50',r:1},{label:''}], rows, 'Median latency by lender'))
  ]);
}

function render(){
  var app = document.getElementById('app');
  var y = window.scrollY;
  app.replaceChildren(top(), desk(), queue(), applicant(), pipeline(), lenders(), credit(), notice(), audit(), evalSec(),
    h('footer',null, h('span',null, P.name + ' · ' + P.tagline + ' · sandbox data only'), h('span',null,'Design study after Method')));
  if (state.focus){
    var el = app.querySelector('[data-k="'+state.focus+'"]');
    if (el && !el.disabled) el.focus({preventScroll:true});
    state.focus = null;
  }
  window.scrollTo(0, y);
}
render();
})();
</script>
</body>
</html>
